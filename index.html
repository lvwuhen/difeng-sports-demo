<!DOCTYPE html>
<html lang="zh-CN">
<head>

<script src="auth-gate.js?v=20261105"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 - 地丰体育场馆预约与管理系统</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app-shell"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="mock.js"></script>
<script src="api.js"></script>
<script src="shell.js"></script>
<script>
window.__PREFIX__ = '';
renderShell('dashboard', '工作台');

const today = new Date();
const dateStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');

document.getElementById('page-content').innerHTML = `
<div class="page-header">
  <div class="page-title">经营看板 <span style="font-size:13px;color:var(--text-3);font-weight:400;margin-left:8px">${dateStr} 实时数据</span></div>
  <div class="page-desc">汇总全场馆当日经营核心指标，数据每分钟刷新</div>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-label">今日营业收入 <span class="stat-icon blue"><i data-lucide="banknote"></i></span></div>
    <div class="stat-value">¥26,750</div>
    <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i> 较昨日 +8.2%</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">今日订单数 <span class="stat-icon green"><i data-lucide="receipt"></i></span></div>
    <div class="stat-value">128</div>
    <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i> 较昨日 +5.0%</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">今日核销笔数 <span class="stat-icon cyan"><i data-lucide="scan-line"></i></span></div>
    <div class="stat-value">96</div>
    <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i> 核销率 75.0%</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">今日退款笔数 <span class="stat-icon red"><i data-lucide="rotate-ccw"></i></span></div>
    <div class="stat-value">3</div>
    <div class="stat-trend down"><i data-lucide="trending-down" style="width:14px"></i> 退款金额 ¥520</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">在线支付占比 <span class="stat-icon purple"><i data-lucide="credit-card"></i></span></div>
    <div class="stat-value">78%</div>
    <div class="stat-trend" style="color:var(--text-3)">现金 12% · 储值 10%</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">场地使用率 <span class="stat-icon orange"><i data-lucide="calendar-check"></i></span></div>
    <div class="stat-value">62.5%</div>
    <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i> 较上周 +3.1%</div>
  </div>
</div>

<div class="stats-grid" style="grid-template-columns:2fr 1fr">
  <div class="card">
    <div class="card-header">
      <div class="card-title">近7日营业收入趋势</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-default btn-sm" onclick="changeChart('week')">周</button>
        <button class="btn btn-default btn-sm" onclick="changeChart('month')">月</button>
      </div>
    </div>
    <div class="card-body">
      <div class="bar-chart" id="revenueChart"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><div class="card-title">收入渠道占比</div></div>
    <div class="card-body">
      <div id="channelChart" style="height:200px"></div>
    </div>
  </div>
</div>

<div class="stats-grid" style="grid-template-columns:1fr 1fr">
  <div class="card">
    <div class="card-header">
      <div class="card-title">待处理事项</div>
      <a class="btn btn-ghost btn-sm">全部</a>
    </div>
    <div class="card-body no-pad">
      <div class="list-row" style="padding:12px 20px">
        <span class="tag tag-red">紧急</span>
        <div class="flex-1">应收单 AR20261028 推送失败，需人工补偿</div>
        <button class="btn btn-primary btn-sm" onclick="toast('已跳转至业财模块','info')">处理</button>
      </div>
      <div class="list-row" style="padding:12px 20px">
        <span class="tag tag-orange">待办</span>
        <div class="flex-1">5个商品库存低于预警阈值（能量棒等）</div>
        <button class="btn btn-default btn-sm" onclick="toast('已跳转至仓储模块','info')">查看</button>
      </div>
      <div class="list-row" style="padding:12px 20px">
        <span class="tag tag-blue">待办</span>
        <div class="flex-1">3张发票开具失败，需重新发起</div>
        <button class="btn btn-default btn-sm" onclick="toast('已跳转至发票模块','info')">处理</button>
      </div>
      <div class="list-row" style="padding:12px 20px">
        <span class="tag tag-gray">提醒</span>
        <div class="flex-1">今日23:00将自动推送当日应收单至用友NCC</div>
        <button class="btn btn-ghost btn-sm">已知晓</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title">各场馆今日收入</div>
      <a class="btn btn-ghost btn-sm">详情</a>
    </div>
    <div class="card-body no-pad">
      <div class="list-row" style="padding:12px 20px">
        <div class="flex-1">
          <div class="font-medium">地丰体育中心（总部）</div>
          <div class="progress mt-8"><div class="progress-bar" style="width:75%"></div></div>
        </div>
        <div class="text-right" style="margin-left:16px">
          <div class="font-bold">¥18,650</div>
          <div class="text-muted" style="font-size:12px">68单</div>
        </div>
      </div>
      <div class="list-row" style="padding:12px 20px">
        <div class="flex-1">
          <div class="font-medium">地丰篮球公园</div>
          <div class="progress mt-8"><div class="progress-bar" style="width:45%;background:var(--success)"></div></div>
        </div>
        <div class="text-right" style="margin-left:16px">
          <div class="font-bold">¥9,820</div>
          <div class="text-muted" style="font-size:12px">32单</div>
        </div>
      </div>
      <div class="list-row" style="padding:12px 20px">
        <div class="flex-1">
          <div class="font-medium">地丰网球中心</div>
          <div class="progress mt-8"><div class="progress-bar" style="width:18%;background:var(--warning)"></div></div>
        </div>
        <div class="text-right" style="margin-left:16px">
          <div class="font-bold">¥3,680</div>
          <div class="text-muted" style="font-size:12px">15单</div>
        </div>
      </div>
      <div class="list-row" style="padding:12px 20px">
        <div class="flex-1">
          <div class="font-medium">地丰羽毛球馆</div>
          <div class="progress mt-8"><div class="progress-bar" style="width:28%;background:var(--purple)"></div></div>
        </div>
        <div class="text-right" style="margin-left:16px">
          <div class="font-bold">¥5,940</div>
          <div class="text-muted" style="font-size:12px">23单</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card mt-20">
  <div class="card-header">
    <div class="card-title">最近订单</div>
    <a href="pages/order.html" class="btn btn-ghost btn-sm">查看全部 →</a>
  </div>
  <div class="card-body no-pad">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr>
          <th>订单号</th><th>来源</th><th>客户</th><th>场馆/场地</th><th>时段</th><th>金额</th><th>支付方式</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody id="recentOrders"></tbody>
      </table>
    </div>
  </div>
</div>
`;

// 渲染图表
function renderRevenueChart(){
  const data = MOCK.dailyRevenue;
  const max = Math.max(...data.map(d=>d.revenue));
  document.getElementById('revenueChart').innerHTML = data.map(d=>`
    <div class="bar">
      <div class="bar-fill" style="height:${(d.revenue/max*100)}%" title="¥${d.revenue}"></div>
      <div class="bar-label">${d.date}</div>
    </div>
  `).join('');
}
function renderChannelChart(){
  const data = MOCK.channelData;
  let cumulative = 0;
  const gradient = data.map(d=>{
    const pct = d.value;
    const seg = `${d.color} ${cumulative}% ${cumulative+pct}%`;
    cumulative += pct;
    return seg;
  }).join(', ');
  const legend = data.map(d=>`
    <div class="list-row" style="padding:6px 0">
      <span class="dot" style="background:${d.color}"></span>
      <span class="flex-1">${d.name}</span>
      <span class="font-medium">${d.value}%</span>
    </div>
  `).join('');
  document.getElementById('channelChart').innerHTML = `
    <div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(${gradient});margin:0 auto 16px;display:flex;align-items:center;justify-content:center">
      <div style="width:90px;height:90px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-size:11px;color:var(--text-3)">总渠道</div>
        <div style="font-size:20px;font-weight:700">4</div>
      </div>
    </div>
    ${legend}
  `;
}
function renderRecentOrders(){
  const rows = MOCK.orders.slice(0,5).map(o=>{
    const statusTag = {
      '待支付':'tag-orange','已支付':'tag-blue','已核销':'tag-green',
      '已退款':'tag-gray','已取消':'tag-red','已完成':'tag-green'
    }[o.status] || 'tag-gray';
    return `<tr>
      <td class="mono" style="font-size:13px">${o.id}</td>
      <td><span class="tag ${o.source==='小程序'?'tag-blue':o.source==='美团'?'tag-orange':o.source==='抖音'?'tag-purple':'tag-gray'}">${o.source}</span></td>
      <td>${o.customer}</td>
      <td>${o.venue}<br><span class="text-muted" style="font-size:12px">${o.court}</span></td>
      <td style="font-size:13px">${o.time}</td>
      <td class="font-medium">¥${o.amount}</td>
      <td style="font-size:13px">${o.payMethod}</td>
      <td><span class="tag ${statusTag}">${o.status}</span></td>
      <td><button class="btn btn-ghost btn-sm" onclick="toast('查看订单 ${o.id}','info')">详情</button></td>
    </tr>`;
  }).join('');
  document.getElementById('recentOrders').innerHTML = rows;
}
window.changeChart = (type)=>{ toast('切换至'+(type==='week'?'周':'月')+'视图','info'); };

renderRevenueChart();
renderChannelChart();
renderRecentOrders();
if(window.lucide) lucide.createIcons();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地丰体育 · 确认订单</title>
<link rel="stylesheet" href="../mobile.css">
</head>
<body data-status="dark">
<div class="app">
  <div class="scroll" id="scroll">
    <div class="navbar">
      <button class="nav-back" id="backBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>
      </button>
      <div class="nav-title">确认订单</div>
      <span class="nav-spacer"></span>
    </div>

    <div id="body"></div>
    <div class="scroll-pad lg"></div>
  </div>

  <div class="sticky-bar" id="sticky">
    <div class="sum">
      <div class="sum-label">实付金额</div>
      <div class="sum-total">¥<span id="payTotal">0</span></div>
    </div>
    <button class="btn btn-primary" id="submitBtn" style="min-width:132px">提交订单</button>
  </div>
  <div class="homebar"></div>
</div>
<script src="../mobile-mock.js"></script>
<script>
(function(){
  var draft = M.state.draft;
  if (!draft || !draft.courtId){
    M.$('#body').innerHTML = '<div class="empty"><div class="e-ico">' + M.icon('calendar', 28) + '</div><p>还没有选择场地与时段<br>请先返回场馆选择可预约时段</p>' +
      '<a class="btn btn-primary btn-md mt12" href="venues.html" style="display:inline-flex">去预约</a></div>';
    M.$('#sticky').style.display = 'none';
    M.init({});
    return;
  }

  var m = M.state.member;
  var method = 'wechat';
  var useInvoice = false;
  var agreed = false;
  var cards = M.state.cards.filter(function(c){ return c.status === '有效' && c.used < c.total && c.type === draft.sport; });
  var giftUsed = Math.min(m.gift, draft.amount);
  var balanceUse = Math.min(m.balance, Math.max(0, draft.amount - giftUsed));
  var balanceEnough = (giftUsed + balanceUse) >= draft.amount;

  function render(){
    M.$('#body').innerHTML =
      '<div class="section tight" style="margin-top:10px">' +
        '<div class="card">' +
          '<div class="row gap12">' +
            '<div style="width:48px;height:48px;border-radius:12px;background:var(--m-primary-bg);color:var(--m-primary);display:grid;place-items:center;flex-shrink:0">' + M.icon('sport', 24) + '</div>' +
            '<div class="flex1"><div style="font-size:15px;font-weight:600">' + draft.venueName + ' · ' + draft.courtName + '</div>' +
              '<div class="sub" style="margin-top:3px">' + draft.sport + ' · ' + (M.court(draft.courtId).area || '') + '</div></div>' +
            '<span class="tag tag-blue">小程序预约</span>' +
          '</div>' +
          '<div class="divider"></div>' +
          '<div class="kv-row"><span class="k">预约日期</span><span class="v">' + M.dateCN(draft.date) + ' ' + M.weekCN(draft.date) + '</span></div>' +
          '<div class="kv-row"><span class="k">预约时段</span><span class="v strong">' + draft.time + '（' + draft.duration + ' 分钟）</span></div>' +
          '<div class="kv-row"><span class="k">场地费</span><span class="v">¥' + M.rmb(draft.amount) + '</span></div>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="card">' +
          '<div class="form-item"><span class="f-label">联系人</span><input class="form-input" id="contactName" value="' + m.name + '" readonly></div>' +
          '<div class="form-item"><span class="f-label">手机号</span><input class="form-input" id="contactPhone" value="' + m.phone + '" readonly></div>' +
          '<div class="form-item" style="border-bottom:0"><span class="f-label">备注</span><input class="form-input" id="remark" placeholder="选填，可填写同行人数等"></div>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="card">' +
          '<div class="between" style="padding:3px 0 10px">' +
            '<span style="font-size:14px;font-weight:500">电子发票</span>' +
            '<label class="switch"><input type="checkbox" id="invoiceSwitch"><span class="slider"></span></label>' +
          '</div>' +
          '<div class="sub" style="border-top:1px solid var(--m-line);padding-top:10px" id="invoiceHint">订单支付完成后自动开具电子发票，开票信息可在「我的」中维护。</div>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="card">' +
          '<div class="between" style="padding:3px 0"><span style="font-size:14px">优惠券</span><span class="sub">暂无可用券</span></div>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="card">' +
          '<div style="font-size:14px;font-weight:500;margin-bottom:4px">支付方式</div>' +
          payRow('wechat', 'card', '微信支付', '兴业银行兴E付 · 聚合收单', 'tag-green', '推荐') +
          payRow('balance', 'wallet', '储值余额', balanceEnough ? '可用余额 ¥' + M.rmb(m.balance + m.gift) + (m.gift ? '（含赠送 ¥' + m.gift + '）' : '') : '余额不足，请先充值', 'tag-blue', balanceEnough ? '' : '不足') +
          (cards.length
            ? payRow('card', 'ticket', '次卡抵扣', cards[0].name + ' · 剩余 ' + (cards[0].total - cards[0].used) + ' 次', 'tag-purple', '')
            : '') +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="notice-box">' +
          '<span style="flex-shrink:0">说明</span>' +
          '<span>支付成功即锁定该时段；开班前可在订单详情申请整单退款，退款按原支付渠道退回，不收取手续费。</span>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<div class="row gap8" id="agreeRow" style="cursor:pointer">' +
          '<span class="checkbox' + (agreed ? ' on' : '') + '" id="agreeBox"></span>' +
          '<span class="sub">我已阅读并同意《场馆预约服务协议》与《退款规则》</span>' +
        '</div>' +
      '</div>';

    M.$$('.pay-method').forEach(function(el){
      el.addEventListener('click', function(){
        var v = el.getAttribute('data-method');
        if (v === 'balance' && !balanceEnough){ M.toast('储值余额不足，请先充值'); return; }
        var rv = M.$('#remark') ? M.$('#remark').value : '';
        method = v;
        render();
        if (M.$('#remark')) M.$('#remark').value = rv;
      });
    });
    M.$('#invoiceSwitch').checked = useInvoice;
    M.$('#invoiceSwitch').addEventListener('change', function(e){
      useInvoice = e.target.checked;
      M.$('#invoiceHint').textContent = useInvoice
        ? '将按「' + M.state.invoiceInfo.title + '」开具电子发票，发送至 ' + (M.state.invoiceInfo.email || '未填写邮箱')
        : '订单支付完成后自动开具电子发票，开票信息可在「我的」中维护。';
    });
    M.$('#agreeRow').addEventListener('click', function(){
      agreed = !agreed;
      M.$('#agreeBox').classList.toggle('on', agreed);
    });

    M.$('#payTotal').textContent = M.rmb(draft.amount);
  }

  function payRow(id, ic, name, desc, tone, badge){
    return '<div class="pay-method" data-method="' + id + '">' +
      '<div class="pm-ico" style="background:' + (id === 'wechat' ? '#ecfdf5' : (id === 'balance' ? 'var(--m-primary-bg)' : 'var(--m-purple-bg)')) + ';color:' + (id === 'wechat' ? '#10b981' : (id === 'balance' ? '#1677ff' : '#8b5cf6')) + '">' + M.icon(ic, 19) + '</div>' +
      '<div class="flex1"><div class="pm-name">' + name + (badge ? ' <span class="tag ' + tone + '" style="margin-left:4px">' + badge + '</span>' : '') + '</div>' +
        '<div class="pm-desc">' + desc + '</div></div>' +
      '<div class="radio' + (method === id ? ' on' : '') + '"></div>' +
    '</div>';
  }

  M.$('#backBtn').addEventListener('click', function(){ M.go('booking.html?court=' + draft.courtId); });

  M.$('#submitBtn').addEventListener('click', function(){
    if (!agreed){ M.toast('请先阅读并同意服务协议'); return; }
    if (method === 'balance' && !balanceEnough){ M.toast('储值余额不足，请先充值'); return; }
    var remark = (M.$('#remark').value || '').trim();
    var payAmount = method === 'wechat' ? draft.amount : 0;

    if (method === 'card'){
      var card = cards[0];
      M.pay({ amount: 0, method: 'card', onSuccess: function(){
        card.used += 1;
        if (card.used >= card.total) card.status = '已用完';
        finish('次卡抵扣', 'card', 0);
      }});
      return;
    }
    if (method === 'balance'){
      M.pay({ amount: draft.amount, method: 'balance', onSuccess: function(){
        var remain = draft.amount;
        var g = Math.min(m.gift, remain);
        m.gift -= g; remain -= g;
        m.balance -= remain;
        M.state.flows.unshift({ date: M.today() + ' ' + nowHM(), label:'场地消费 · ' + draft.courtName, type:'consume', amount: draft.amount, method:'储值余额' });
        finish('储值余额', 'balance', draft.amount);
      }});
      return;
    }
    M.pay({ amount: draft.amount, method: 'wechat', onSuccess: function(){
      finish('微信支付', 'wechat', draft.amount);
    }});
  });

  function nowHM(){
    var d = new Date();
    return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }

  function finish(payMethod, payment, paid){
    var invoice = {
      status: useInvoice ? '申请中' : '未开具',
      email: useInvoice ? M.state.invoiceInfo.email : ''
    };
    var order = M.createOrder({
      type:'court', courtId: draft.courtId, title: draft.venueName + ' · ' + draft.courtName,
      venue: draft.venueName, court: draft.courtName, sport: draft.sport,
      date: draft.date, time: draft.time, startMin: draft.startMin, duration: draft.duration,
      amount: draft.amount, paid: paid, payMethod: payMethod, payment: payment,
      status: 'paid', verifyCode: genCode(), invoice: invoice,
      remark: (M.$('#remark').value || '').trim(),
      createdAt: M.today() + ' ' + nowHM()
    });
    M.state.draft = null;
    M.save();
    M.go('pay-result.html?id=' + order.id);
  }

  function genCode(){
    var a = String(Math.floor(Math.random() * 9000) + 1000);
    var b = String(Math.floor(Math.random() * 9000) + 1000);
    return a + b;
  }

  render();
  M.init({});
})();
</script>
</body>
</html>

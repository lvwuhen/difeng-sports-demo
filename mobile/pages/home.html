<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地丰体育 · 首页</title>
<link rel="stylesheet" href="../mobile.css">
</head>
<body data-status="light">
<div class="app" style="padding-top:0">
  <div class="scroll">
    <section class="hero">
      <div class="hero-top">
        <div class="hero-brand">
          <div class="hero-logo">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><path d="M5.4 7.8c3.4 2 9.8 2 13.2 0M5.4 16.2c3.4-2 9.8-2 13.2 0M12 3.6v16.8"/></svg>
          </div>
          <div>
            <div class="hero-name">地丰体育</div>
            <div class="hero-sub">DIFENG SPORTS</div>
          </div>
        </div>
        <a class="hero-bell" href="me.html" aria-label="消息">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16.2V11a6 6 0 1 0-12 0v5.2L4 19h16l-2-2.8z"/><path d="M9.6 19.5a2.4 2.4 0 0 0 4.8 0"/></svg>
          <span class="dot"></span>
        </a>
      </div>
      <div class="hero-greet">
        <h1>下午好，<span id="uname">陈晓明</span></h1>
        <p>全城 4 座场馆 · 60 片场地，随时开打</p>
      </div>
      <div class="searchbar" id="heroSearch">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#9aa3b2" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m20 20-4.2-4.2"/></svg>
        <span>搜索场馆、场地或赛事</span>
      </div>
    </section>

    <div class="quick-grid">
      <a class="quick" href="venues.html">
        <span class="q-ico"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.2"/><path d="M3 10.2h18M7.6 3v4M16.4 3v4"/><path d="M8 14.5h2M14 14.5h2"/></svg></span>
        <span>在线订场</span>
      </a>
      <a class="quick" href="timecard.html">
        <span class="q-ico green"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8.2A2.2 2.2 0 0 1 6.2 6h11.6A2.2 2.2 0 0 1 20 8.2v.6a2.4 2.4 0 0 0 0 4.8v.6a2.2 2.2 0 0 1-2.2 2.2H6.2A2.2 2.2 0 0 1 4 15.8v-.6a2.4 2.4 0 0 0 0-4.8v-.6z"/><path d="M12 7.4v2.2M12 12v2.2M12 16.4v2.2"/></svg></span>
        <span>次卡购买</span>
      </a>
      <a class="quick" href="events.html">
        <span class="q-ico orange"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 4h8v5.2a4 4 0 0 1-8 0V4z"/><path d="M8 5.6H5.2A2.8 2.8 0 0 0 8 8.4M16 5.6h2.8A2.8 2.8 0 0 1 16 8.4"/><path d="M12 13.4v3.4M9 20.6h6"/></svg></span>
        <span>赛事报名</span>
      </a>
      <a class="quick" href="member.html">
        <span class="q-ico purple"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10.2h18"/><circle cx="17" cy="15" r="1.4"/></svg></span>
        <span>会员储值</span>
      </a>
    </div>

    <div class="section tight">
      <div class="notice" id="noticeBar">
        <span class="n-label">公告</span>
        <span class="n-text" id="noticeText"></span>
        <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title"><span class="bar"></span>我的订单</div>
        <a class="section-more" href="orders.html">全部订单
          <svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg>
        </a>
      </div>
      <div class="card" style="padding:16px 6px">
        <div class="quick-grid" id="orderStats" style="margin:0;padding:0;box-shadow:none;border-radius:0;background:transparent"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title"><span class="bar"></span>附近场馆</div>
        <a class="section-more" href="venues.html">查看全部
          <svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg>
        </a>
      </div>
      <div id="venueList"></div>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title"><span class="bar"></span>热门赛事</div>
        <a class="section-more" href="events.html">全部赛事
          <svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg>
        </a>
      </div>
      <div id="eventList"></div>
    </div>
    <div class="scroll-pad"></div>
  </div>
</div>
<script src="../mobile-mock.js"></script>
<script>
(function(){
  var m = M.state.member;
  M.$('#uname').textContent = m.name;

  M.$('#heroSearch').addEventListener('click', function(){ M.go('venues.html'); });
  M.$('#noticeText').textContent = M.ANNOUNCEMENTS[0];
  M.$('#noticeBar').addEventListener('click', function(){
    M.modal({ title:'场馆公告', text: M.ANNOUNCEMENTS.join('<br><br>'), confirmText:'知道了', cancelText:false });
  });

  var stats = [
    { label:'待支付', icon:'wallet', filter:'pending' },
    { label:'待使用', icon:'ticket', filter:'paid' },
    { label:'已完成', icon:'check', filter:'used' },
    { label:'退款中', icon:'refresh', filter:'refunding' }
  ];
  M.$('#orderStats').innerHTML = stats.map(function(s){
    var n = M.state.orders.filter(function(o){ return o.status === s.filter; }).length;
    return '<a class="quick" href="orders.html?tab=' + s.filter + '">' +
      '<span class="q-ico" style="width:38px;height:38px;border-radius:11px;position:relative">' + M.icon(s.icon, 19) +
        (n ? '<span style="position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;border-radius:8px;background:#ef4444;color:#fff;font-size:9px;display:grid;place-items:center;padding:0 4px">' + n + '</span>' : '') +
      '</span><span>' + s.label + '</span></a>';
  }).join('');

  M.$('#venueList').innerHTML = M.VENUES.slice(0, 3).map(function(v){
    var tag = v.id === 'V001' ? '距你最近' : (v.id === 'V002' ? '夜场推荐' : '专业场地');
    return '<a class="venue-card pressable" href="venue-detail.html?id=' + v.id + '">' +
      '<div class="venue-thumb ' + v.thumb + '">' +
        '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="1.5"><circle cx="12" cy="12" r="8.4"/><path d="M5.4 7.8c3.4 2 9.8 2 13.2 0M5.4 16.2c3.4-2 9.8-2 13.2 0M12 3.6v16.8"/></svg>' +
        '<span class="vt-name">' + v.short + '</span>' +
      '</div>' +
      '<div class="venue-info">' +
        '<div class="venue-name">' + v.name + '</div>' +
        '<div class="venue-meta">' + M.icon('pin', 13) + v.district + ' · ' + v.distance + '</div>' +
        '<div class="venue-meta">' + M.icon('clock', 13) + v.openTime + ' · ' + v.courts + ' 片场地</div>' +
        '<div class="venue-tags"><span class="tag tag-blue">' + tag + '</span><span class="tag tag-gray">' + v.tags[0] + '</span></div>' +
      '</div>' +
      '<div class="chev">' + M.icon('right', 16) + '</div>' +
    '</a>';
  }).join('');

  var ev = M.EVENTS.filter(function(e){ return e.status === '报名中'; })[0] || M.EVENTS[0];
  M.$('#eventList').innerHTML =
    '<a class="event-card pressable" style="display:block" href="event-detail.html?id=' + ev.id + '">' +
      '<div class="event-cover ' + ev.cover + '">' +
        '<span class="ev-type">' + ev.type + ' · ' + ev.mode + '</span>' +
        '<span class="ev-name">' + ev.name + '</span>' +
      '</div>' +
      '<div class="event-body">' +
        '<div class="event-meta">' + M.icon('calendar', 14) + M.dateCN(ev.startDate) + ' · ' + M.weekCN(ev.startDate) + '</div>' +
        '<div class="event-meta mt6">' + M.icon('pin', 14) + ev.venue + '</div>' +
        '<div class="event-foot">' +
          '<span class="sub">' + (ev.priceFrom ? '报名费 ¥' + ev.priceFrom + ' 起' : '邀请制赛事') + '</span>' +
          '<span class="btn btn-primary btn-sm">' + (ev.status === '报名中' ? '立即报名' : '查看详情') + '</span>' +
        '</div>' +
      '</div>' +
    '</a>';

  M.init({ tab:'home' });
})();
</script>
</body>
</html>

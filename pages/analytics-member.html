<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../config.js?v=20261105"></script>
<script src="../auth-gate.js?v=20261105"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会员/商品/租赁分析 - 地丰体育</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div id="app-shell"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../mock.js"></script>
<script src="../mock-extra.js"></script>
<script src="../api.js"></script>
<script src="../shell.js"></script>
<script>
window.__PREFIX__ = '../';
renderShell('analytics-member', '会员/商品/租赁分析');

/* ========== 工具 ========== */
function money(n){
  return (Number(n) || 0).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }
function closeActiveModal(){ if(activeModal){ closeModal(activeModal); activeModal = null; } }

const VENUE_RATIO = {'':1, '总部':0.49, '篮球公园':0.26, '网球中心':0.10, '羽毛球馆':0.15};
const RANGE_FACTOR = {'近30天':1, '近90天':2.6, '本年':9.4};
let activeModal = null;
let companyTab = 'member';
let goodsCategory = '全部';
let goodsSort = {key:'sales', dir:'desc'};
let lastGoods = [];

/* ========== 页面骨架 ========== */
document.getElementById('page-content').innerHTML = `
<style>
  .am-donut{width:170px;height:170px;border-radius:50%;position:relative;margin:0 auto 16px}
  .am-donut::after{content:'';position:absolute;inset:30px;border-radius:50%;background:#fff}
  .am-donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
  .am-legend{display:flex;flex-direction:column;gap:10px}
  .am-legend .row{display:flex;align-items:center;gap:8px;font-size:13px}
  .am-legend .row .dot{width:8px;height:8px;border-radius:50%}
  .am-legend .row .nm{flex:1;color:var(--text-2)}
  .am-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .am-bar-row .nm{width:96px;font-size:13px;color:var(--text-2);flex-shrink:0}
  .am-bar-row .track{flex:1;height:10px;background:var(--border-light);border-radius:5px;overflow:hidden}
  .am-bar-row .val{width:52px;text-align:right;font-size:12px;color:var(--text-3)}
  .am-th{cursor:pointer;user-select:none}
  .am-th:hover{color:var(--primary)}
  .am-rank-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-light)}
  .am-rank-item:last-child{border-bottom:none}
  .am-rank-no{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--border-light);color:var(--text-3);flex-shrink:0}
  .am-rank-no.top{background:var(--primary-bg);color:var(--primary)}
  .am-rank-no.low{background:var(--error-bg);color:var(--error)}
</style>
<div class="page-header">
  <div class="flex justify-between items-center" style="flex-wrap:wrap;gap:12px">
    <div>
      <div class="page-title">会员 / 商品 / 租赁分析</div>
      <div class="page-desc">会员资产、商品动销与租赁周转的经营洞察 · 数据按当前筛选口径实时汇总</div>
    </div>
    <div class="flex gap-8">
      <button class="btn btn-default" onclick="exportReport('会员商品租赁分析')"><i data-lucide="download"></i>导出当前分析</button>
      <button class="btn btn-default" onclick="window.print()"><i data-lucide="printer"></i>打印</button>
    </div>
  </div>
</div>

<div class="card mb-16">
  <div class="card-body" style="padding:14px 20px">
    <div class="toolbar" style="margin-bottom:0">
      <div class="filter-group">
        <span class="text-muted" style="font-size:13px">场馆</span>
        <select class="form-select" id="am-venue" onchange="renderAll()">
          <option value="">全部场馆</option>
          <option value="总部">地丰体育中心（总部）</option>
          <option value="篮球公园">地丰篮球公园</option>
          <option value="网球中心">地丰网球中心</option>
          <option value="羽毛球馆">地丰羽毛球馆</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="text-muted" style="font-size:13px">时间范围</span>
        <select class="form-select" id="am-range" onchange="renderAll()">
          <option>近30天</option><option>近90天</option><option>本年</option>
        </select>
      </div>
      <div class="spacer"></div>
      <span class="tag tag-gray" id="am-summary">全部场馆 · 近30天</span>
    </div>
  </div>
</div>

<div class="tabs" id="am-tabs">
  <div class="tab active" data-tab="member" onclick="switchTab('member')">会员分析</div>
  <div class="tab" data-tab="goods" onclick="switchTab('goods')">商品分析</div>
  <div class="tab" data-tab="rental" onclick="switchTab('rental')">租赁分析</div>
</div>

<div class="tab-panel" id="am-panel-member">
  <div class="stats-grid" id="am-stats"></div>

  <div style="display:grid;grid-template-columns:1fr 1.35fr;gap:16px" class="mb-16">
    <div class="card">
      <div class="card-header"><div class="card-title">会员活跃等级分布</div><span class="tag tag-blue" id="am-active-total"></span></div>
      <div class="card-body" id="am-active"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">客户充值排行</div>
        <span class="text-muted" style="font-size:12px">点击行查看充值明细</span>
      </div>
      <div class="card-body no-pad">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>排名</th><th>客户</th><th class="text-right">充值次数</th><th class="text-right">累计充值金额</th><th>等级</th></tr></thead>
            <tbody id="am-rank-rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body" style="display:flex;gap:14px;align-items:flex-start">
      <span class="stat-icon cyan" style="flex-shrink:0"><i data-lucide="activity"></i></span>
      <div>
        <div class="font-medium mb-8">会员指标口径</div>
        <div class="text-muted" style="font-size:13px;line-height:1.8">
          活跃会员指统计期内有场地预约、商品消费或租赁记录的会员；30 天活跃用于日常运营触达，90 天活跃用于流失预警。
          储值余额总额含本金与赠送金额，次卡存量按剩余可用次数折算。新增会员按首次注册时间归属，跨期不重复计数。
        </div>
      </div>
    </div>
  </div>
</div>

<div class="tab-panel" id="am-panel-goods" style="display:none">
  <div class="stats-grid" id="gm-stats"></div>

  <div class="card mb-16" style="background:var(--warning-bg);border-color:var(--warning)">
    <div class="card-body" style="display:flex;gap:12px;align-items:flex-start;padding:14px 18px">
      <i data-lucide="alert-triangle" style="color:var(--warning);flex-shrink:0"></i>
      <div style="font-size:13px;color:var(--text-2);line-height:1.7">
        本期不核算成本结转，商品毛利分析待成本口径确定后补充。当前仅展示销量、销售额与库存金额（按最近采购成本估算），不作为财务核算依据。
      </div>
    </div>
  </div>

  <div class="card mb-16">
    <div class="card-header">
      <div class="card-title">商品动销明细</div>
      <div class="flex gap-8 items-center">
        <span class="text-muted" style="font-size:13px">分类</span>
        <select class="form-select" id="gm-category" style="width:auto;min-width:120px" onchange="onGoodsCategory(this.value)">
          <option value="全部">全部分类</option>
          <option value="饮料">饮料</option>
          <option value="食品">食品</option>
          <option value="球类">球类</option>
          <option value="运动用品">运动用品</option>
        </select>
        <span class="text-muted" style="font-size:12px" id="gm-count"></span>
      </div>
    </div>
    <div class="card-body no-pad">
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr>
            <th class="am-th" onclick="sortGoods('name')">商品</th>
            <th>分类</th>
            <th class="am-th text-right" onclick="sortGoods('sales')">销量 <span id="gm-sort-sales">↓</span></th>
            <th class="am-th text-right" onclick="sortGoods('amount')">销售额 <span id="gm-sort-amount"></span></th>
            <th class="am-th text-right" onclick="sortGoods('stock')">库存 <span id="gm-sort-stock"></span></th>
            <th class="am-th text-right" onclick="sortGoods('stockAmount')">库存金额 <span id="gm-sort-stockAmount"></span></th>
            <th>动销状态</th>
            <th>操作</th>
          </tr></thead>
          <tbody id="gm-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="card">
      <div class="card-header"><div class="card-title">畅销排行</div><span class="tag tag-green">Top 5</span></div>
      <div class="card-body" id="gm-hot"></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">滞销预警</div><span class="tag tag-red">需处理</span></div>
      <div class="card-body" id="gm-cold"></div>
    </div>
  </div>
</div>

<div class="tab-panel" id="am-panel-rental" style="display:none">
  <div class="stats-grid" id="rt-stats"></div>

  <div style="display:grid;grid-template-columns:1fr 1.5fr;gap:16px" class="mb-16">
    <div class="card">
      <div class="card-header"><div class="card-title">按分类周转率</div><span class="tag tag-purple">次/月</span></div>
      <div class="card-body" id="rt-turn"></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">租赁物品明细</div><span class="text-muted" style="font-size:12px" id="rt-count"></span></div>
      <div class="card-body no-pad">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr>
              <th>物品</th><th>分类</th><th class="text-right">租赁次数</th><th class="text-right">租金收入</th>
              <th class="text-right">押金笔数</th><th class="text-right">押金余额</th><th class="text-right">损坏赔偿</th><th class="text-right">周转率</th>
            </tr></thead>
            <tbody id="rt-rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body" style="display:flex;gap:14px;align-items:flex-start">
      <span class="stat-icon purple" style="flex-shrink:0"><i data-lucide="package-check"></i></span>
      <div>
        <div class="font-medium mb-8">租赁口径说明</div>
        <div class="text-muted" style="font-size:13px;line-height:1.8">
          周转率 = 统计期内出租次数 / 可租数量，反映器材使用效率；押金余额为尚未退还的押金合计，不计入收入。
          损坏赔偿单独核算为其他收入，需与押金退还流水逐笔对应，禁止以押金直接冲抵赔偿。租赁押金不计入当期营业收入。
        </div>
      </div>
    </div>
  </div>
</div>

`;

/* ========== 数据 ========== */
const GOODS_DATA = [
  ...MOCK_EXT.goodsAnalytics,
  {name:'斯伯丁篮球7号', category:'球类', sales:18, amount:3582, stock:12, stockAmount:1740, rate:'平销'},
  {name:'运动毛巾', category:'运动用品', sales:46, amount:1380, stock:88, stockAmount:1584, rate:'平销'},
  {name:'护腕', category:'运动用品', sales:12, amount:360, stock:60, stockAmount:720, rate:'滞销'}
];
const RENTAL_ROWS = [
  {name:'网球拍', category:'器材', count:62, revenue:1480, deposits:62, depositBal:9600, damage:420, turnover:3.6},
  {name:'羽毛球拍', category:'器材', count:58, revenue:1240, deposits:58, depositBal:8400, damage:360, turnover:3.4},
  {name:'篮球', category:'球类', count:40, revenue:400, deposits:40, depositBal:3600, damage:280, turnover:2.8},
  {name:'护膝套装', category:'护具', count:26, revenue:1160, deposits:26, depositBal:7000, damage:320, turnover:2.6}
];
const ACTIVE_LEVELS = [
  {name:'高活跃（30天内）', color:'#10b981'},
  {name:'中活跃（31-90天）', color:'#1677ff'},
  {name:'沉睡（90天以上）', color:'#9ca3af'}
];

function filters(){
  return {
    venue: document.getElementById('am-venue')?.value || '',
    range: document.getElementById('am-range')?.value || '近30天'
  };
}
function scale(){
  const f = filters();
  return (VENUE_RATIO[f.venue] || 1) * (RANGE_FACTOR[f.range] || 1);
}
function switchTab(tab){
  companyTab = tab;
  document.querySelectorAll('#am-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  ['member','goods','rental'].forEach(k => {
    const p = document.getElementById('am-panel-' + k);
    if(p) p.style.display = k === tab ? 'block' : 'none';
  });
  if(tab === 'member') renderMember();
  if(tab === 'goods') renderGoods();
  if(tab === 'rental') renderRental();
  refreshIcons();
}

function renderAll(){
  const f = filters();
  const vm = {'':'全部场馆','总部':'总部','篮球公园':'篮球公园','网球中心':'网球中心','羽毛球馆':'羽毛球馆'}[f.venue];
  const sum = document.getElementById('am-summary');
  if(sum) sum.textContent = `${vm} · ${f.range}`;
  renderMember();
  renderGoods();
  renderRental();
  refreshIcons();
}

/* ========== 会员分析 ========== */
function renderMember(){
  const m = MOCK_EXT.memberAnalytics;
  const f = filters();
  const s = scale();
  const vr = VENUE_RATIO[f.venue] || 1;
  const total = Math.round(m.total * vr);
  const active30 = Math.min(total, Math.round(m.active30 * vr));
  const active90 = Math.min(total, Math.round(m.active90 * vr));
  const newMembers = Math.round(m.newMembers * s);
  const recharge = Math.round(m.rechargeAmount * s);
  const consume = Math.round(m.consumeAmount * s);
  const stored = Math.round(m.storedTotal * vr);
  const cardStock = Math.round(m.cardStock * vr);
  const el = document.getElementById('am-stats');
  if(!el) return;
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">会员数 <span class="stat-icon blue"><i data-lucide="users"></i></span></div>
      <div class="stat-value">${total.toLocaleString()}</div>
      <div class="stat-trend up"><i data-lucide="user-plus" style="width:14px"></i>新增 ${newMembers} 人 · 环比 +6.8%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">新增会员 <span class="stat-icon green"><i data-lucide="user-plus"></i></span></div>
      <div class="stat-value">${newMembers.toLocaleString()}</div>
      <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i>同比 +11.2%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">充值金额 <span class="stat-icon purple"><i data-lucide="wallet"></i></span></div>
      <div class="stat-value">¥${money(recharge)}</div>
      <div class="stat-trend up"><i data-lucide="arrow-up" style="width:14px"></i>赠额按 10% 计，已含在余额中</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">消费金额 <span class="stat-icon orange"><i data-lucide="shopping-bag"></i></span></div>
      <div class="stat-value">¥${money(consume)}</div>
      <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i>环比 +5.4%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">活跃会员 <span class="stat-icon cyan"><i data-lucide="activity"></i></span></div>
      <div class="stat-value">${active30} / ${active90}</div>
      <div class="stat-trend"><i data-lucide="calendar" style="width:14px;color:var(--text-3)"></i>30天 / 90天 · 活跃率 ${(active90 / total * 100).toFixed(1)}%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">储值余额总额 <span class="stat-icon blue"><i data-lucide="credit-card"></i></span></div>
      <div class="stat-value">¥${money(stored)}</div>
      <div class="stat-trend"><i data-lucide="info" style="width:14px;color:var(--text-3)"></i>含本金与赠送，属预收负债</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">次卡存量 <span class="stat-icon green"><i data-lucide="repeat"></i></span></div>
      <div class="stat-value">${cardStock.toLocaleString()}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 张</span></div>
      <div class="stat-trend"><i data-lucide="clock" style="width:14px;color:var(--text-3)"></i>剩余可用次数未核销</div>
    </div>`;

  const parts = [active30, Math.max(0, active90 - active30), Math.max(0, total - active90)];
  const sumAll = parts.reduce((a, b) => a + b, 0) || 1;
  let cum = 0;
  const gradient = parts.map((v, i) => {
    const pct = v / sumAll * 100;
    const seg = `${ACTIVE_LEVELS[i].color} ${cum}% ${cum + pct}%`;
    cum += pct;
    return seg;
  }).join(', ');
  document.getElementById('am-active-total').textContent = `合计 ${total} 人`;
  document.getElementById('am-active').innerHTML = `
    <div class="am-donut" style="background:conic-gradient(${gradient})">
      <div class="am-donut-c">
        <div style="font-size:11px;color:var(--text-3)">活跃会员</div>
        <div style="font-size:24px;font-weight:700">${((active90 / total) * 100).toFixed(0)}%</div>
        <div style="font-size:11px;color:var(--text-3)">90天活跃率</div>
      </div>
    </div>
    <div class="am-legend">
      ${parts.map((v, i) => `<div class="row">
        <span class="dot" style="background:${ACTIVE_LEVELS[i].color}"></span>
        <span class="nm">${ACTIVE_LEVELS[i].name}</span>
        <span class="font-medium">${v} 人</span>
        <span class="text-muted" style="width:44px;text-align:right">${(v / sumAll * 100).toFixed(1)}%</span>
      </div>`).join('')}
    </div>`;

  const rf = RANGE_FACTOR[f.range] || 1;
  const list = MOCK_EXT.rechargeRanking.map((r, i) => ({...r, level: i === 0 ? '企业会员' : i === 1 ? 'VIP会员' : '普通会员'}));
  document.getElementById('am-rank-rows').innerHTML = list.map((r, i) => `<tr style="cursor:pointer" onclick="openRechargeDrill('${r.name}')">
    <td><span class="tag ${i < 3 ? 'tag-blue' : 'tag-gray'}">${i + 1}</span></td>
    <td class="font-medium">${r.name}</td>
    <td class="text-right">${Math.round(r.count * rf)} 次</td>
    <td class="text-right font-medium">¥${money(r.amount * rf)}</td>
    <td><span class="tag ${r.level === '企业会员' ? 'tag-purple' : r.level === 'VIP会员' ? 'tag-orange' : 'tag-gray'}">${r.level}</span></td>
  </tr>`).join('');
}

/* ========== 商品分析 ========== */
function onGoodsCategory(val){ goodsCategory = val; renderGoods(); }

function goodsStatus(g){
  if(g.rate) return g.rate;
  if(g.sales >= 100) return '畅销';
  if(g.sales >= 20) return '平销';
  return '滞销';
}
function sortGoods(key){
  if(goodsSort.key === key){ goodsSort.dir = goodsSort.dir === 'desc' ? 'asc' : 'desc'; }
  else { goodsSort = {key, dir: key === 'name' ? 'asc' : 'desc'}; }
  ['sales','amount','stock','stockAmount'].forEach(k => {
    const el = document.getElementById('gm-sort-' + k);
    if(el) el.textContent = goodsSort.key === k ? (goodsSort.dir === 'desc' ? '↓' : '↑') : '';
  });
  renderGoods();
}

function goodsRows(){
  const f = filters();
  const s = scale();
  const vr = VENUE_RATIO[f.venue] || 1;
  let list = GOODS_DATA.filter(g => goodsCategory === '全部' || g.category === goodsCategory)
    .map(g => ({
      ...g,
      sales: Math.round(g.sales * s),
      amount: Math.round(g.amount * s),
      stock: Math.round(g.stock * vr),
      stockAmount: Math.round(g.stockAmount * vr),
      status: goodsStatus(g)
    }));
  list.sort((a, b) => {
    const av = a[goodsSort.key], bv = b[goodsSort.key];
    if(typeof av === 'string') return goodsSort.dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return goodsSort.dir === 'desc' ? bv - av : av - bv;
  });
  lastGoods = list;
  return list;
}

function renderGoods(){
  const f = filters();
  const s = scale();
  const vr = VENUE_RATIO[f.venue] || 1;
  const sales = Math.round(GOODS_DATA.reduce((a, g) => a + g.sales, 0) * s);
  const amount = Math.round(GOODS_DATA.reduce((a, g) => a + g.amount, 0) * s);
  const stock = Math.round(GOODS_DATA.reduce((a, g) => a + g.stock, 0) * vr);
  const stockAmount = Math.round(GOODS_DATA.reduce((a, g) => a + g.stockAmount, 0) * vr);
  const el = document.getElementById('gm-stats');
  if(!el) return;
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">销量 <span class="stat-icon blue"><i data-lucide="package"></i></span></div>
      <div class="stat-value">${sales.toLocaleString()}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 件</span></div>
      <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i>环比 +9.1%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">销售额 <span class="stat-icon green"><i data-lucide="circle-dollar-sign"></i></span></div>
      <div class="stat-value">¥${money(amount)}</div>
      <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i>同比 +14.3%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">库存量 <span class="stat-icon orange"><i data-lucide="layers"></i></span></div>
      <div class="stat-value">${stock.toLocaleString()}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 件</span></div>
      <div class="stat-trend"><i data-lucide="alert-triangle" style="width:14px;color:var(--warning)"></i>缺货 1 款，滞销 ${GOODS_DATA.filter(g => g.rate === '滞销').length} 款</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">库存金额 <span class="stat-icon purple"><i data-lucide="warehouse"></i></span></div>
      <div class="stat-value">¥${money(stockAmount)}</div>
      <div class="stat-trend"><i data-lucide="info" style="width:14px;color:var(--text-3)"></i>按最近采购成本估算，不含费用分摊</div>
    </div>`;

  const list = goodsRows();
  const cnt = document.getElementById('gm-count');
  if(cnt) cnt.textContent = `共 ${list.length} 款 · ${goodsCategory}`;
  document.getElementById('gm-rows').innerHTML = list.length ? list.map(g => {
    const tag = {'畅销':'tag-green','平销':'tag-blue','滞销':'tag-red','缺货':'tag-orange'}[g.status] || 'tag-gray';
    return `<tr>
      <td class="font-medium">${g.name}</td>
      <td><span class="tag tag-gray">${g.category}</span></td>
      <td class="text-right">${g.sales}</td>
      <td class="text-right font-medium">¥${money(g.amount)}</td>
      <td class="text-right ${g.stock === 0 ? 'text-error' : ''}">${g.stock}</td>
      <td class="text-right">¥${money(g.stockAmount)}</td>
      <td><span class="tag ${tag}">${g.status}</span></td>
      <td><button class="btn btn-ghost btn-sm" onclick="openGoodsDrill('${g.name}')">明细</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="8"><div class="empty"><div class="empty-icon"><i data-lucide="package-x"></i></div><div class="empty-text">该分类下暂无商品</div></div></td></tr>`;

  const hot = [...GOODS_DATA].sort((a, b) => b.sales - a.sales).slice(0, 5);
  const cold = GOODS_DATA.filter(g => g.rate === '滞销' || g.stock === 0);
  document.getElementById('gm-hot').innerHTML = hot.map((g, i) => `<div class="am-rank-item">
    <span class="am-rank-no ${i < 3 ? 'top' : ''}">${i + 1}</span>
    <div style="flex:1"><div class="font-medium" style="font-size:13px">${g.name}</div>
      <div class="text-muted" style="font-size:11px">${g.category} · 销量 ${Math.round(g.sales * scale())}</div></div>
    <div class="text-right"><div class="font-medium">¥${money(g.amount * scale())}</div>
      <div class="text-muted" style="font-size:11px">${g.rate}</div></div>
  </div>`).join('');
  document.getElementById('gm-cold').innerHTML = cold.length ? cold.map(g => `<div class="am-rank-item">
    <span class="am-rank-no low"><i data-lucide="alert-triangle" style="width:12px"></i></span>
    <div style="flex:1"><div class="font-medium" style="font-size:13px">${g.name}</div>
      <div class="text-muted" style="font-size:11px">${g.category} · 库存 ${g.stock}</div></div>
    <div class="text-right"><span class="tag tag-red">${g.rate}</span>
      <div class="text-muted" style="font-size:11px;margin-top:4px">近30天销量 ${g.sales}</div></div>
  </div>`).join('') : `<div class="empty" style="padding:30px"><div class="empty-text">暂无滞销商品</div></div>`;
  refreshIcons();
}

/* ========== 租赁分析 ========== */
function renderRental(){
  const f = filters();
  const s = scale();
  const vr = VENUE_RATIO[f.venue] || 1;
  const a = MOCK_EXT.rentalAnalytics;
  const count = Math.round(RENTAL_ROWS.reduce((x, r) => x + r.count, 0) * s);
  const revenue = Math.round(RENTAL_ROWS.reduce((x, r) => x + r.revenue, 0) * s);
  const depCount = Math.round(RENTAL_ROWS.reduce((x, r) => x + r.deposits, 0) * s);
  const depBal = Math.round(RENTAL_ROWS.reduce((x, r) => x + r.depositBal, 0) * vr);
  const damage = Math.round(RENTAL_ROWS.reduce((x, r) => x + r.damage, 0) * s);
  const el = document.getElementById('rt-stats');
  if(!el) return;
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">租赁次数 <span class="stat-icon blue"><i data-lucide="repeat"></i></span></div>
      <div class="stat-value">${count}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 次</span></div>
      <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i>环比 +7.5%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">租金收入 <span class="stat-icon green"><i data-lucide="circle-dollar-sign"></i></span></div>
      <div class="stat-value">¥${money(revenue)}</div>
      <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i>同比 +9.8%</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">押金笔数 <span class="stat-icon orange"><i data-lucide="shield-check"></i></span></div>
      <div class="stat-value">${depCount}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 笔</span></div>
      <div class="stat-trend"><i data-lucide="info" style="width:14px;color:var(--text-3)"></i>押金不计入营业收入</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">押金余额 <span class="stat-icon cyan"><i data-lucide="wallet"></i></span></div>
      <div class="stat-value">¥${money(depBal)}</div>
      <div class="stat-trend"><i data-lucide="clock" style="width:14px;color:var(--text-3)"></i>待归还，属代管资金</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">损坏赔偿 <span class="stat-icon red"><i data-lucide="wrench"></i></span></div>
      <div class="stat-value">¥${money(damage)}</div>
      <div class="stat-trend down"><i data-lucide="alert-triangle" style="width:14px"></i>需与押金退还逐笔对应</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">平均周转率 <span class="stat-icon purple"><i data-lucide="refresh-cw"></i></span></div>
      <div class="stat-value">${a.turnover}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 次/月</span></div>
      <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i>器材类周转最优</div>
    </div>`;

  const cats = ['器材','球类','护具'].map(c => {
    const rows = RENTAL_ROWS.filter(r => r.category === c);
    const total = rows.reduce((x, r) => x + r.count, 0);
    const t = total ? rows.reduce((x, r) => x + r.turnover * r.count, 0) / total : 0;
    return {c, t, total};
  });
  const maxT = Math.max(...cats.map(x => x.t), 1);
  document.getElementById('rt-turn').innerHTML = cats.map(x => `<div class="am-bar-row">
    <span class="nm">${x.c}</span>
    <div class="track"><div style="height:100%;width:${x.t / maxT * 100}%;background:linear-gradient(90deg,#8b5cf6,#1677ff);border-radius:5px"></div></div>
    <span class="val">${x.t.toFixed(1)} 次</span>
  </div>`).join('') + `<div class="text-muted mt-8" style="font-size:12px">按分类内物品出租次数加权计算，周转率越高说明器材使用越充分。</div>`;

  const cnt = document.getElementById('rt-count');
  if(cnt) cnt.textContent = `共 ${RENTAL_ROWS.length} 类物品`;
  document.getElementById('rt-rows').innerHTML = RENTAL_ROWS.map(r => `<tr>
    <td class="font-medium">${r.name}</td>
    <td><span class="tag ${r.category === '器材' ? 'tag-purple' : r.category === '球类' ? 'tag-orange' : 'tag-cyan'}">${r.category}</span></td>
    <td class="text-right">${Math.round(r.count * s)}</td>
    <td class="text-right font-medium">¥${money(r.revenue * s)}</td>
    <td class="text-right">${Math.round(r.deposits * s)}</td>
    <td class="text-right">¥${money(r.depositBal * vr)}</td>
    <td class="text-right ${r.damage > 0 ? 'text-error' : ''}">¥${money(r.damage * s)}</td>
    <td class="text-right">${r.turnover}</td>
  </tr>`).join('');
  refreshIcons();
}

/* ========== 下钻弹窗 ========== */
function openRechargeDrill(name){
  closeActiveModal();
  const r = MOCK_EXT.rechargeRanking.find(x => x.name === name);
  if(!r) return;
  const rf = RANGE_FACTOR[filters().range] || 1;
  const times = Math.max(2, Math.min(5, r.count));
  const records = Array.from({length:times}).map((_, i) => {
    const day = String(28 - i * 6).padStart(2, '0');
    const amt = Math.round(r.amount / r.count * (i === 0 ? 1.4 : 1));
    return {
      no: 'RC202610' + day + String(i + 1).padStart(2, '0'),
      time: `2026-10-${day} ${10 + i}:2${i}`,
      amount: amt,
      gift: Math.round(amt * 0.1),
      method: i % 2 === 0 ? '微信支付' : '对公转账',
      status: i === 0 ? '已到账' : '已到账',
      operator: i % 2 === 0 ? '张前台' : '王财务'
    };
  });
  activeModal = openModal(`<div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">${name} · 充值明细</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>
    </div>
    <div class="modal-body">
      <div class="kv-grid mb-16" style="grid-template-columns:repeat(4,1fr)">
        <div class="kv-item"><div class="k">累计充值</div><div class="v font-bold" style="color:var(--primary)">¥${money(r.amount * rf)}</div></div>
        <div class="kv-item"><div class="k">充值次数</div><div class="v">${Math.round(r.count * rf)} 次</div></div>
        <div class="kv-item"><div class="k">赠送金额</div><div class="v">¥${money(r.amount * rf * 0.1)}</div></div>
        <div class="kv-item"><div class="k">统计区间</div><div class="v">${filters().range}</div></div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>充值单号</th><th>时间</th><th class="text-right">充值金额</th><th class="text-right">赠送</th><th>支付方式</th><th>经办人</th><th>状态</th></tr></thead>
          <tbody>
            ${records.map(x => `<tr>
              <td class="mono" style="font-size:12px">${x.no}</td>
              <td style="font-size:12px">${x.time}</td>
              <td class="text-right font-medium">¥${money(x.amount)}</td>
              <td class="text-right text-success">¥${money(x.gift)}</td>
              <td>${x.method}</td>
              <td>${x.operator}</td>
              <td><span class="tag tag-green">${x.status}</span></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="text-muted mt-12" style="font-size:12px">充值本金计入预收账款，赠送金额不做收入，随本金按实际消费比例结转。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">关闭</button>
      <button class="btn btn-primary" onclick="exportReport('${name}充值明细')">导出明细</button>
    </div>
  </div>`);
}

function openGoodsDrill(name){
  closeActiveModal();
  const g = GOODS_DATA.find(x => x.name === name);
  if(!g) return;
  const s = scale();
  const week = [0.8, 0.9, 1.1, 1.3, 1.0, 1.2, 1.15];
  const max = Math.max(...week.map(w => g.sales * w));
  activeModal = openModal(`<div class="modal">
    <div class="modal-header">
      <div class="modal-title">${g.name} · 商品动销明细</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>
    </div>
    <div class="modal-body">
      <div class="kv-grid mb-16">
        <div class="kv-item"><div class="k">商品分类</div><div class="v">${g.category}</div></div>
        <div class="kv-item"><div class="k">动销状态</div><div class="v"><span class="tag ${g.rate === '畅销' ? 'tag-green' : g.rate === '滞销' ? 'tag-red' : 'tag-blue'}">${g.rate}</span></div></div>
        <div class="kv-item"><div class="k">统计期销量</div><div class="v font-bold">${Math.round(g.sales * s)} 件</div></div>
        <div class="kv-item"><div class="k">销售额</div><div class="v font-bold">¥${money(g.amount * s)}</div></div>
        <div class="kv-item"><div class="k">当前库存</div><div class="v">${g.stock} 件</div></div>
        <div class="kv-item"><div class="k">库存金额</div><div class="v">¥${money(g.stockAmount)}</div></div>
      </div>
      <div class="font-medium mb-12">近 7 日销量走势</div>
      <div class="bar-chart" style="height:150px">
        ${week.map((w, i) => `<div class="bar">
          <div class="bar-fill" style="height:${Math.round(g.sales * w / max * 100)}%"></div>
          <div class="bar-label">D${i + 1}</div>
        </div>`).join('')}
      </div>
      <div class="text-muted mt-12" style="font-size:12px">${g.rate === '滞销' ? '建议调整陈列位置或组合促销，避免临期报废。' : '动销正常，建议保持安全库存，缺货时触发补货提醒。'}</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">关闭</button>
      <button class="btn btn-primary" onclick="exportReport('${g.name}动销明细')">导出</button>
    </div>
  </div>`);
}

function exportReport(scope){
  const f = filters();
  const vm = f.venue || '全部场馆';
  toast(`已生成「${scope || '经营分析'}」导出任务：${vm} · ${f.range}，请在下载中心查看`, 'success');
}

/* ========== 初始化 ========== */
renderAll();
if(window.lucide) lucide.createIcons();
</script>

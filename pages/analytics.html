const BIZ_TYPES = [
  {key:'', label:'全部业务', factor:1},
  {key:'场地预约', label:'场地预约', factor:0.58},

  '日':   {revenue:26750,   orders:128,  customers:96,   mom:8.2,  label:'按日'},
  '周':   {revenue:178900,  orders:862,  customers:640,  mom:6.4,  label:'按周'},

};
const TREND_SRC = {
  '日': MOCK.dailyRevenue.map(d => ({label:d.date, value:d.revenue})),
  '周': [
    {label:'09/07', value:138600}, {label:'09/14', value:149200}, {label:'09/21', value:156300},

  '季': [
    {label:'2025Q3', value:948000}, {label:'2025Q4', value:1062000}, {label:'2026Q1', value:1028000},
    {label:'2026Q2', value:1096000}, {label:'2026Q3', value:1112000}, {label:'2026Q4', value:1168000}
  ],

/* ========== 状态 ========== */
let courtSort = {key:'usage', dir:'desc'};
let activeModal = null;

function currentFilters(){
  const venue = document.getElementById('an-venue')?.value || '';
  const dim = document.getElementById('an-dim')?.value || '日';
  const biz = document.getElementById('an-biz')?.value || '';
  return {venue, dim, biz};
}
function venueRatio(key){
  const v = VENUES.find(x => x.key === key);
  return v ? v.ratio : 1;
}
function bizFactor(key){
  const b = BIZ_TYPES.find(x => x.key === key);
  return b ? b.factor : 1;
}
function totalScale(f){
  return (f.venue ? venueRatio(f.venue) : 1) * bizFactor(f.biz);
}
function customFactor(){
  const from = document.getElementById('an-from')?.value || '2026-10-01';
  const to = document.getElementById('an-to')?.value || '2026-10-31';
  const days = Math.max(1, Math.round((new Date(to) - new Date(from)) / 86400000) + 1);
  return {days, factor: Math.min(2, Math.max(0.1, days / 30))};
}

function getMetrics(){
  const f = currentFilters();
  const base = f.dim === '自定义'
    ? {revenue:386500, orders:1740, customers:1180, mom:12.5, label:'自定义区间'}
    : (DIM_BASE[f.dim] || DIM_BASE['日']);
  let factor = 1;
  if(f.dim === '自定义'){ factor = customFactor().factor; }
  const scale = totalScale(f) * factor;
  const revenue = Math.round(base.revenue * scale);
  const orders = Math.round(base.orders * scale);
  const customers = Math.round(base.customers * (f.venue ? venueRatio(f.venue) : 1) * factor);
  const avgPrice = orders ? Math.round(revenue / orders) : 0;
  const vOff = {'':0,'总部':1.2,'篮球公园':2.4,'网球中心':-1.8,'羽毛球馆':0.6}[f.venue] || 0;
  return {
    revenue, orders, customers, avgPrice,
    revenueMoM: (base.mom + vOff).toFixed(1),
    ordersMoM: (base.mom * 0.7 + vOff).toFixed(1),
    customersMoM: (base.mom * 0.5 + vOff).toFixed(1),
    avgPriceMoM: (base.mom * 0.4 - vOff * 0.5).toFixed(1),
    dimLabel: base.label
  };
}

function getTrend(){
  const f = currentFilters();
  const scale = totalScale(f);
  if(f.dim === '自定义'){
    const {days, factor} = customFactor();
    const from = new Date(document.getElementById('an-from')?.value || '2026-10-01');
    const buckets = 6;
    const slice = Math.max(1, Math.ceil(days / buckets));
    return Array.from({length:buckets}).map((_, i) => {
      const d = new Date(from.getTime() + i * slice * 86400000);
      const md = String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
      const base = 386500 * factor / buckets;
      const wave = [0.86, 0.94, 1.02, 1.12, 1.06, 0.98][i];
      return {label:md, value:Math.round(base * wave * scale)};
    });
  }
  const src = TREND_SRC[f.dim] || TREND_SRC['日'];
  return src.map(d => ({label:d.label, value:Math.round(d.value * scale)}));
}

function onDimChange(){

  renderTrend();
  renderChannel();
  renderUsage();
  renderPeak();

/* ========== 指标卡 ========== */

  const m = getMetrics();
  const el = document.getElementById('an-stats');
  if(!el) return;
  const trendHtml = (val, label) => {
    const up = Number(val) >= 0;
    return `<div class="stat-trend ${up ? 'up' : 'down'}">
      <i data-lucide="${up ? 'trending-up' : 'trending-down'}" style="width:14px"></i>
      环比 ${up ? '+' : ''}${val}%
      <span class="text-muted" style="margin-left:6px">同比 ${up ? '+' : ''}${(Number(val) + 4.6).toFixed(1)}%</span>
    </div>`;
  };
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">营业收入 <span class="stat-icon blue"><i data-lucide="circle-dollar-sign"></i></span></div>
      <div class="stat-value">¥${money(m.revenue)}</div>
      ${trendHtml(m.revenueMoM)}
    </div>
    <div class="stat-card">
      <div class="stat-label">订单数 <span class="stat-icon green"><i data-lucide="receipt"></i></span></div>
      <div class="stat-value">${m.orders.toLocaleString()}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 单</span></div>
      ${trendHtml(m.ordersMoM)}
    </div>
    <div class="stat-card">
      <div class="stat-label">客流（客户数） <span class="stat-icon orange"><i data-lucide="users"></i></span></div>
      <div class="stat-value">${m.customers.toLocaleString()}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 人</span></div>
      ${trendHtml(m.customersMoM)}
    </div>
    <div class="stat-card">
      <div class="stat-label">客单价 <span class="stat-icon purple"><i data-lucide="wallet"></i></span></div>
      <div class="stat-value">¥${m.avgPrice}</div>
      ${trendHtml(m.avgPriceMoM)}
    </div>`;
  refreshIcons();
}

/* ========== 营收趋势 ========== */
function renderTrend(){
  const data = getTrend();
  lastTrend = data;
  const max = Math.max(...data.map(d => d.value), 1);
  const el = document.getElementById('an-trend');
  const sub = document.getElementById('an-trend-sub');
  if(sub) sub.textContent = '（' + (currentFilters().dim === '自定义' ? '自定义区间' : currentFilters().dim) + '）';
  if(!el) return;
  el.innerHTML = data.map((d, i) => {
    const h = Math.max(6, Math.round(d.value / max * 100));
    return `<div class="bar" style="cursor:pointer" onclick="openTrendDrill(${i})" title="¥${money(d.value)}">
      <div style="font-size:11px;color:var(--text-3)">${(d.value / 10000).toFixed(1)}万</div>
      <div class="bar-fill" style="height:${h}%;background:${i === data.length - 1 ? 'linear-gradient(180deg,#06b6d4,#1677ff)' : 'linear-gradient(180deg,#1677ff,#4096ff)'}"></div>
      <div class="bar-label">${d.label}</div>
    </div>`;
  }).join('');
  refreshIcons();
}

/* ========== 渠道环形图 ========== */
function renderChannel(){
  const f = currentFilters();
  const total = getMetrics().revenue;
  let shares = CHANNELS.map(c => ({...c}));
  if(f.biz === '商品销售'){
    shares = [
      {name:'小程序', color:'#1677ff', base:38}, {name:'线下', color:'#10b981', base:42},
      {name:'美团', color:'#f59e0b', base:12}, {name:'抖音', color:'#8b5cf6', base:8}
    ];
  }else if(f.biz === '赛事收入'){
    shares = [
      {name:'小程序', color:'#1677ff', base:52}, {name:'线下', color:'#10b981', base:40},
      {name:'美团', color:'#f59e0b', base:5}, {name:'抖音', color:'#8b5cf6', base:3}
    ];
  }
  const sum = shares.reduce((s, c) => s + c.base, 0);
  let cumulative = 0;
  const gradient = shares.map(c => {
    const pct = c.base / sum * 100;
    const seg = `${c.color} ${cumulative}% ${cumulative + pct}%`;
    cumulative += pct;
    return seg;
  }).join(', ');
  const legend = shares.map(c => {
    const pct = c.base / sum * 100;
    return `<div class="an-legend-row">
      <span class="dot" style="background:${c.color}"></span>
      <span class="nm">${c.name}</span>
      <span class="font-medium">¥${money(total * pct / 100)}</span>
      <span class="text-muted" style="width:44px;text-align:right">${pct.toFixed(1)}%</span>
    </div>`;
  }).join('');
  document.getElementById('an-channel-total').textContent = '合计 ¥' + money(total);
  document.getElementById('an-channel').innerHTML = `
    <div class="an-donut" style="background:conic-gradient(${gradient})">
      <div class="an-donut-center">
        <div style="font-size:11px;color:var(--text-3)">渠道收入</div>
        <div style="font-size:20px;font-weight:700">${(total / 10000).toFixed(1)}万</div>
      </div>
    </div>
    <div class="an-legend">${legend}</div>`;
}

/* ========== 场地使用率排行 ========== */
function courtRows(){
  const f = currentFilters();
  let list = COURT_DATA.filter(c => !f.venue || c.venue === f.venue);
  const bf = bizFactor(f.biz);
  list = list.map(c => ({...c, revenue: Math.round(c.revenue * bf)}));
  return list.sort((a, b) => {
    const av = a[courtSort.key], bv = b[courtSort.key];
    return courtSort.dir === 'desc' ? bv - av : av - bv;
  });
}

function renderUsage(){
  const list = [...COURT_DATA].filter(c => !currentFilters().venue || c.venue === currentFilters().venue)
    .sort((a, b) => b.usage - a.usage).slice(0, 6);
  const el = document.getElementById('an-usage');
  if(!el) return;
  el.innerHTML = list.length ? list.map(c => {
    const color = c.usage >= 70 ? 'var(--success)' : c.usage >= 40 ? 'var(--primary)' : 'var(--warning)';
    return `<div style="cursor:pointer" onclick="openCourtDrill('${c.court}')">
      <div class="flex justify-between items-center" style="font-size:13px;margin-bottom:6px">
        <span class="font-medium">${c.court} <span class="text-muted" style="font-weight:400">· ${c.venue}</span></span>
        <span style="color:${color};font-weight:600">${c.usage}%</span>
      </div>
      <div class="progress" style="margin-bottom:14px"><div class="progress-bar" style="width:${c.usage}%;background:${color}"></div></div>
    </div>`;
  }).join('') : `<div class="empty"><div class="empty-icon"><i data-lucide="map-pin-off"></i></div><div class="empty-text">当前场馆暂无场地数据</div></div>`;
  refreshIcons();
}

/* ========== 峰谷时段 ========== */
function renderPeak(){
  const f = currentFilters();
  const scale = (f.venue ? venueRatio(f.venue) : 1) * bizFactor(f.biz);
  const data = MOCK_EXT.peakDistribution.map(p => ({...p, density: Math.min(100, Math.round(p.density * (f.venue ? 1 : 1) * (f.biz ? scale : 1)))}));
  const max = Math.max(...data.map(d => d.density), 1);
  const el = document.getElementById('an-peak');
  if(!el) return;
  el.innerHTML = data.map(d => {
    const h = Math.max(4, Math.round(d.density / max * 100));
    const color = d.density >= 70 ? 'linear-gradient(180deg,#ef4444,#f59e0b)' : d.density >= 40 ? 'linear-gradient(180deg,#1677ff,#06b6d4)' : 'linear-gradient(180deg,#9ca3af,#d1d5db)';
    return `<div class="col" title="${d.slot} 客流密度 ${d.density}">
      <div class="v">${d.density}</div>
      <div style="width:100%;max-width:34px;height:${h}%;background:${color};border-radius:4px 4px 0 0;transition:height .3s"></div>
      <div class="bar-label">${d.slot}</div>
    </div>`;
  }).join('');
}

/* ========== 场地收入表 ========== */
function sortCourt(key){
  if(courtSort.key === key){ courtSort.dir = courtSort.dir === 'desc' ? 'asc' : 'desc'; }
  else { courtSort = {key, dir:'desc'}; }
  const su = document.getElementById('an-sort-usage');
  const sr = document.getElementById('an-sort-revenue');
  if(su) su.textContent = key === 'usage' ? (courtSort.dir === 'desc' ? '↓' : '↑') : '';
  if(sr) sr.textContent = key === 'revenue' ? (courtSort.dir === 'desc' ? '↓' : '↑') : '';
  renderCourtTable();
}

function renderCourtTable(){
  const list = courtRows();
  const tb = document.getElementById('an-court-rows');
  const cnt = document.getElementById('an-court-count');
  if(cnt) cnt.textContent = `共 ${list.length} 个场地`;
  if(!tb) return;
  tb.innerHTML = list.length ? list.map(c => {
    const color = c.usage >= 70 ? 'var(--success)' : c.usage >= 40 ? 'var(--primary)' : 'var(--warning)';
    return `<tr>
      <td class="font-medium">${c.court}<div class="text-muted" style="font-size:12px">${c.venue}</div></td>
      <td><span class="tag ${c.type === '篮球' ? 'tag-orange' : c.type === '足球' ? 'tag-green' : c.type === '网球' ? 'tag-cyan' : 'tag-purple'}">${c.type}</span></td>
      <td style="min-width:160px">
        <div class="flex items-center gap-8">
          <div class="progress flex-1"><div class="progress-bar" style="width:${c.usage}%;background:${color}"></div></div>
          <span style="font-size:13px;color:${color};min-width:44px;text-align:right">${c.usage}%</span>
        </div>
      </td>
      <td class="text-right font-medium">¥${money(c.revenue)}</td>
      <td><span class="tag tag-gray">${c.peak}</span></td>
      <td><button class="btn btn-ghost btn-sm" onclick="openCourtDrill('${c.court}')">下钻</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="6"><div class="empty"><div class="empty-icon"><i data-lucide="inbox"></i></div><div class="empty-text">当前筛选条件下暂无场地数据</div></div></td></tr>`;
  refreshIcons();
}

function openCourtDrill(court){
  closeActiveModal();
  const c = COURT_DATA.find(x => x.court === court);
  if(!c) return;
  const f = currentFilters();
  const revenue = Math.round(c.revenue * bizFactor(f.biz));
  const hours = ['06-08','08-10','10-12','12-14','14-16','16-18','18-20','20-22','22-23'];
  const base = Math.round(c.usage / 10);
  const bars = hours.map((h, i) => {
    const v = Math.max(2, Math.round(base * [0.4,0.6,0.8,0.5,0.9,1,1.2,0.9,0.3][i]));
    return `<div class="col" title="${h}">
      <div class="v">${v}</div>
      <div style="width:100%;max-width:26px;height:${Math.min(100, v / 12 * 100)}%;background:${v >= 9 ? 'var(--warning)' : 'var(--primary)'};border-radius:3px 3px 0 0"></div>
      <div class="bar-label">${h}</div>
    </div>`;
  }).join('');
  activeModal = openModal(`<div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">${c.court} · 场地经营下钻</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>
    </div>
    <div class="modal-body">

        <div class="kv-item"><div class="k">可售时段 / 已售</div><div class="v">17 / ${Math.round(17 * c.usage / 100)}</div></div>
      </div>
      <div class="font-medium mb-12">时段客流分布</div>
      <div class="an-peak" style="height:160px">${bars}</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">关闭</button>
      <button class="btn btn-primary" onclick="exportReport('${c.court}场地明细')">导出场地明细</button>

  </div>`);

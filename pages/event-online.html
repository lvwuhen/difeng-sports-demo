<html lang="zh-CN">
<head>

<title>线上赛事报名 - 地丰体育</title>

<body>

<script src="../shell.js"></script>
<script>
window.__PREFIX__ = '../';
renderShell('event-online', '线上赛事报名');

// ===== 线上赛事报名数据 =====
const ONLINE_EVENTS = [
  {
    id:'EV003', name:'地丰羽毛球团体赛（线上报名）', type:'羽毛球', status:'报名中',
    startDate:'2026-11-25', endDate:'2026-11-26', signupStart:'2026-10-25', signupEnd:'2026-11-20',
    rules:'五场制（男单、女单、男双、女双、混双），循环淘汰。',
    groups:[
      {id:'G1', name:'团体赛（企业组）', max:16, price:1200, type:'团体'},
      {id:'G2', name:'团体赛（公开组）', max:32, price:1200, type:'团体'},
    ],
  },
  {
    id:'EV004', name:'2026地丰青少年网球排名赛', type:'网球', status:'报名中',
    startDate:'2026-12-05', endDate:'2026-12-06', signupStart:'2026-11-01', signupEnd:'2026-12-01',
    rules:'单淘汰赛制，三盘两胜，按年龄段分组。',
    groups:[
      {id:'G1', name:'U10男单', max:32, price:200, type:'个人'},
      {id:'G2', name:'U12男单', max:32, price:200, type:'个人'},
      {id:'G3', name:'U14男单', max:32, price:200, type:'个人'},
      {id:'G4', name:'U16男单', max:16, price:200, type:'个人'},
    ],
  },
  {
    id:'EV005', name:'厦门高校篮球联赛（线上报名）', type:'篮球', status:'已结束',
    startDate:'2026-09-10', endDate:'2026-09-25', signupStart:'2026-08-01', signupEnd:'2026-09-05',
    rules:'高校组5v5全场，分小组赛+淘汰赛。',
    groups:[
      {id:'G1', name:'男子组', max:24, price:800, type:'团体'},
    ],
  },
];

// 报名订单（按赛事分组）
const SIGNUP_ORDERS = {
  'EV003': [
    {id:'SO001', orderNo:'SO20261026001', eventId:'EV003', groupId:'G1', teamName:'厦门建工集团队', contact:'陈晓明', phone:'138****1234', members:8, amount:1200, payMethod:'在线支付', payTime:'2026-10-26 10:15', status:'已支付'},
    {id:'SO002', orderNo:'SO20261026002', eventId:'EV003', groupId:'G1', teamName:'鹭岛俱乐部一队', contact:'林雅婷', phone:'139****5678', members:8, amount:1200, payMethod:'在线支付', payTime:'2026-10-26 14:30', status:'已支付'},
    {id:'SO003', orderNo:'SO20261027001', eventId:'EV003', groupId:'G2', teamName:'飞羽俱乐部', contact:'王志强', phone:'136****3456', members:8, amount:1200, payMethod:'在线支付', payTime:'2026-10-27 09:20', status:'已支付'},
    {id:'SO004', orderNo:'SO20261027002', eventId:'EV003', groupId:'G2', teamName:'海风羽协', contact:'赵磊', phone:'137****7890', members:8, amount:1200, payMethod:'', payTime:'', status:'待支付'},
  ],
  'EV004': [
    {id:'SO005', orderNo:'SO20261101001', eventId:'EV004', groupId:'G1', name:'小明', phone:'138****1111', age:9, amount:200, payMethod:'在线支付', payTime:'2026-11-01 11:00', status:'已支付'},
    {id:'SO006', orderNo:'SO20261101002', eventId:'EV004', groupId:'G1', name:'小华', phone:'138****2222', age:10, amount:200, payMethod:'在线支付', payTime:'2026-11-01 11:05', status:'已支付'},
  ],
  'EV005': [
    {id:'SO007', orderNo:'SO20260805001', eventId:'EV005', groupId:'G1', teamName:'厦门大学队', contact:'刘同学', phone:'138****3333', members:12, amount:800, payMethod:'在线支付', payTime:'2026-08-05 15:00', status:'已开票'},
  ],
};

const STATUS_TAG = {'待支付':'tag-orange','已支付':'tag-green','已取消':'tag-red','已退款':'tag-gray','已开票':'tag-blue'};
let curEventId = 'EV003';

function getEvent(id){ return ONLINE_EVENTS.find(e=>e.id===id); }
function getOrders(id){ return SIGNUP_ORDERS[id]||[]; }

// 计算每组报名人数
function getGroupEnrolled(eventId, groupId){
  return getOrders(eventId).filter(o=>o.groupId===groupId && o.status!=='已取消' && o.status!=='已退款').length;
}
function getGroupRevenue(eventId, groupId){
  return getOrders(eventId).filter(o=>o.groupId===groupId && (o.status==='已支付'||o.status==='已开票')).reduce((s,o)=>s+o.amount,0);
}

// ===== 渲染线上赛事列表（顶部选择）=====
function renderEventSelector(){
  const sel = document.getElementById('eventSelector');
  sel.innerHTML = ONLINE_EVENTS.map(e=>`<option value="${e.id}" ${e.id===curEventId?'selected':''}>${e.name}（${e.status}）</option>`).join('');
}

function renderStats(){
  const e = getEvent(curEventId);
  const orders = getOrders(curEventId);
  const paid = orders.filter(o=>o.status==='已支付'||o.status==='已开票');
  const revenue = paid.reduce((s,o)=>s+o.amount,0);
  const totalEnrolled = e.groups.reduce((s,g)=>s+getGroupEnrolled(e.id,g.id),0);
  const totalQuota = e.groups.reduce((s,g)=>s+g.max,0);
  document.getElementById('stEvents').textContent = ONLINE_EVENTS.length;
  document.getElementById('stEnrolled').textContent = totalEnrolled+'/'+totalQuota;
  document.getElementById('stRevenue').textContent = '¥'+revenue.toLocaleString();
  document.getElementById('stOrders').textContent = paid.length;
}

// ===== 分组报名统计 =====
function renderGroupStats(){
  const e = getEvent(curEventId);
  const rows = e.groups.map(g=>{
    const enrolled = getGroupEnrolled(e.id, g.id);
    const revenue = getGroupRevenue(e.id, g.id);
    const pct = g.max>0 ? Math.round(enrolled/g.max*100) : 0;
    const full = enrolled>=g.max;
    return `<tr>
      <td><div class="font-medium">${g.name}</div><div class="text-muted" style="font-size:12px">${g.type} · ${g.price>0?'¥'+g.price:'免费'}</div></td>
      <td><span class="tag ${full?'tag-red':'tag-green'}">${full?'已满':'可报名'}</span></td>
      <td>${enrolled}</td>
      <td>${g.max}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;height:8px;background:var(--border-light);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${pct}%;background:${full?'var(--error)':'var(--primary)'};border-radius:4px"></div>
          </div>
          <span style="font-size:12px;color:var(--text-3);min-width:36px">${pct}%</span>
        </div>
      </td>
      <td class="text-right text-primary">¥${revenue.toLocaleString()}</td>
    </tr>`;
  }).join('');
  document.getElementById('groupTbody').innerHTML = rows;
}

// ===== 报名订单列表 =====
function renderOrders(){
  const e = getEvent(curEventId);
  const orders = getOrders(curEventId);
  const rows = orders.map(o=>{
    const g = e.groups.find(x=>x.id===o.groupId);
    const name = o.teamName || o.name || '-';
    return `<tr>
      <td class="mono" style="font-size:12px">${o.orderNo}</td>
      <td><div class="font-medium">${name}</div><div class="text-muted" style="font-size:12px">${o.contact||o.phone||''}</div></td>
      <td>${g?.name||'-'}</td>
      <td class="text-right">¥${o.amount}</td>
      <td>${o.payMethod||'-'}</td>
      <td style="font-size:12px">${o.payTime||'-'}</td>
      <td><span class="tag ${STATUS_TAG[o.status]||'tag-gray'}">${o.status}</span></td>
      <td class="actions">
        ${o.status==='待支付'?`<button class="btn btn-ghost btn-sm" onclick="simulatePay('${o.id}')">模拟支付</button>`:''}
        ${o.status==='已支付'?`<button class="btn btn-ghost btn-sm" onclick="cancelOrder('${o.id}')">取消退款</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="viewOrder('${o.id}')">详情</button>
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="8" class="text-center text-muted">暂无报名订单</td></tr>`;
  document.getElementById('orderTbody').innerHTML = rows;
}

// ===== 模拟小程序报名 =====
window.openSignupModal = function(){
  const e = getEvent(curEventId);
  if(e.status!=='报名中'){ toast('当前赛事未开放报名','warning'); return; }
  const groupOptions = e.groups.map(g=>{
    const enrolled = getGroupEnrolled(e.id,g.id);
    const full = enrolled>=g.max;
    return `<option value="${g.id}" ${full?'disabled':''}>${g.name}（${enrolled}/${g.max}）${full?' - 已满':''}</option>`;
  }).join('');
  const html = `<div class="modal">
    <div class="modal-header"><div class="modal-title"><i data-lucide="smartphone" style="width:18px;vertical-align:-4px"></i> 模拟小程序报名 - ${e.name}</div><div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div></div>
    <div class="modal-body">
      <div style="background:var(--info-bg);color:var(--info);padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:16px">
        <i data-lucide="info" style="width:14px;vertical-align:-2px"></i> 以下模拟参赛人员在小程序端选择组别并填写报名信息的流程。
      </div>
      <div class="form-item"><label class="form-label">选择组别<span class="required">*</span></label>
        <select class="form-select" id="sg-group" onchange="onGroupChange()">${groupOptions}</select>
      </div>
      <div class="form-row">
        <div class="form-item"><label class="form-label">姓名/队伍名<span class="required">*</span></label><input class="form-input" id="sg-name" placeholder="个人填写姓名，团体填写队伍名"></div>
        <div class="form-item"><label class="form-label">联系电话<span class="required">*</span></label><input class="form-input" id="sg-phone" placeholder="请输入手机号"></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label class="form-label">参赛人数</label><input type="number" class="form-input" id="sg-members" value="1" min="1"></div>
        <div class="form-item"><label class="form-label">报名费用</label>
          <div class="form-input" style="background:var(--border-light);font-weight:600;color:var(--primary)" id="sg-price">¥0</div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="submitSignup()"><i data-lucide="credit-card"></i> 提交并在线支付</button>
    </div>
  </div>`;
  openModal(html);
  onGroupChange();
  if(window.lucide) lucide.createIcons();
};
window.onGroupChange = function(){
  const e = getEvent(curEventId);
  const gid = document.getElementById('sg-group').value;
  const g = e.groups.find(x=>x.id===gid);
  if(g) document.getElementById('sg-price').textContent = '¥'+g.price;
};
window.submitSignup = function(){
  const e = getEvent(curEventId);
  const gid = document.getElementById('sg-group').value;
  const g = e.groups.find(x=>x.id===gid);
  const enrolled = getGroupEnrolled(e.id, gid);
  if(enrolled>=g.max){ toast(`${g.name} 名额已满，无法报名`,'error'); return; }
  const name = document.getElementById('sg-name').value.trim();
  const phone = document.getElementById('sg-phone').value.trim();
  if(!name||!phone){ toast('请填写姓名和电话','error'); return; }
  const members = Number(document.getElementById('sg-members').value)||1;
  const orderNo = 'SO'+Date.now().toString().slice(-10);
  // 生成报名订单（待支付）
  const order = {
    id:'SO'+Date.now(), orderNo, eventId:e.id, groupId:gid,
    [g.type==='团体'?'teamName':'name']:name,
    contact:name, phone, members, amount:g.price,
    payMethod:'', payTime:'', status:'待支付',
  };
  if(!SIGNUP_ORDERS[e.id]) SIGNUP_ORDERS[e.id]=[];
  SIGNUP_ORDERS[e.id].push(order);
  // 模拟在线支付
  const html = `<div class="modal" style="max-width:420px">
    <div class="modal-header"><div class="modal-title">在线支付</div><div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div></div>
    <div class="modal-body">
      <div style="text-align:center;padding:20px 0">
        <div class="text-muted">支付金额</div>
        <div class="font-bold text-primary" style="font-size:32px;margin:8px 0">¥${g.price}</div>
        <div class="text-muted" style="font-size:12px">订单号：${orderNo}</div>
      </div>
      <div class="kv-grid">
        <div class="kv-item"><div class="k">赛事</div><div class="v">${e.name}</div></div>
        <div class="kv-item"><div class="k">组别</div><div class="v">${g.name}</div></div>
        <div class="kv-item"><div class="k">参赛人</div><div class="v">${name}</div></div>
        <div class="kv-item"><div class="k">支付方式</div><div class="v">微信支付</div></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="confirmPay('${order.id}')"><i data-lucide="check"></i> 确认支付</button>
    </div>
  </div>`;
  document.querySelector('.modal-overlay').remove();
  openModal(html);
  if(window.lucide) lucide.createIcons();
};
window.confirmPay = function(oid){
  const orders = SIGNUP_ORDERS[curEventId];
  const o = orders.find(x=>x.id===oid);
  if(o){
    o.payMethod='微信支付';
    o.payTime=new Date().toLocaleString('zh-CN');
    o.status='已支付';
  }
  document.querySelector('.modal-overlay').remove();
  renderOrders(); renderGroupStats(); renderStats();
  toast('支付成功，报名成功！','success');
};
window.simulatePay = function(oid){
  const orders = SIGNUP_ORDERS[curEventId];
  const o = orders.find(x=>x.id===oid);
  if(o){
    o.payMethod='微信支付';
    o.payTime=new Date().toLocaleString('zh-CN');
    o.status='已支付';
  }
  renderOrders(); renderGroupStats(); renderStats();
  toast('支付成功','success');
};

// ===== 取消退款 =====
window.cancelOrder = function(oid){
  confirmDialog('取消该报名订单将退还报名费并释放参赛名额，确认继续？', ()=>{
    const orders = SIGNUP_ORDERS[curEventId];
    const o = orders.find(x=>x.id===oid);
    if(o){ o.status='已退款'; }
    renderOrders(); renderGroupStats(); renderStats();
    toast('报名已取消，名额已释放，退款将原路退回','success');
  });
};

// ===== 订单详情 =====
window.viewOrder = function(oid){
  const e = getEvent(curEventId);
  const o = getOrders(curEventId).find(x=>x.id===oid);
  const g = e.groups.find(x=>x.id===o.groupId);
  const name = o.teamName || o.name || '-';
  const html = `<div class="modal">
    <div class="modal-header">
      <div class="modal-title">报名订单详情 <span class="mono text-muted" style="font-size:13px">${o.orderNo}</span> <span class="tag ${STATUS_TAG[o.status]}" style="margin-left:8px">${o.status}</span></div>
      <div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div>
    </div>
    <div class="modal-body">
      <div class="kv-grid">
        <div class="kv-item"><div class="k">赛事</div><div class="v">${e.name}</div></div>
        <div class="kv-item"><div class="k">组别</div><div class="v">${g?.name||'-'}</div></div>
        <div class="kv-item"><div class="k">${g?.type==='团体'?'队伍名称':'姓名'}</div><div class="v">${name}</div></div>
        <div class="kv-item"><div class="k">联系电话</div><div class="v">${o.phone||'-'}</div></div>
        <div class="kv-item"><div class="k">参赛人数</div><div class="v">${o.members||1} 人</div></div>
        <div class="kv-item"><div class="k">报名费用</div><div class="v font-bold text-primary">¥${o.amount}</div></div>
        <div class="kv-item"><div class="k">支付方式</div><div class="v">${o.payMethod||'-'}</div></div>
        <div class="kv-item"><div class="k">支付时间</div><div class="v">${o.payTime||'-'}</div></div>
      </div>
      <div class="divider"></div>
      <div class="text-muted" style="font-size:13px">
        <i data-lucide="info" style="width:14px;vertical-align:-2px"></i>
        线上赛事报名不涉及场地选择与现场核销，参赛人员凭报名信息于比赛日到场签到。
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">关闭</button>
      ${o.status==='已支付'?`<button class="btn btn-default" style="color:var(--error)" onclick="this.closest('.modal-overlay').remove();cancelOrder('${o.id}')">取消退款</button>`:''}
    </div>
  </div>`;
  openModal(html);
  if(window.lucide) lucide.createIcons();
};

// ===== 创建线上赛事 =====
window.openCreateEvent = function(){
  const html = `<div class="modal modal-lg">
    <div class="modal-header"><div class="modal-title">新建线上赛事</div><div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-item"><label class="form-label">赛事名称<span class="required">*</span></label><input class="form-input" id="ce-name" placeholder="如：2026地丰青少年网球排名赛"></div>
        <div class="form-item"><label class="form-label">赛事类型</label>
          <select class="form-select" id="ce-type">${['篮球','足球','网球','羽毛球','乒乓球','其他'].map(t=>`<option>${t}</option>`).join('')}</select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item"><label class="form-label">比赛开始</label><input type="date" class="form-input" id="ce-start"></div>
        <div class="form-item"><label class="form-label">比赛结束</label><input type="date" class="form-input" id="ce-end"></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label class="form-label">报名开始</label><input type="date" class="form-input" id="ce-signstart"></div>
        <div class="form-item"><label class="form-label">报名截止</label><input type="date" class="form-input" id="ce-signend"></div>
      </div>
      <div class="form-item"><label class="form-label">赛制说明</label><textarea class="form-textarea" id="ce-rules" rows="2"></textarea></div>
      <div class="font-medium mb-12 mt-12">分组设置</div>
      <table class="data-table" id="ce-gtable">
        <thead><tr><th>组别名称</th><th>人数上限</th><th>报名类型</th><th>报名费（元）</th><th></th></tr></thead>
        <tbody id="ce-gtbody"></tbody>
      </table>
      <button class="btn btn-default btn-sm mt-12" onclick="addGroup()"><i data-lucide="plus" style="width:14px"></i> 添加分组</button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="createEvent()">创建并开放报名</button>
    </div>
  </div>`;
  openModal(html);
  addGroup(); addGroup();
  if(window.lucide) lucide.createIcons();
};
window.addGroup = function(){
  document.getElementById('ce-gtbody').insertAdjacentHTML('beforeend', `
    <tr>
      <td><input class="form-input" placeholder="如 U10男单"></td>
      <td><input type="number" class="form-input" value="32" style="width:80px"></td>
      <td><select class="form-select" style="width:90px"><option>个人</option><option>团体</option></select></td>
      <td><input type="number" class="form-input" value="200" style="width:100px"></td>
      <td><button class="btn btn-ghost btn-sm" onclick="this.closest('tr').remove()"><i data-lucide="trash-2" style="width:14px"></i></button></td>
    </tr>`);
  if(window.lucide) lucide.createIcons();
};
window.createEvent = function(){
  const name = document.getElementById('ce-name').value.trim();
  if(!name){ toast('请填写赛事名称','error'); return; }
  const rows = document.querySelectorAll('#ce-gtbody tr');
  if(rows.length===0){ toast('请至少设置一个分组','error'); return; }
  const groups = [];
  let valid = true;
  rows.forEach((r,i)=>{
    const inputs = r.querySelectorAll('input,select');
    const gname = inputs[0].value.trim();
    const max = Number(inputs[1].value)||0;
    const type = inputs[2].value;
    const price = Number(inputs[3].value)||0;
    if(!gname||max<=0){ valid=false; }
    groups.push({id:'G'+(i+1), name:gname, max, type, price});
  });
  if(!valid){ toast('请完整填写分组信息','error'); return; }
  const newEvent = {
    id:'EV'+Date.now(), name, type:document.getElementById('ce-type').value, status:'报名中',
    startDate:document.getElementById('ce-start').value, endDate:document.getElementById('ce-end').value,
    signupStart:document.getElementById('ce-signstart').value, signupEnd:document.getElementById('ce-signend').value,
    rules:document.getElementById('ce-rules').value, groups,
  };
  ONLINE_EVENTS.push(newEvent);
  SIGNUP_ORDERS[newEvent.id]=[];
  document.querySelector('.modal-overlay').remove();
  curEventId = newEvent.id;
  renderEventSelector(); renderAll();
  toast('线上赛事已创建并开放报名','success');
};

// ===== 批量开票（赛事结束后）=====
window.batchInvoice = function(){
  const e = getEvent(curEventId);
  const orders = getOrders(curEventId).filter(o=>o.status==='已支付');
  if(orders.length===0){ toast('没有已支付待开票的订单','warning'); return; }
  const total = orders.reduce((s,o)=>s+o.amount,0);
  const html = `<div class="modal">
    <div class="modal-header"><div class="modal-title">批量开票</div><div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div></div>
    <div class="modal-body">
      <div class="kv-grid mb-16">
        <div class="kv-item"><div class="k">赛事</div><div class="v">${e.name}</div></div>
        <div class="kv-item"><div class="k">可开票订单</div><div class="v">${orders.length} 笔</div></div>
        <div class="kv-item"><div class="k">开票总额</div><div class="v text-primary font-bold">¥${total.toLocaleString()}</div></div>
        <div class="kv-item"><div class="k">发票类型</div><div class="v"><select class="form-select"><option>电子普通发票</option><option>增值税专用发票</option></select></div></div>
      </div>
      <div style="background:var(--info-bg);color:var(--info);padding:10px 14px;border-radius:6px;font-size:13px">
        <i data-lucide="info" style="width:14px;vertical-align:-2px"></i>
        将为 ${orders.length} 笔已支付报名订单批量开具电子发票，开票后订单状态变更为「已开票」。
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="doBatchInvoice()">确认批量开票</button>
    </div>
  </div>`;
  openModal(html);
  if(window.lucide) lucide.createIcons();
};
window.doBatchInvoice = function(){
  const orders = getOrders(curEventId).filter(o=>o.status==='已支付');
  orders.forEach(o=>{ o.status='已开票'; });
  document.querySelector('.modal-overlay').remove();
  renderOrders(); renderGroupStats(); renderStats();
  toast(`已为 ${orders.length} 笔订单开具发票`,'success');
};

window.switchEvent = function(id){
  curEventId = id;
  renderAll();
};

function renderAll(){
  const e = getEvent(curEventId);
  document.getElementById('curEventInfo').innerHTML = `
    <div class="font-medium">${e.name}</div>
    <div class="text-muted" style="font-size:12px">${e.type} · 报名截止 ${e.signupEnd} · <span class="tag ${STATUS_TAG[e.status]||'tag-gray'}" style="margin-left:4px">${e.status}</span></div>`;
  renderStats();
  renderGroupStats();
  renderOrders();
}

<div class="card">

      <select class="form-select" id="eventSelector" onchange="switchEvent(this.value)"></select>
      <button class="btn btn-primary" onclick="openCreateEvent()"><i data-lucide="plus"></i> 新建线上赛事</button>
    </div>
  </div>
  <div class="card-body" id="curEventInfo"></div>
</div>

<!-- 分组统计 -->
<div class="card" style="margin-top:16px">
  <div class="card-header"><div class="card-title"><i data-lucide="users" style="width:16px;vertical-align:-3px"></i> 分组报名统计</div></div>
  <div class="card-body no-pad">

      <thead><tr><th>组别</th><th>状态</th><th class="text-center">已报名</th><th class="text-center">名额上限</th><th>报名进度</th><th class="text-right">收入</th></tr></thead>
      <tbody id="groupTbody"></tbody>

<!-- 报名订单 -->
<div class="card" style="margin-top:16px">
  <div class="card-header"><div class="card-title"><i data-lucide="receipt" style="width:16px;vertical-align:-3px"></i> 报名订单</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-default" onclick="openSignupModal()"><i data-lucide="smartphone"></i> 模拟小程序报名</button>
      <button class="btn btn-default" onclick="batchInvoice()"><i data-lucide="file-invoice"></i> 赛后批量开票</button>
    </div>
  </div>
  <div class="card-body no-pad">
    <table class="data-table">
      <thead><tr><th>订单号</th><th>参赛方</th><th>组别</th><th class="text-right">金额</th><th>支付方式</th><th>支付时间</th><th>状态</th><th style="width:180px">操作</th></tr></thead>
      <tbody id="orderTbody"></tbody>
    </table>
  </div>
</div>
`;

renderEventSelector();
renderAll();
if(window.lucide) lucide.createIcons();
</script>

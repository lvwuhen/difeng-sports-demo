function nowStr(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${TODAY} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

  'E3001': {title:'网络超时 / 连接失败', desc:'请求超时或连接中断，属网络类异常，按指数退避自动重试，最多 3 次。', type:'warning'},

  'E5001': {title:'签名验签失败', desc:'请求签名与密钥不匹配，需检查 AppKey / 证书配置后重推。', type:'error'}
};

/* ========== 统计 ========== */
function todayLogs(){
  return LOGS.filter(l => l.time.startsWith(TODAY));
}

function renderStats(){
  const list = todayLogs();
  const total = list.length;
  const fail = list.filter(l => l.result === '失败').length;
  const success = total - fail;
  const rate = total ? (success / total * 100).toFixed(1) : '0.0';
  const avg = total ? Math.round(list.reduce((s, l) => s + l.cost, 0) / total) : 0;
  const el = document.getElementById('log-stats');
  if(!el) return;
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">今日调用次数 <span class="stat-icon blue"><i data-lucide="activity"></i></span></div>
      <div class="stat-value">${total}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 次</span></div>
      <div class="stat-trend"><i data-lucide="calendar" style="width:14px;color:var(--text-3)"></i>统计日期 ${TODAY}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">成功率 <span class="stat-icon green"><i data-lucide="percent"></i></span></div>
      <div class="stat-value">${rate}%</div>
      <div class="stat-trend up"><i data-lucide="check-circle-2" style="width:14px"></i>成功 ${success} 次 / 共 ${total} 次</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">平均耗时 <span class="stat-icon cyan"><i data-lucide="timer"></i></span></div>
      <div class="stat-value">${avg}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> ms</span></div>
      <div class="stat-trend"><i data-lucide="info" style="width:14px;color:var(--text-3)"></i>含网络与对方系统处理时间</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">失败数 <span class="stat-icon red"><i data-lucide="x-circle"></i></span></div>
      <div class="stat-value">${fail}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 次</span></div>
      <div class="stat-trend down"><i data-lucide="alert-triangle" style="width:14px"></i>需按异常类型重试或补偿</div>
    </div>`;
  refreshIcons();
}

/* ========== 筛选 / 分页 ========== */
function filteredLogs(){
  const vendor = document.getElementById('log-vendor')?.value || '';
  const result = document.getElementById('log-result')?.value || '';
  const from = document.getElementById('log-from')?.value || '';
  const to = document.getElementById('log-to')?.value || '';
  const kw = (document.getElementById('log-kw')?.value || '').trim();
  return LOGS.filter(l => {
    const d = l.time.slice(0, 10);
    if(vendor && l.vendor !== vendor) return false;
    if(result && l.result !== result) return false;
    if(from && d < from) return false;
    if(to && d > to) return false;
    if(kw && !(l.doc.includes(kw) || l.id.includes(kw))) return false;
    return true;
  });
}
function resetAndRender(){ curPage = 1; renderTable(); }
function gotoPage(p){ curPage = p; renderTable(); }

function buildPager(total){
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(curPage > pages) curPage = pages;
  if(curPage < 1) curPage = 1;
  let btns = '';
  for(let i = 1; i <= pages; i++){
    btns += `<button class="page-btn ${i === curPage ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
  }
  const el = document.getElementById('log-pager');
  if(!el) return;
  el.innerHTML = `
    <div class="pagination-info">共 ${total} 条 · 第 ${curPage}/${pages} 页</div>
    <div class="pagination-pages">
      <button class="page-btn" ${curPage <= 1 ? 'disabled' : ''} onclick="gotoPage(${curPage - 1})"><i data-lucide="chevron-left" style="width:14px"></i></button>
      ${btns}
      <button class="page-btn" ${curPage >= pages ? 'disabled' : ''} onclick="gotoPage(${curPage + 1})"><i data-lucide="chevron-right" style="width:14px"></i></button>
    </div>`;
  refreshIcons();
}

function renderTable(){
  const list = filteredLogs();
  const start = (curPage - 1) * PAGE_SIZE;
  const rows = list.slice(start, start + PAGE_SIZE).map(l => `
    <tr>
      <td class="mono" style="font-size:13px">${l.id}</td>
      <td>
        <div class="font-medium" style="font-size:13px">${l.api}</div>
        <span class="tag tag-gray" style="margin-top:4px">${l.vendor}</span>
      </td>
      <td class="mono" style="font-size:12px">${l.doc}</td>
      <td style="font-size:13px;white-space:nowrap">${l.time}</td>
      <td class="text-right">${l.cost}</td>
      <td class="mono ${l.code === '200' ? 'text-success' : 'text-error'}">${l.code}</td>
      <td>
        <span class="tag ${l.result === '成功' ? 'tag-green' : 'tag-red'}">${l.result}</span>
        ${l.comp ? `<div class="tag tag-purple" style="margin-top:4px">${l.comp}</div>` : ''}
      </td>
      <td><button class="btn btn-default btn-sm" onclick="viewPayload('${l.id}')">查看报文</button></td>
    </tr>`).join('');
  const tb = document.getElementById('log-rows');
  if(tb){
    tb.innerHTML = rows || `<tr><td colspan="8"><div class="empty"><div class="empty-icon"><i data-lucide="terminal"></i></div><div class="empty-text">当前筛选条件下暂无接口日志</div></div></td></tr>`;
  }
  const cnt = document.getElementById('log-count');
  if(cnt) cnt.textContent = `当前筛选 ${list.length} 条`;
  buildPager(list.length);
  refreshIcons();
}

/* ========== 查看报文 ========== */
function viewPayload(id){
  const l = LOGS.find(x => x.id === id);
  if(!l) return;
  const desc = CODE_DESC[l.code] || {title:'未知返回码', desc:'请结合接口文档与对方系统返回信息排查。', type:'warning'};
  activeModal = openModal(`<div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">接口报文 · ${l.id}</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>
    </div>
    <div class="modal-body">
      <div class="kv-grid mb-16">
        <div class="kv-item"><div class="k">接口名称</div><div class="v">${l.api}</div></div>
        <div class="kv-item"><div class="k">关联单据</div><div class="v mono">${l.doc}</div></div>
        <div class="kv-item"><div class="k">调用时间</div><div class="v">${l.time}</div></div>
        <div class="kv-item"><div class="k">耗时 / 返回码</div><div class="v">${l.cost} ms · <span class="${l.code === '200' ? 'text-success' : 'text-error'}">${l.code}</span></div></div>
      </div>
      <div class="font-medium mb-8">请求报文</div>
      <pre style="margin:0 0 16px;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-size:12px;line-height:1.6;overflow:auto;max-height:220px">${esc(JSON.stringify(l.req, null, 2))}</pre>
      <div class="font-medium mb-8">响应报文</div>
      <pre style="margin:0 0 16px;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;font-size:12px;line-height:1.6;overflow:auto;max-height:220px">${esc(JSON.stringify(l.resp, null, 2))}</pre>
      <div class="card" style="border-left:3px solid var(--${desc.type === 'success' ? 'success' : desc.type === 'warning' ? 'warning' : 'error'})">
        <div class="card-body" style="padding:12px 16px">
          <div class="font-medium" style="font-size:13px">返回码说明：${l.code} · ${desc.title}</div>
          <div class="text-muted mt-8" style="font-size:13px">${desc.desc}</div>
        </div>
      </div>
      ${l.comp ? `<div class="mt-12 text-muted" style="font-size:13px"><i data-lucide="wrench" style="width:14px;vertical-align:middle"></i> 已人工补偿：${l.comp}${l.remark ? '（' + l.remark + '）' : ''}</div>` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">关闭</button>
      <button class="btn btn-primary" onclick="toast('报文已复制到剪贴板','success')"><i data-lucide="copy"></i>复制报文</button>
    </div>
  </div>`);
}

/* ========== 人工补偿 ========== */
function openCompensate(){
  const failed = LOGS.filter(l => l.result === '失败');
  if(!failed.length){ toast('当前无失败日志，无需人工补偿', 'info'); return; }
  const docs = [];
  failed.forEach(l => { if(docs.indexOf(l.doc) === -1) docs.push(l.doc); });
  activeModal = openModal(`<div class="modal">
    <div class="modal-header">
      <div class="modal-title">人工补偿</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>
    </div>
    <div class="modal-body">
      <div class="card" style="background:var(--warning-bg);border-color:var(--warning);margin-bottom:16px">
        <div class="card-body" style="padding:12px 16px;font-size:13px;color:var(--text-2)">
          人工补偿会直接影响业务/财务单据状态，所有操作必须填写原因并记录操作日志。
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label class="form-label">选择失败单据 <span class="required">*</span></label>
          <select class="form-select" id="cmp-doc">
            <option value="">请选择单据</option>
            ${docs.map(d => `<option value="${d}">${d}</option>`).join('')}
          </select>
        </div>
        <div class="form-item">
          <label class="form-label">补偿操作 <span class="required">*</span></label>
          <select class="form-select" id="cmp-op">
            <option value="">请选择操作</option>
            <option value="单据重推">单据重推</option>
            <option value="单据作废">单据作废</option>
            <option value="状态手工修正">状态手工修正</option>
          </select>
        </div>
      </div>
      <div class="form-item">
        <label class="form-label">操作原因 <span class="required">*</span></label>
        <textarea class="form-textarea" id="cmp-reason" placeholder="请说明补偿原因、责任人与处理依据，不少于 4 个字"></textarea>
      </div>
      <div class="form-hint">单据重推使用幂等键 = 业务单据号，不会重复生成财务单据。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">取消</button>
      <button class="btn btn-primary" onclick="submitCompensate()">确认补偿</button>
    </div>
  </div>`);
}

function submitCompensate(){
  const doc = document.getElementById('cmp-doc')?.value || '';
  const op = document.getElementById('cmp-op')?.value || '';
  const reason = (document.getElementById('cmp-reason')?.value || '').trim();
  if(!doc){ toast('请选择需要补偿的单据', 'error'); return; }
  if(!op){ toast('请选择补偿操作', 'error'); return; }
  if(reason.length < 4){ toast('请填写不少于 4 个字的操作原因', 'error'); return; }
  const target = LOGS.filter(l => l.doc === doc && l.result === '失败').slice(-1)[0];
  if(!target){ toast('未找到该单据的失败日志', 'error'); return; }
  if(op === '单据重推'){
    const newId = 'IL' + String(++logSeq).padStart(3, '0');
    LOGS.unshift({
      id:newId, api:target.api, vendor:target.vendor, doc:doc, time:nowStr(),
      cost: 320 + Math.floor(Math.random() * 900), code:'200', result:'成功',
      req: target.req, resp:{code:'200', message:'success', remark:'人工补偿重推'},
      remark: reason
    });
    target.comp = '已补偿';
    toast(`单据 ${doc} 已重推成功，生成日志 ${newId}`, 'success');
  } else if(op === '单据作废'){
    target.comp = '已作废';
    target.remark = reason;
    toast(`单据 ${doc} 已作废，作废原因已记录`, 'warning');
  } else {
    target.comp = '手工修正';
    target.remark = reason;
    toast(`单据 ${doc} 状态已手工修正，操作原因已记录`, 'success');
  }
  closeActiveModal();
  renderStats();
  renderTable();
}

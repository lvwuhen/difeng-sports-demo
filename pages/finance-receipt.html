<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../config.js?v=20261105"></script>
<script src="../auth-gate.js?v=20261105"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收款流水 - 地丰体育</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div id="app-shell"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../mock.js"></script>
<script src="../mock-extra.js"></script>
<script src="../api.js"></script>
<script src="../shell.js"></script>
<script>
window.__PREFIX__ = '../';
renderShell('finance-receipt', '收款流水');

/* ========== 工具 ========== */
const PAGE_SIZE = 6;
const TODAY = '2026-11-05';
let activeTab = 'all';
let pg = { list: 1 };
let seq = 0;
let activeModal = null;

function money(n){
  return (Number(n) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function nowStr(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${TODAY} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function genNo(prefix){
  seq++;
  return prefix + TODAY.replace(/-/g, '') + String(seq).padStart(4, '0');
}
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }
function closeActiveModal(){
  if(activeModal){ closeModal(activeModal); activeModal = null; }
}

const CHANNEL_TAG = { '微信支付':'tag-blue', '现金':'tag-orange', '对公转账':'tag-purple' };
const STATUS_TAG = { '已推送':'tag-blue', '待推送':'tag-orange', '已匹配':'tag-cyan', '待认领':'tag-red', '已核销':'tag-green' };
const MATCH_TAG = { '自动匹配':'tag-green', '手动匹配':'tag-blue', '内部流水':'tag-cyan', '待匹配':'tag-orange' };

/* ========== 数据 ========== */
/* 以 MOCK_EXT.financeReceipts 为基础，补充今日演示流水 */
let RECEIPTS = MOCK_EXT.financeReceipts.map(r => ({
  ...r,
  matchType: (!r.order && r.status !== '待认领') ? '待匹配' : r.matchType,
  pushTime: r.status === '已推送' ? r.time : '',
  claim: null,
  pool: r.status === '待认领' ? '待认领' : (!r.order ? '待匹配' : '')
}));

RECEIPTS.push(
  { id:'RC20261105001', txnNo:'XEF202611050001', amount:360.00, fee:2.34, net:357.66, channel:'微信支付', venue:'总部', merchant:'林雅婷', order:'', matchType:'待匹配', status:'待推送', pool:'待匹配', time:'2026-11-05 14:05', pushTime:'', claim:null },
  { id:'RC20261105002', txnNo:'CASH2026110501', amount:150.00, fee:0, net:150.00, channel:'现金', venue:'篮球公园', merchant:'散客', order:'ORD20261105002', matchType:'内部流水', status:'已匹配', pool:'', time:'2026-11-05 13:20', pushTime:'', claim:null },
  { id:'RC20261105003', txnNo:'BANK20261105001', amount:6800.00, fee:0, net:6800.00, channel:'对公转账', venue:'总部', merchant:'厦门市网球协会', order:'', matchType:'待匹配', status:'待认领', pool:'待认领', time:'2026-11-05 11:30', pushTime:'', claim:null },
  { id:'RC20261105004', txnNo:'XEF202611050004', amount:200.00, fee:1.20, net:198.80, channel:'微信支付', venue:'羽毛球馆', merchant:'陈晓明', order:'ORD20261105004', matchType:'自动匹配', status:'已推送', pool:'', time:'2026-11-05 10:05', pushTime:'2026-11-05 10:06', claim:null },
  { id:'RC20261105005', txnNo:'XEF202611050005', amount:88.00, fee:0.55, net:87.45, channel:'微信支付', venue:'总部', merchant:'散客', order:'ORD20261105005', matchType:'自动匹配', status:'已核销', pool:'', time:'2026-11-05 09:12', pushTime:'2026-11-05 09:13', claim:null }
);

RECEIPTS.sort((a, b) => b.time.localeCompare(a.time));

/* ========== 筛选与分页 ========== */
function resetAndRender(){ pg.list = 1; renderTable(); }

function filteredReceipts(){
  const kw = (document.getElementById('rc-kw')?.value || '').trim();
  const ch = document.getElementById('rc-channel')?.value || '';
  const st = document.getElementById('rc-status')?.value || '';
  return RECEIPTS.filter(r => {
    if(activeTab === 'match' && r.pool !== '待匹配') return false;
    if(activeTab === 'claim' && r.pool !== '待认领') return false;
    if(ch && r.channel !== ch) return false;
    if(st && r.status !== st) return false;
    if(kw && !(r.id.includes(kw) || r.txnNo.includes(kw) || (r.merchant || '').includes(kw) || (r.order || '').includes(kw))) return false;
    return true;
  });
}

function gotoPage(p){ pg.list = p; renderTable(); }

function buildPager(total){
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(pg.list > pages) pg.list = pages;
  if(pg.list < 1) pg.list = 1;
  let btns = '';
  for(let i = 1; i <= pages; i++){
    btns += `<button class="page-btn ${i === pg.list ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
  }
  const el = document.getElementById('rc-pager');
  if(!el) return;
  el.innerHTML = `
    <div class="pagination-info">共 ${total} 条 · 第 ${pg.list}/${pages} 页</div>
    <div class="pagination-pages">
      <button class="page-btn" ${pg.list <= 1 ? 'disabled' : ''} onclick="gotoPage(${pg.list - 1})"><i data-lucide="chevron-left" style="width:14px"></i></button>
      ${btns}
      <button class="page-btn" ${pg.list >= pages ? 'disabled' : ''} onclick="gotoPage(${pg.list + 1})"><i data-lucide="chevron-right" style="width:14px"></i></button>
    </div>`;
  refreshIcons();
}

/* ========== 渲染：页签 / 统计 / 列表 ========== */
function renderTabs(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
  const allEl = document.getElementById('tab-n-all');
  const matchEl = document.getElementById('tab-n-match');
  const claimEl = document.getElementById('tab-n-claim');
  if(allEl) allEl.textContent = RECEIPTS.length;
  if(matchEl) matchEl.textContent = RECEIPTS.filter(r => r.pool === '待匹配').length;
  if(claimEl) claimEl.textContent = RECEIPTS.filter(r => r.pool === '待认领').length;
}

function switchTab(name){
  activeTab = name;
  pg.list = 1;
  renderTabs();
  renderTable();
}

function renderStats(){
  const todayList = RECEIPTS.filter(r => r.time.startsWith(TODAY));
  const total = todayList.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const fee = todayList.reduce((s, r) => s + (Number(r.fee) || 0), 0);
  const pendingMatch = RECEIPTS.filter(r => r.pool === '待匹配').length;
  const el = document.getElementById('rc-stats');
  if(!el) return;
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">今日流水笔数 <span class="stat-icon blue"><i data-lucide="receipt"></i></span></div>
      <div class="stat-value">${todayList.length}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 笔</span></div>
      <div class="stat-trend up"><i data-lucide="arrow-up-right" style="width:14px"></i>含微信、现金、对公转账</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">流水总额 <span class="stat-icon green"><i data-lucide="banknote"></i></span></div>
      <div class="stat-value">¥${money(total)}</div>
      <div class="stat-trend up"><i data-lucide="calendar" style="width:14px"></i>统计日期 ${TODAY}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">手续费合计 <span class="stat-icon orange"><i data-lucide="percent"></i></span></div>
      <div class="stat-value">¥${money(fee)}</div>
      <div class="stat-trend"><i data-lucide="info" style="width:14px;color:var(--text-3)"></i>按银行/渠道回单金额记录</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">待匹配笔数 <span class="stat-icon red"><i data-lucide="link-2-off"></i></span></div>
      <div class="stat-value">${pendingMatch}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 笔</span></div>
      <div class="stat-trend down"><i data-lucide="alert-triangle" style="width:14px"></i>需人工关联订单</div>
    </div>`;
  refreshIcons();
}

function renderTable(){
  const list = filteredReceipts();
  const start = (pg.list - 1) * PAGE_SIZE;
  const rows = list.slice(start, start + PAGE_SIZE).map(r => {
    const acts = [];
    if(!r.order && r.status !== '待认领') acts.push(`<button class="btn btn-default btn-sm" onclick="openMatch('${r.id}')">手动匹配</button>`);
    if(r.status === '待认领') acts.push(`<button class="btn btn-primary btn-sm" onclick="openClaim('${r.id}')">认领</button>`);
    if(r.status === '已匹配' || (r.status === '待推送' && r.order)) acts.push(`<button class="btn btn-success btn-sm" onclick="pushReceipt('${r.id}')">推送财务</button>`);
    return `<tr>
      <td class="mono" style="font-size:13px">${r.id}</td>
      <td class="mono" style="font-size:12px;color:var(--text-3)">${r.txnNo}</td>
      <td class="text-right font-medium">¥${money(r.amount)}</td>
      <td class="text-right text-muted">¥${money(r.fee)}</td>
      <td class="text-right">¥${money(r.net)}</td>
      <td><span class="tag ${CHANNEL_TAG[r.channel] || 'tag-gray'}">${r.channel}</span></td>
      <td>${r.venue}</td>
      <td>${r.merchant || '<span class="text-muted">—</span>'}</td>
      <td class="mono" style="font-size:12px">${r.order || '<span class="text-muted">未关联</span>'}</td>
      <td><span class="tag ${MATCH_TAG[r.matchType] || 'tag-gray'}">${r.matchType}</span></td>
      <td><span class="tag ${STATUS_TAG[r.status] || 'tag-gray'}">${r.status}</span></td>
      <td style="font-size:13px;white-space:nowrap">${r.time}</td>
      <td class="actions" style="flex-wrap:wrap">${acts.length ? acts.join('') : '<span class="text-muted">—</span>'}</td>
    </tr>`;
  }).join('');
  const tb = document.getElementById('rc-rows');
  if(tb){
    tb.innerHTML = rows || `<tr><td colspan="13"><div class="empty"><div class="empty-icon"><i data-lucide="inbox"></i></div><div class="empty-text">当前条件下暂无收款流水</div></div></td></tr>`;
  }
  const cnt = document.getElementById('rc-count');
  if(cnt) cnt.textContent = `当前筛选 ${list.length} 笔`;
  buildPager(list.length);
  refreshIcons();
}

function renderAll(){
  renderTabs();
  renderStats();
  renderTable();
}

/* ========== 操作：手动匹配 ========== */
function openMatch(id){
  const r = RECEIPTS.find(x => x.id === id);
  if(!r) return;
  closeActiveModal();
  const options = MOCK.orders.map(o => `<option value="${o.id}">${o.id} · ${o.customer} · ${o.venue} · ¥${money(o.amount)}</option>`).join('');
  activeModal = openModal(`
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">手动匹配订单</div>
        <div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div>
      </div>
      <div class="modal-body">
        <div class="kv-grid">
          <div class="kv-item"><span class="k">收款流水号</span><span class="v mono">${r.id}</span></div>
          <div class="kv-item"><span class="k">交易流水号</span><span class="v mono">${r.txnNo}</span></div>
          <div class="kv-item"><span class="k">收款金额</span><span class="v">¥${money(r.amount)}</span></div>
          <div class="kv-item"><span class="k">支付渠道 / 场馆</span><span class="v">${r.channel} · ${r.venue}</span></div>
        </div>
        <div class="form-item" style="margin-top:16px">
          <label class="form-label">关联订单号<span class="required">*</span></label>
          <select class="form-select" id="match-order">
            <option value="">请选择订单</option>
            ${options}
          </select>
          <div class="form-hint">系统按金额与时间推荐候选订单，请人工确认后匹配；匹配后流水状态变为「已匹配」。</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" onclick="submitMatch('${r.id}')">确认匹配</button>
      </div>
    </div>`);
}

function submitMatch(id){
  const val = document.getElementById('match-order')?.value || '';
  if(!val){ toast('请选择关联订单号后再提交', 'error'); return; }
  const r = RECEIPTS.find(x => x.id === id);
  if(!r) return;
  r.order = val;
  r.matchType = '手动匹配';
  r.status = '已匹配';
  r.pool = '';
  closeActiveModal();
  renderAll();
  toast(`流水 ${r.id} 已匹配订单 ${val}`, 'success');
}

/* ========== 操作：认领 ========== */
function openClaim(id){
  const r = RECEIPTS.find(x => x.id === id);
  if(!r) return;
  closeActiveModal();
  const options = MOCK.orders.map(o => `<option value="${o.id}">${o.id} · ${o.customer} · ¥${money(o.amount)}</option>`).join('');
  activeModal = openModal(`
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">认领对公转账</div>
        <div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div>
      </div>
      <div class="modal-body">
        <div class="kv-grid mb-16">
          <div class="kv-item"><span class="k">收款流水号</span><span class="v mono">${r.id}</span></div>
          <div class="kv-item"><span class="k">到账金额</span><span class="v">¥${money(r.amount)}</span></div>
          <div class="kv-item"><span class="k">银行交易流水号</span><span class="v mono">${r.txnNo}</span></div>
          <div class="kv-item"><span class="k">场馆</span><span class="v">${r.venue}</span></div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label class="form-label">付款单位<span class="required">*</span></label>
            <input class="form-input" id="claim-payer" value="${r.merchant || ''}" placeholder="请输入付款单位名称" />
          </div>
          <div class="form-item">
            <label class="form-label">银行流水号<span class="required">*</span></label>
            <input class="form-input" id="claim-txn" value="${r.txnNo}" placeholder="请输入银行流水号" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label class="form-label">到账日期<span class="required">*</span></label>
            <input class="form-input" type="date" id="claim-date" value="${TODAY}" />
          </div>
          <div class="form-item">
            <label class="form-label">关联订单（选填）</label>
            <select class="form-select" id="claim-order">
              <option value="">暂不关联订单</option>
              ${options}
            </select>
          </div>
        </div>
        <div class="form-hint">对公转账到账后 3 个自然日内未认领将触发超期告警，超过 7 天自动转入待处理台账。</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" onclick="submitClaim('${r.id}')">确认认领</button>
      </div>
    </div>`);
}

function submitClaim(id){
  const payer = (document.getElementById('claim-payer')?.value || '').trim();
  const txn = (document.getElementById('claim-txn')?.value || '').trim();
  const date = document.getElementById('claim-date')?.value || '';
  if(!payer){ toast('请填写付款单位', 'error'); return; }
  if(!txn){ toast('请填写银行流水号', 'error'); return; }
  if(!date){ toast('请选择到账日期', 'error'); return; }
  const r = RECEIPTS.find(x => x.id === id);
  if(!r) return;
  const order = document.getElementById('claim-order')?.value || '';
  r.merchant = payer;
  r.claim = { payer, txnNo: txn, arriveDate: date };
  r.matchType = '手动匹配';
  r.status = '已匹配';
  r.pool = '';
  if(order) r.order = order;
  closeActiveModal();
  renderAll();
  toast(`已认领付款单位「${payer}」，可继续推送财务`, 'success');
}

/* ========== 操作：推送财务 ========== */
function pushReceipt(id){
  const r = RECEIPTS.find(x => x.id === id);
  if(!r) return;
  if(r.status !== '已匹配' && r.status !== '待推送'){ toast('该流水当前状态不可推送', 'warning'); return; }
  r.status = '已推送';
  r.pushTime = nowStr();
  renderAll();
  toast(`收款流水 ${r.id} 已推送至用友NCC`, 'success');
}

/* ========== 页面骨架 ========== */
document.getElementById('page-content').innerHTML = `
  <div class="page-header">
    <div class="flex justify-between items-center" style="flex-wrap:wrap;gap:12px">
      <div>
        <div class="page-title">收款流水</div>
        <div class="page-desc">银行回单、微信支付、现金、对公转账统一归集，支持订单匹配、认领与推送财务</div>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-default" onclick="renderAll();toast('收款流水已刷新','info')"><i data-lucide="refresh-cw"></i>刷新</button>
        <button class="btn btn-primary" onclick="toast('收款流水已导出为 Excel','success')"><i data-lucide="download"></i>导出流水</button>
      </div>
    </div>
  </div>

  <div class="stats-grid" id="rc-stats"></div>

  <div class="card">
    <div class="card-body" style="padding-bottom:0">
      <div class="tabs" style="margin-bottom:0">
        <div class="tab active" data-tab="all" onclick="switchTab('all')"><i data-lucide="list" style="width:16px;vertical-align:middle"></i> 全部流水 <span class="text-muted" id="tab-n-all" style="font-size:12px">0</span></div>
        <div class="tab" data-tab="match" onclick="switchTab('match')"><i data-lucide="unlink" style="width:16px;vertical-align:middle"></i> 待匹配池 <span class="text-muted" id="tab-n-match" style="font-size:12px">0</span></div>
        <div class="tab" data-tab="claim" onclick="switchTab('claim')"><i data-lucide="user-check" style="width:16px;vertical-align:middle"></i> 待认领池 <span class="text-muted" id="tab-n-claim" style="font-size:12px">0</span></div>
      </div>
    </div>
    <div class="card-body" style="padding-top:16px">
      <div class="toolbar">
        <input class="form-input" id="rc-kw" placeholder="搜索流水号 / 交易号 / 客商 / 订单" oninput="resetAndRender()" style="min-width:260px" />
        <select class="form-select" id="rc-channel" onchange="resetAndRender()">
          <option value="">全部支付渠道</option>
          <option value="微信支付">微信支付</option>
          <option value="现金">现金</option>
          <option value="对公转账">对公转账</option>
        </select>
        <select class="form-select" id="rc-status" onchange="resetAndRender()">
          <option value="">全部状态</option>
          <option value="待推送">待推送</option>
          <option value="已推送">已推送</option>
          <option value="已匹配">已匹配</option>
          <option value="待认领">待认领</option>
          <option value="已核销">已核销</option>
        </select>
        <div class="spacer"></div>
        <span class="text-muted" id="rc-count" style="font-size:13px"></span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>收款流水号</th>
              <th>交易流水号</th>
              <th class="text-right">金额</th>
              <th class="text-right">手续费</th>
              <th class="text-right">实收金额</th>
              <th>支付渠道</th>
              <th>场馆</th>
              <th>客商</th>
              <th>关联订单</th>
              <th>匹配方式</th>
              <th>状态</th>
              <th>时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="rc-rows"></tbody>
        </table>
      </div>
      <div class="pagination" id="rc-pager"></div>
    </div>
  </div>

  <div class="card mt-16">
    <div class="card-header">
      <div class="card-title">流水处理说明</div>
      <span class="tag tag-gray">规则说明</span>
    </div>
    <div class="card-body">
      <div class="list-row">
        <span class="stat-icon orange" style="width:32px;height:32px;flex-shrink:0"><i data-lucide="wallet"></i></span>
        <div>
          <div class="font-medium">现金收款生成内部流水</div>
          <div class="text-muted" style="font-size:13px">前台现金收款时系统自动生成内部收款流水，交易流水号为 CASH 前缀，匹配方式记为「内部流水」，不依赖银行回单。</div>
        </div>
      </div>
      <div class="list-row">
        <span class="stat-icon blue" style="width:32px;height:32px;flex-shrink:0"><i data-lucide="percent"></i></span>
        <div>
          <div class="font-medium">手续费按银行返回金额记录</div>
          <div class="text-muted" style="font-size:13px">微信、支付宝等渠道手续费以银行/渠道回单为准，系统按回单金额记录手续费与实收金额，不做比例反算，避免对账差异。</div>
        </div>
      </div>
      <div class="list-row">

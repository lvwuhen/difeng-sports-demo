<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../config.js?v=20261105"></script>
<script src="../auth-gate.js?v=20261105"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财务对账 - 地丰体育</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div id="app-shell"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../mock.js"></script>
<script src="../mock-extra.js"></script>
<script src="../api.js"></script>
<script src="../shell.js"></script>
<script>
window.__PREFIX__ = '../';
renderShell('finance-reconcile', '财务对账');

/* ========== 工具 ========== */
const PAGE_SIZE = 6;
const TODAY = '2026-11-05';
let curPage = 1;
let activeModal = null;

function money(n){
  return (Number(n) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }
function closeActiveModal(){
  if(activeModal){ closeModal(activeModal); activeModal = null; }
}
function nowStr(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${TODAY} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ========== 数据 ========== */
let DIFFS = MOCK_EXT.reconcileDiffs.map(d => ({
  ...d,
  orderNo: d.doc,
  settleNo: 'RC' + d.doc.replace('AR', ''),
  finNo: d.status === '已处理' ? 'NCC-AR-' + d.doc.slice(-8) + '-001' : '',
  handler: d.status === '已处理' ? '王财务' : '',
  handleTime: d.status === '已处理' ? '2026-10-31 09:20' : '',
  handleNote: d.status === '已处理' ? '财务已审核并回写业务系统，状态已同步' : ''
}));

DIFFS.push(
  {id:'DF202607', period:'2026-10', type:'金额不符', bizAmount:3680.00, finAmount:3530.00, diff:-150.00, doc:'AR20261026', reason:'对公转账到账金额少 150 元，未补收', status:'待处理', orderNo:'AR20261026', settleNo:'RC20261026', finNo:'', handler:'', handleTime:'', handleNote:''},
  {id:'DF202606', period:'2026-10', type:'单据缺失', bizAmount:800.00, finAmount:0, diff:-800.00, doc:'RC20261030002', reason:'收款流水未关联订单，财务未生成收款单', status:'待处理', orderNo:'ORD20261030001', settleNo:'RC20261030002', finNo:'', handler:'', handleTime:'', handleNote:''},
  {id:'DF202605', period:'2026-10', type:'状态不一致', bizAmount:12800.00, finAmount:12800.00, diff:0, doc:'AR20261031', reason:'财务已接收业务未回写，业务侧仍为待推送', status:'处理中', orderNo:'AR20261031', settleNo:'RC20261031', finNo:'NCC-AR-20261031-007', handler:'', handleTime:'', handleNote:''},
  {id:'DF202604', period:'2026-09', type:'金额不符', bizAmount:2560.00, finAmount:2524.00, diff:-36.00, doc:'AR20260928', reason:'渠道手续费未在业务侧扣减', status:'已处理', orderNo:'AR20260928', settleNo:'RC20260928', finNo:'NCC-AR-20260928-003', handler:'王财务', handleTime:'2026-10-10 11:20', handleNote:'已按银行回单金额调整业务侧手续费'},
  {id:'DF202603', period:'2026-09', type:'单据缺失', bizAmount:1200.00, finAmount:0, diff:-1200.00, doc:'RC20260915', reason:'推送失败未重试，财务未生成单据', status:'已处理', orderNo:'RC20260915', settleNo:'RC20260915', finNo:'NCC-AR-20260915-002', handler:'李财务', handleTime:'2026-10-08 16:40', handleNote:'已人工重推并生成财务单据'},
  {id:'DF202602', period:'2026-09', type:'状态不一致', bizAmount:6840.00, finAmount:6840.00, diff:0, doc:'AR20260912', reason:'财务已审核，业务侧状态未回写', status:'待处理', orderNo:'AR20260912', settleNo:'RC20260912', finNo:'NCC-AR-20260912-001', handler:'', handleTime:'', handleNote:''},
  {id:'DF202601', period:'2026-09', type:'金额不符', bizAmount:9780.00, finAmount:9721.50, diff:-58.50, doc:'AR20260905', reason:'微信渠道手续费差异 58.50 元', status:'已处理', orderNo:'AR20260905', settleNo:'RC20260905', finNo:'NCC-AR-20260905-004', handler:'王财务', handleTime:'2026-10-06 10:05', handleNote:'已按渠道回单核对，差异计入手续费'}
);

DIFFS.sort((a, b) => b.period.localeCompare(a.period) || b.id.localeCompare(a.id));

const STATUS_TAG = {
  '待处理':'tag-orange',
  '处理中':'tag-blue',
  '已处理':'tag-green'
};
const TYPE_TAG = {
  '金额不符':'tag-red',
  '单据缺失':'tag-orange',
  '状态不一致':'tag-purple'
};

/* ========== 统计 ========== */
function periodDiffs(){
  const period = document.getElementById('rq-period')?.value || '2026-10';
  return DIFFS.filter(d => d.period === period);
}

function renderStats(){
  const list = periodDiffs();
  const pending = list.filter(d => d.status === '待处理').length;
  const done = list.filter(d => d.status === '已处理').length;
  const diffTotal = list.reduce((s, d) => s + Math.abs(d.diff), 0);
  const el = document.getElementById('rq-stats');
  if(!el) return;
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">本期差异项 <span class="stat-icon blue"><i data-lucide="scale"></i></span></div>
      <div class="stat-value">${list.length}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 项</span></div>
      <div class="stat-trend"><i data-lucide="calendar" style="width:14px;color:var(--text-3)"></i>对账周期 ${document.getElementById('rq-period')?.value || '2026-10'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">待处理 <span class="stat-icon orange"><i data-lucide="clock-3"></i></span></div>
      <div class="stat-value">${pending}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 项</span></div>
      <div class="stat-trend down"><i data-lucide="alert-triangle" style="width:14px"></i>需财务确认并处理</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">已处理 <span class="stat-icon green"><i data-lucide="check-check"></i></span></div>
      <div class="stat-value">${done}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 项</span></div>
      <div class="stat-trend up"><i data-lucide="check-circle-2" style="width:14px"></i>差异已闭环</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">差异金额合计 <span class="stat-icon red"><i data-lucide="circle-dollar-sign"></i></span></div>
      <div class="stat-value">¥${money(diffTotal)}</div>
      <div class="stat-trend"><i data-lucide="info" style="width:14px;color:var(--text-3)"></i>按差异额绝对值汇总</div>
    </div>`;
  refreshIcons();
}

/* ========== 筛选 / 分页 ========== */
function filteredDiffs(){
  const period = document.getElementById('rq-period')?.value || '';
  const type = document.getElementById('rq-type')?.value || '';
  const st = document.getElementById('rq-status')?.value || '';
  const kw = (document.getElementById('rq-kw')?.value || '').trim();
  return DIFFS.filter(d => {
    if(period && d.period !== period) return false;
    if(type && d.type !== type) return false;
    if(st && d.status !== st) return false;
    if(kw && !(d.id.includes(kw) || d.doc.includes(kw) || d.reason.includes(kw))) return false;
    return true;
  });
}
function resetAndRender(){ curPage = 1; renderStats(); renderTable(); }
function gotoPage(p){ curPage = p; renderTable(); }

function buildPager(total){
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(curPage > pages) curPage = pages;
  if(curPage < 1) curPage = 1;
  let btns = '';
  for(let i = 1; i <= pages; i++){
    btns += `<button class="page-btn ${i === curPage ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
  }
  const el = document.getElementById('rq-pager');
  if(!el) return;
  el.innerHTML = `
    <div class="pagination-info">共 ${total} 条 · 第 ${curPage}/${pages} 页</div>
    <div class="pagination-pages">
      <button class="page-btn" ${curPage <= 1 ? 'disabled' : ''} onclick="gotoPage(${curPage - 1})"><i data-lucide="chevron-left" style="width:14px"></i></button>
      ${btns}
      <button class="page-btn" ${curPage >= pages ? 'disabled' : ''} onclick="gotoPage(${curPage + 1})"><i data-lucide="chevron-right" style="width:14px"></i></button>
    </div>`;
  refreshIcons();
}

function renderTable(){
  const list = filteredDiffs();
  const start = (curPage - 1) * PAGE_SIZE;
  const rows = list.slice(start, start + PAGE_SIZE).map(d => {
    const handleBtn = d.status === '已处理'
      ? `<button class="btn btn-ghost btn-sm" onclick="toast('该差异已处理，可在单据链路中查看处理记录','info')">已处理</button>`
      : `<button class="btn btn-primary btn-sm" onclick="openHandle('${d.id}')">处理差异</button>`;
    return `<tr>
      <td class="mono" style="font-size:13px">${d.id}</td>
      <td style="font-size:13px">${d.period}</td>
      <td><span class="tag ${TYPE_TAG[d.type] || 'tag-gray'}">${d.type}</span></td>
      <td class="text-right">¥${money(d.bizAmount)}</td>
      <td class="text-right">${d.finAmount ? '¥' + money(d.finAmount) : '<span class="text-muted">—</span>'}</td>
      <td class="text-right ${d.diff ? 'text-error font-medium' : 'text-muted'}">${d.diff ? (d.diff > 0 ? '+' : '') + '¥' + money(d.diff) : '¥0.00'}</td>
      <td class="mono" style="font-size:12px">${d.doc}</td>
      <td style="font-size:13px;max-width:220px">${d.reason}</td>
      <td><span class="tag ${STATUS_TAG[d.status] || 'tag-gray'}">${d.status}</span></td>
      <td class="actions" style="flex-wrap:wrap">
        ${handleBtn}
        <button class="btn btn-default btn-sm" onclick="openChain('${d.id}')">查看单据链路</button>
      </td>
    </tr>`;
  }).join('');
  const tb = document.getElementById('rq-rows');
  if(tb){
    tb.innerHTML = rows || `<tr><td colspan="10"><div class="empty"><div class="empty-icon"><i data-lucide="search-x"></i></div><div class="empty-text">当前筛选条件下暂无差异项</div></div></td></tr>`;
  }
  const cnt = document.getElementById('rq-count');
  if(cnt) cnt.textContent = `当前筛选 ${list.length} 项`;
  buildPager(list.length);
  refreshIcons();
}

/* ========== 处理差异 ========== */
function openHandle(id){
  const d = DIFFS.find(x => x.id === id);
  if(!d) return;
  if(d.status === '已处理'){ toast('该差异已处理，无需重复操作', 'info'); return; }
  activeModal = openModal(`<div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">处理差异 · ${d.id}</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>
    </div>
    <div class="modal-body">
      <div class="kv-grid mb-16">
        <div class="kv-item"><div class="k">差异类型</div><div class="v">${d.type}</div></div>
        <div class="kv-item"><div class="k">对账周期</div><div class="v">${d.period}</div></div>
        <div class="kv-item"><div class="k">业务金额</div><div class="v">¥${money(d.bizAmount)}</div></div>
        <div class="kv-item"><div class="k">财务金额</div><div class="v">¥${money(d.finAmount)}</div></div>
        <div class="kv-item"><div class="k">差异额</div><div class="v font-bold ${d.diff ? 'text-error' : ''}">${d.diff ? (d.diff > 0 ? '+' : '') + '¥' + money(d.diff) : '¥0.00'}</div></div>
        <div class="kv-item"><div class="k">关联单据</div><div class="v mono">${d.doc}</div></div>
      </div>
      <div class="card" style="background:var(--warning-bg);border-color:var(--warning);margin-bottom:16px">
        <div class="card-body" style="padding:12px 16px;font-size:13px;color:var(--text-2)">
          <b>差异原因：</b>${d.reason}
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label class="form-label">处理方式 <span class="required">*</span></label>
          <select class="form-select" id="handle-method">
            <option value="">请选择处理方式</option>
            <option value="调整业务数据">调整业务数据</option>
            <option value="调整财务数据">调整财务数据</option>
            <option value="补推单据">补推单据</option>
            <option value="确认无差异">确认无差异</option>
          </select>
        </div>
        <div class="form-item">
          <label class="form-label">处理人</label>
          <input class="form-input" value="王财务" disabled />
        </div>
      </div>
      <div class="form-item">
        <label class="form-label">处理说明 <span class="required">*</span></label>
        <textarea class="form-textarea" id="handle-note" placeholder="请填写处理依据、调整金额及凭证号，不少于 4 个字"></textarea>
      </div>
      <div class="form-hint">提交后差异状态将置为「已处理」，处理记录同步写入操作日志。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">取消</button>
      <button class="btn btn-primary" onclick="submitHandle('${d.id}')">提交处理</button>
    </div>
  </div>`);
}

function submitHandle(id){
  const d = DIFFS.find(x => x.id === id);
  if(!d) return;
  const method = document.getElementById('handle-method')?.value || '';
  const note = (document.getElementById('handle-note')?.value || '').trim();
  if(!method){ toast('请选择处理方式', 'error'); return; }
  if(note.length < 4){ toast('请填写不少于 4 个字的处理说明', 'error'); return; }
  d.status = '已处理';
  d.handler = '王财务';
  d.handleTime = nowStr();
  d.handleNote = note;
  d.handleMethod = method;
  closeActiveModal();
  resetAndRender();
  toast(`差异 ${d.id} 已处理，处理方式：${method}`, 'success');
}

/* ========== 单据链路 ========== */
function chainSteps(d){
  const finNo = d.finNo || '未生成';
  return `<div class="timeline" style="margin-bottom:0">
    <div class="timeline-item success">
      <div class="timeline-time">第 1 步 · ${d.period}</div>
      <div class="timeline-title">业务订单 / 应收单 <span class="mono">${d.orderNo || d.doc}</span></div>
      <div class="timeline-desc">业务来源单据 ${d.doc} · 业务金额 ¥${money(d.bizAmount)}</div>
    </div>
    <div class="timeline-item ${d.finAmount ? 'success' : 'warning'}">
      <div class="timeline-time">第 2 步</div>
      <div class="timeline-title">财务应收单 <span class="mono">AR-${d.doc}</span></div>
      <div class="timeline-desc">${d.finAmount ? '财务应收金额 ¥' + money(d.finAmount) : '财务未生成应收单，单据缺失'}</div>
    </div>
    <div class="timeline-item ${d.settleNo ? 'success' : 'warning'}">
      <div class="timeline-time">第 3 步</div>
      <div class="timeline-title">收款单 <span class="mono">${d.settleNo || '未匹配'}</span></div>
      <div class="timeline-desc">按银行回单 / 内部流水匹配收款记录</div>
    </div>
    <div class="timeline-item ${d.finNo ? 'success' : 'error'}">
      <div class="timeline-time">第 4 步</div>
      <div class="timeline-title">财务单据号 <span class="mono">${finNo}</span></div>
      <div class="timeline-desc">${d.finNo ? '用友 NCC 已生成正式财务单据，可追溯查询' : '尚未生成财务单据，需重推或人工补单'}</div>
    </div>
  </div>`;
}

function openChain(id){
  const d = DIFFS.find(x => x.id === id);
  if(!d) return;
  activeModal = openModal(`<div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">单据链路 · ${d.id}</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>
    </div>
    <div class="modal-body">
      <div class="flex gap-8" style="margin-bottom:16px;flex-wrap:wrap">
        <span class="tag tag-blue">业务订单</span>
        <span class="tag tag-cyan">财务应收单</span>
        <span class="tag tag-purple">收款单</span>
        <span class="tag tag-green">财务单据号</span>
      </div>
      ${chainSteps(d)}
      <div class="divider"></div>
      <div class="kv-grid">
        <div class="kv-item"><div class="k">差异类型</div><div class="v">${d.type}</div></div>
        <div class="kv-item"><div class="k">差异状态</div><div class="v"><span class="tag ${STATUS_TAG[d.status]}">${d.status}</span></div></div>
        <div class="kv-item"><div class="k">处理人</div><div class="v">${d.handler || '—'}</div></div>
        <div class="kv-item"><div class="k">处理时间</div><div class="v">${d.handleTime || '—'}</div></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">关闭</button>
    </div>
  </div>`);
}

/* ========== 全链路追溯 ========== */
function traceOrder(){
  const kw = (document.getElementById('trace-order')?.value || '').trim();
  const el = document.getElementById('trace-result');
  if(!el) return;
  if(!kw){
    toast('请输入订单号或应收单号', 'warning');
    el.innerHTML = '';
    return;
  }
  const d = DIFFS.find(x => x.doc === kw || x.id === kw || x.orderNo === kw);
  if(d){
    el.innerHTML = `<div class="card" style="border-color:var(--primary)">
      <div class="card-header">
        <div class="card-title">追溯结果：${kw}</div>
        <span class="tag ${STATUS_TAG[d.status]}">${d.status}</span>
      </div>
      <div class="card-body">
        <div class="flex gap-8" style="margin-bottom:12px;flex-wrap:wrap">
          <span class="tag tag-blue">业务金额 ¥${money(d.bizAmount)}</span>
          <span class="tag tag-cyan">财务金额 ¥${money(d.finAmount)}</span>
          <span class="tag ${d.diff ? 'tag-red' : 'tag-gray'}">差异额 ${d.diff ? '¥' + money(d.diff) : '¥0.00'}</span>
        </div>
        ${chainSteps(d)}
      </div>
    </div>`;
    refreshIcons();
    toast('已追溯该单号的完整财务链路', 'success');
    return;
  }
  const ord = MOCK.orders.find(o => o.id === kw);
  if(ord){
    el.innerHTML = `<div class="card" style="border-color:var(--success)">
      <div class="card-header">
        <div class="card-title">追溯结果：${kw}</div>
        <span class="tag tag-green">对账无差异</span>
      </div>
      <div class="card-body">
        <div class="kv-grid mb-16">
          <div class="kv-item"><div class="k">客户</div><div class="v">${ord.customer}</div></div>
          <div class="kv-item"><div class="k">场馆 / 场地</div><div class="v">${ord.venue} · ${ord.court}</div></div>
          <div class="kv-item"><div class="k">订单金额</div><div class="v">¥${money(ord.amount)}</div></div>
          <div class="kv-item"><div class="k">支付方式</div><div class="v">${ord.payMethod}</div></div>
        </div>
        <div class="timeline" style="margin-bottom:0">
          <div class="timeline-item success"><div class="timeline-title">业务订单 <span class="mono">${ord.id}</span></div><div class="timeline-desc">订单金额 ¥${money(ord.amount)}，状态 ${ord.status}</div></div>
          <div class="timeline-item success"><div class="timeline-title">财务应收单 <span class="mono">AR-${ord.id.slice(-8)}</span></div><div class="timeline-desc">按场馆每日汇总生成应收单</div></div>
          <div class="timeline-item success"><div class="timeline-title">收款单 <span class="mono">RC-${ord.id.slice(-8)}</span></div><div class="timeline-desc">支付渠道 ${ord.payMethod}，金额一致</div></div>
          <div class="timeline-item success"><div class="timeline-title">财务单据号 <span class="mono">NCC-AR-${ord.id.slice(-8)}</span></div><div class="timeline-desc">已入账，本期无对账差异</div></div>
        </div>
      </div>
    </div>`;
    refreshIcons();
    toast('追溯完成，该订单与财务单据一致', 'success');
    return;
  }
  el.innerHTML = `<div class="empty"><div class="empty-icon"><i data-lucide="file-question"></i></div><div class="empty-text">未查询到「${kw}」相关单据，请确认单号后重试</div></div>`;
  refreshIcons();
  toast('未查询到相关单据', 'error');
}

/* ========== 导出 / 页面 ========== */
function exportSheet(){
  toast('对账底稿已导出为 Excel（含差异明细、单据链路与处理记录）', 'success');
}

function renderAll(){
  renderStats();
  renderTable();
  refreshIcons();
}

/* ========== 页面骨架 ========== */
document.getElementById('page-content').innerHTML = `
  <div class="page-header">
    <div class="flex justify-between items-center" style="flex-wrap:wrap;gap:12px">
      <div>
        <div class="page-title">财务对账</div>
        <div class="page-desc">业务系统与用友 NCC 按月对账，按应收金额、收款金额、单据数量、单据状态四维度核对</div>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-default" onclick="renderAll();toast('对账数据已刷新','info')"><i data-lucide="refresh-cw"></i>刷新</button>
        <button class="btn btn-primary" onclick="exportSheet()"><i data-lucide="download"></i>导出对账底稿</button>
      </div>
    </div>
  </div>

  <div class="stats-grid" id="rq-stats"></div>

  <div class="card mb-16">
    <div class="card-body" style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:240px">
        <div class="font-medium mb-8">对账周期</div>
        <select class="form-select" id="rq-period" onchange="resetAndRender()" style="max-width:240px">
          <option value="2026-10">2026-10（当前对账周期）</option>
          <option value="2026-09">2026-09（上一周期）</option>
        </select>
        <div class="form-hint">选择周期后，统计卡与差异明细同步刷新。</div>
      </div>
      <div style="flex:2;min-width:300px">
        <div class="font-medium mb-8">核对维度说明</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
          <div class="list-row" style="padding:8px 0">
            <span class="stat-icon cyan" style="width:32px;height:32px;flex-shrink:0"><i data-lucide="file-text"></i></span>
            <div><div class="font-medium" style="font-size:13px">应收金额</div><div class="text-muted" style="font-size:12px">业务应收 vs 财务应收</div></div>
          </div>
          <div class="list-row" style="padding:8px 0">
            <span class="stat-icon green" style="width:32px;height:32px;flex-shrink:0"><i data-lucide="banknote"></i></span>
            <div><div class="font-medium" style="font-size:13px">收款金额</div><div class="text-muted" style="font-size:12px">流水回单 vs 收款单</div></div>
          </div>
          <div class="list-row" style="padding:8px 0">
            <span class="stat-icon blue" style="width:32px;height:32px;flex-shrink:0"><i data-lucide="layers"></i></span>
            <div><div class="font-medium" style="font-size:13px">单据数量</div><div class="text-muted" style="font-size:12px">应收单 / 收款单张数</div></div>
          </div>
          <div class="list-row" style="padding:8px 0">
            <span class="stat-icon purple" style="width:32px;height:32px;flex-shrink:0"><i data-lucide="list-checks"></i></span>
            <div><div class="font-medium" style="font-size:13px">单据状态</div><div class="text-muted" style="font-size:12px">已推送 / 已入账 / 已审核</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-16">
    <div class="card-header">
      <div class="card-title">差异明细</div>
      <span class="text-muted" id="rq-count" style="font-size:13px"></span>
    </div>
    <div class="card-body">
      <div class="toolbar">
        <select class="form-select" id="rq-type" onchange="resetAndRender()">
          <option value="">全部差异类型</option>
          <option value="金额不符">金额不符</option>
          <option value="单据缺失">单据缺失</option>
          <option value="状态不一致">状态不一致</option>
        </select>
        <select class="form-select" id="rq-status" onchange="resetAndRender()">
          <option value="">全部状态</option>
          <option value="待处理">待处理</option>
          <option value="处理中">处理中</option>
          <option value="已处理">已处理</option>
        </select>
        <input class="form-input" id="rq-kw" placeholder="搜索差异编号 / 单据 / 原因" oninput="resetAndRender()" style="min-width:240px" />
        <div class="spacer"></div>
        <span class="text-muted" style="font-size:12px">差异金额以绝对值汇总</span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>差异编号</th>
              <th>周期</th>
              <th>差异类型</th>
              <th class="text-right">业务金额</th>
              <th class="text-right">财务金额</th>
              <th class="text-right">差异额</th>
              <th>关联单据</th>
              <th>差异原因</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="rq-rows"></tbody>
        </table>
      </div>
      <div class="pagination" id="rq-pager"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">全链路追溯演示</div>
      <span class="tag tag-cyan">业务订单 → 财务单据</span>
    </div>
    <div class="card-body">
      <div class="toolbar" style="margin-bottom:0">
        <div class="input-group" style="max-width:460px;flex:1;min-width:280px">
          <input class="form-input" id="trace-order" placeholder="输入订单号 / 应收单号，如 AR20261030、ORD20261030001" onkeydown="if(event.key==='Enter')traceOrder()" />
          <button class="btn btn-primary" onclick="traceOrder()"><i data-lucide="search"></i>反查</button>
        </div>
        <span class="text-muted" style="font-size:13px">示例：AR20261030、AR20261028、ORD20261030001</span>
      </div>
      <div id="trace-result" class="mt-16"></div>
    </div>
  </div>
`;

renderAll();
</script>
</body>
</html>

/* ========== 统计 ========== */
function renderStats(){
  const confirmed = REVENUE.filter(r => r.status === '已确认');
  const revTotal = confirmed.reduce((s, r) => s + r.amount, 0);
  const receivable = REVENUE.filter(r => r.status !== '已冲销').reduce((s, r) => s + r.receivable, 0);
  const received = REVENUE.reduce((s, r) => s + r.received, 0);
  const preReceived = REVENUE.reduce((s, r) => s + r.preReceived, 0);
  const el = document.getElementById('rev-stats');
  if(!el) return;
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">本期收入 <span class="stat-icon blue"><i data-lucide="trending-up"></i></span></div>
      <div class="stat-value">¥${money(revTotal)}</div>
      <div class="stat-trend up"><i data-lucide="check-circle-2" style="width:14px"></i>已确认口径 · 权责发生制</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">应收金额 <span class="stat-icon cyan"><i data-lucide="file-text"></i></span></div>
      <div class="stat-value">¥${money(receivable)}</div>
      <div class="stat-trend"><i data-lucide="info" style="width:14px;color:var(--text-3)"></i>服务已发生、尚未收款的金额</div>
    </div>

      <div class="stat-label">实收金额 <span class="stat-icon green"><i data-lucide="banknote"></i></span></div>
      <div class="stat-value">¥${money(received)}</div>

    </div>

      <div class="stat-label">预收金额 <span class="stat-icon orange"><i data-lucide="wallet"></i></span></div>
      <div class="stat-value">¥${money(preReceived)}</div>
      <div class="stat-trend down"><i data-lucide="clock-3" style="width:14px"></i>尚未提供服务，计入递延</div>

/* ========== 台账筛选 / 分页 ========== */
function filteredRevenue(){
  const venue = document.getElementById('rev-venue')?.value || '';
  const biz = document.getElementById('rev-biz')?.value || '';
  const st = document.getElementById('rev-status')?.value || '';
  const from = document.getElementById('rev-from')?.value || '';
  const to = document.getElementById('rev-to')?.value || '';
  return REVENUE.filter(r => {
    const d = r.occurTime.slice(0, 10);
    if(venue && r.venue !== venue) return false;
    if(biz && r.bizType !== biz) return false;
    if(st && r.status !== st) return false;
    if(from && d < from) return false;
    if(to && d > to) return false;
    return true;
  });
}
function resetAndRender(){ curPage = 1; renderLedger(); }
function gotoPage(p){ curPage = p; renderLedger(); }

function buildPager(total){
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(curPage > pages) curPage = pages;
  if(curPage < 1) curPage = 1;
  let btns = '';
  for(let i = 1; i <= pages; i++){
    btns += `<button class="page-btn ${i === curPage ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
  }
  const el = document.getElementById('rev-pager');
  if(!el) return;
  el.innerHTML = `
    <div class="pagination-info">共 ${total} 条 · 第 ${curPage}/${pages} 页</div>
    <div class="pagination-pages">
      <button class="page-btn" ${curPage <= 1 ? 'disabled' : ''} onclick="gotoPage(${curPage - 1})"><i data-lucide="chevron-left" style="width:14px"></i></button>
      ${btns}
      <button class="page-btn" ${curPage >= pages ? 'disabled' : ''} onclick="gotoPage(${curPage + 1})"><i data-lucide="chevron-right" style="width:14px"></i></button>
    </div>`;
  refreshIcons();
}

function renderLedger(){
  const list = filteredRevenue();
  const start = (curPage - 1) * PAGE_SIZE;
  const rows = list.slice(start, start + PAGE_SIZE).map(r => {
    const act = r.status === '递延中'
      ? `<button class="btn btn-primary btn-sm" onclick="openConfirmRev('${r.id}')">确认收入</button>`
      : `<button class="btn btn-ghost btn-sm" onclick="toast('该笔收入已确认，无需重复确认','info')">已处理</button>`;
    return `<tr>
      <td class="mono" style="font-size:13px">${r.order}</td>
      <td>${r.venue}</td>
      <td><span class="tag ${BIZ_TAG[r.bizType] || 'tag-gray'}">${r.bizType}</span></td>
      <td style="font-size:13px;white-space:nowrap">${r.occurTime}</td>
      <td class="text-right font-medium">¥${money(r.amount)}</td>
      <td class="text-right ${r.preReceived ? 'text-warning' : 'text-muted'}">${r.preReceived ? '¥' + money(r.preReceived) : '—'}</td>
      <td class="text-right">${r.receivable ? '¥' + money(r.receivable) : '—'}</td>
      <td class="text-right ${r.received ? 'text-success' : 'text-muted'}">${r.received ? '¥' + money(r.received) : '—'}</td>
      <td style="font-size:13px">${r.project}</td>
      <td><span class="tag ${STATUS_TAG[r.status] || 'tag-gray'}">${r.status}</span></td>
      <td>${act}</td>
    </tr>`;
  }).join('');
  const tb = document.getElementById('rev-rows');
  if(tb){
    tb.innerHTML = rows || `<tr><td colspan="11"><div class="empty"><div class="empty-icon"><i data-lucide="file-search"></i></div><div class="empty-text">当前筛选条件下暂无收入记录</div></div></td></tr>`;
  }
  const cnt = document.getElementById('rev-count');
  if(cnt) cnt.textContent = `当前筛选 ${list.length} 条`;
  buildPager(list.length);
  refreshIcons();
}

/* ========== 收入确认 ========== */
function openConfirmRev(id){

  if(!r) return;

    <div class="modal-header">
      <div class="modal-title">确认收入 · ${r.order}</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>

    <div class="modal-body">
      <div class="kv-grid mb-16">
        <div class="kv-item"><div class="k">业务单号</div><div class="v mono">${r.order}</div></div>
        <div class="kv-item"><div class="k">场馆</div><div class="v">${r.venue}</div></div>
        <div class="kv-item"><div class="k">业务类型</div><div class="v">${r.bizType}</div></div>
        <div class="kv-item"><div class="k">发生时间</div><div class="v">${r.occurTime}</div></div>
        <div class="kv-item"><div class="k">金额</div><div class="v font-bold">¥${money(r.amount)}</div></div>
        <div class="kv-item"><div class="k">收支项目</div><div class="v">${r.project}</div></div>
      </div>
      <div class="card" style="background:var(--warning-bg);border-color:var(--warning);margin-bottom:16px">
        <div class="card-body" style="padding:12px 16px;font-size:13px;color:var(--text-2)">
          <i data-lucide="info" style="width:15px;vertical-align:middle;color:var(--warning)"></i>
          确认后该笔预收将结转至收入，确认依据为服务实际发生，不以到账时间为准。
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label class="form-label">确认日期 <span class="required">*</span></label>
          <input class="form-input" type="date" id="cf-date" value="${TODAY}" />
        </div>
        <div class="form-item">
          <label class="form-label">确认金额</label>
          <input class="form-input" value="¥${money(r.amount)}" disabled />
        </div>
      </div>
      <div class="form-item">
        <label class="form-label">确认说明 <span class="required">*</span></label>
        <textarea class="form-textarea" id="cf-note" placeholder="请填写收入确认依据，如：服务已于 10-30 18:00 提供完毕，符合确认条件"></textarea>
      </div>
      <div class="form-hint">确认说明不少于 4 个字，将记录到收入台账与操作日志。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmRevenue('${r.id}')">确认入账</button>
    </div>
  </div>`);
}

function confirmRevenue(id){
  const r = REVENUE.find(x => x.id === id);
  if(!r) return;
  const date = document.getElementById('cf-date')?.value || '';
  const note = (document.getElementById('cf-note')?.value || '').trim();
  if(!date){ toast('请选择确认日期', 'error'); return; }
  if(note.length < 4){ toast('请填写不少于 4 个字的确认说明', 'error'); return; }
  r.status = '已确认';
  r.confirmDate = date;
  r.confirmNote = note;
  closeActiveModal();
  renderAll();
  toast(`收入 ${r.order} 已确认，确认日期 ${date}`, 'success');
}

/* ========== 预收与递延 ========== */
function renderDeferred(){
  const totalDeferred = DEFERRED.reduce((s, d) => s + d.deferred, 0);
  const totalConfirmed = DEFERRED.reduce((s, d) => s + d.confirmed, 0);
  const totalGift = DEFERRED.reduce((s, d) => s + d.gift, 0);
  const stats = document.getElementById('def-stats');
  if(stats){
    stats.innerHTML = `
      <div class="stat-card">
        <div class="stat-label">递延余额合计 <span class="stat-icon orange"><i data-lucide="hourglass"></i></span></div>
        <div class="stat-value">¥${money(totalDeferred)}</div>
        <div class="stat-trend"><i data-lucide="info" style="width:14px;color:var(--text-3)"></i>尚未提供服务，不得确认收入</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已确认递延金额 <span class="stat-icon green"><i data-lucide="check-check"></i></span></div>
        <div class="stat-value">¥${money(totalConfirmed)}</div>
        <div class="stat-trend up"><i data-lucide="trending-up" style="width:14px"></i>按实际消费进度结转</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">赠送金额合计 <span class="stat-icon purple"><i data-lucide="gift"></i></span></div>
        <div class="stat-value">¥${money(totalGift)}</div>
        <div class="stat-trend"><i data-lucide="info" style="width:14px;color:var(--text-3)"></i>随本金按消费比例同步确认</div>
      </div>`;
  }
  const rows = DEFERRED.map(d => {
    const total = d.principal + d.gift;
    const pct = total ? Math.round(d.confirmed / total * 100) : 0;
    return `<tr>
      <td class="mono" style="font-size:13px">${d.order}</td>
      <td>${d.customer}</td>
      <td>${d.venue}</td>
      <td class="text-right">¥${money(d.principal)}</td>
      <td class="text-right text-warning">¥${money(d.gift)}</td>
      <td class="text-right">¥${money(total)}</td>
      <td class="text-right text-success">¥${money(d.confirmed)}</td>
      <td class="text-right font-medium">¥${money(d.deferred)}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="progress" style="width:100px"><div class="progress-bar" style="width:${pct}%"></div></div>
          <span style="font-size:12px;color:var(--text-3)">${pct}%</span>
        </div>
      </td>
      <td style="font-size:13px;white-space:nowrap">${d.lastConfirm}</td>
      <td>${d.deferred > 0
        ? `<button class="btn btn-primary btn-sm" onclick="openConfirmDefer('${d.order}')">确认递延收入</button>`
        : `<span class="tag tag-green">已全额确认</span>`}</td>
    </tr>`;
  }).join('');
  const tb = document.getElementById('def-rows');
  if(tb) tb.innerHTML = rows;
  refreshIcons();
}

function openConfirmDefer(order){
  const d = DEFERRED.find(x => x.order === order);
  if(!d) return;
  activeModal = openModal(`<div class="modal">
    <div class="modal-header">
      <div class="modal-title">确认递延收入 · ${d.order}</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>
    </div>
    <div class="modal-body">
      <div class="kv-grid mb-16">
        <div class="kv-item"><div class="k">客户</div><div class="v">${d.customer}</div></div>
        <div class="kv-item"><div class="k">场馆</div><div class="v">${d.venue}</div></div>
        <div class="kv-item"><div class="k">充值本金</div><div class="v">¥${money(d.principal)}</div></div>
        <div class="kv-item"><div class="k">赠送金额</div><div class="v text-warning">¥${money(d.gift)}</div></div>

          <input class="form-input" type="number" id="df-amount" min="0" step="0.01" placeholder="不超过递延余额 ¥${money(d.deferred)}" />
        </div>

          <label class="form-label">确认日期 <span class="required">*</span></label>

      <div class="form-item">

      <button class="btn btn-primary" onclick="confirmDefer('${d.order}')">确认结转</button>
    </div>
  </div>`);
}

function confirmDefer(order){
  const d = DEFERRED.find(x => x.order === order);
  if(!d) return;
  const amount = Number(document.getElementById('df-amount')?.value || 0);
  const date = document.getElementById('df-date')?.value || '';
  const note = (document.getElementById('df-note')?.value || '').trim();
  if(!(amount > 0)){ toast('请填写大于 0 的确认金额', 'error'); return; }
  if(amount > d.deferred){ toast(`确认金额不能超过递延余额 ¥${money(d.deferred)}`, 'error'); return; }
  if(!date){ toast('请选择确认日期', 'error'); return; }
  if(note.length < 4){ toast('请填写不少于 4 个字的确认依据', 'error'); return; }
  d.confirmed = +(d.confirmed + amount).toFixed(2);
  d.deferred = +(d.deferred - amount).toFixed(2);
  d.lastConfirm = date;
  closeActiveModal();
  renderDeferred();
  toast(`已确认递延收入 ¥${money(amount)}，剩余递延 ¥${money(d.deferred)}`, 'success');
}

/* ========== 跨期处理 ========== */
function runPeriod(key){
  const map = {
    defer: '递延收入结转任务已提交：系统按本期实际服务记录，将对应预收金额结转至「体育服务收入」，结转明细可在收入台账查看。',
    cross: '跨月收入调整已开启：跨月订单按服务发生月份拆分确认，本期仅确认属于本期部分，剩余部分转入下期递延。',
    close: '月末结账已发起：执行 2026-10 期间关账检查（应收 / 实收 / 预收平衡校验），结账完成后该期间数据锁定，不可再修改。'
  };
  toast(map[key] || '操作已完成', key === 'close' ? 'warning' : 'success');
}

/* ========== 退款冲销 ========== */
function renderReversals(){
  const el = document.getElementById('rev-reversal');
  if(!el) return;
  el.innerHTML = REVERSALS.map(rc => `
    <div class="card mb-16">
      <div class="card-header">
        <div>
          <div class="card-title">${rc.order} · ${rc.customer}</div>
          <div class="text-muted" style="font-size:12px;margin-top:4px">${rc.bizType} · 冲销金额 ¥${money(rc.amount)} · 原因：${rc.reason}</div>
        </div>
        <div class="flex gap-8">
          <span class="tag tag-gray">退款单 ${rc.refundNo}</span>
          <span class="tag tag-red">红字业务 ${rc.redNo}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="timeline" style="margin-bottom:0">
          ${rc.steps.map(s => `
            <div class="timeline-item ${s.type}">
              <div class="timeline-time">${s.time}</div>
              <div class="timeline-title">${s.title}</div>
              <div class="timeline-desc">${s.desc}</div>
            </div>`).join('')}
        </div>
      </div>
    </div>`).join('');
  refreshIcons();
}

/* ========== 页签 / 导出 ========== */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = p.dataset.panel === name ? 'block' : 'none');
  refreshIcons();
}

function exportLedger(){
  toast('收入台账已导出为 Excel（含预收/应收/实收及确认状态）', 'success');
}

function renderAll(){
  renderStats();
  renderLedger();
  renderDeferred();
  renderReversals();
  refreshIcons();
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../config.js?v=20261105"></script>
<script src="../auth-gate.js?v=20261105"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红字发票 - 地丰体育</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div id="app-shell"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../mock.js"></script>
<script src="../mock-extra.js"></script>
<script src="../api.js"></script>
<script src="../shell.js"></script>
<script>
window.__PREFIX__ = '../';
renderShell('invoice-red', '红字发票');

/* ========== 工具 ========== */
const PAGE_SIZE = 4;
const TODAY = '2026-11-05';
let curPage = 1;
let activeModal = null;
let redSeq = 0;

function money(n){
  return (Number(n) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }
function closeActiveModal(){
  if(activeModal){ closeModal(activeModal); activeModal = null; }
}
function nowStr(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${TODAY} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function genRedNo(){
  redSeq++;
  return '24350000000' + String(1240000 + redSeq).padStart(7, '0');
}

/* ========== 数据 ========== */
let REDS = MOCK_EXT.redInvoices.map(r => ({
  ...r,
  id: r.id,
  applyTime: r.time,
  handleTime: r.status === '已红冲' ? r.time : '',
  failReason: ''
}));

REDS.push(
  {id:'RD003', originNo:'243500000001234577', order:'ORD20261029003', customer:'散客', amount:200.00, reason:'客户信息有误', applicant:'李运营', applyTime:'2026-11-01 09:12', status:'待红冲', redNo:'', handleTime:'', failReason:''},
  {id:'RD004', originNo:'243500000001234571', order:'ORD20261030002', customer:'林雅婷', amount:60.00, reason:'客户退款', applicant:'王财务', applyTime:'2026-11-02 15:20', status:'红冲失败', redNo:'', handleTime:'', failReason:'原发票状态异常：已作废'},
  {id:'RD005', originNo:'243500000001234572', order:'ORD20261025005', customer:'黄伟', amount:120.00, reason:'服务未履约', applicant:'张前台', applyTime:'2026-11-03 11:05', status:'待红冲', redNo:'', handleTime:'', failReason:''},
  {id:'RD006', originNo:'243500000001234573', order:'ORD20261102003', customer:'陈晓明', amount:800.00, reason:'开票信息错误', applicant:'王财务', applyTime:'2026-11-04 11:30', status:'已红冲', redNo:'243500000001240006', handleTime:'2026-11-04 11:32', failReason:''},
  {id:'RD007', originNo:'243500000001234574', order:'MT202610290001', customer:'散客', amount:158.00, reason:'客户退款', applicant:'张前台', applyTime:'2026-11-05 09:40', status:'待红冲', redNo:'', handleTime:'', failReason:''},
  {id:'RD008', originNo:'243500000001234578', order:'EV001', customer:'厦门市篮球协会', amount:28500.00, reason:'服务未履约', applicant:'李运营', applyTime:'2026-11-05 10:10', status:'红冲失败', redNo:'', handleTime:'', failReason:'税务端重复申请'},
  {id:'RD009', originNo:'243500000001234576', order:'ORD20261029004', customer:'厦门建工集团有限公司', amount:400.00, reason:'开票信息错误', applicant:'王财务', applyTime:'2026-11-05 11:00', status:'已红冲', redNo:'243500000001240010', handleTime:'2026-11-05 11:05', failReason:''}
);

const STATUS_TAG = {
  '待红冲':'tag-orange',
  '已红冲':'tag-green',
  '红冲失败':'tag-red'
};
const REASONS = ['开票信息错误', '赛事取消', '客户退款', '服务未履约', '其他'];

/* ========== 统计 ========== */
function renderStats(){
  const pending = REDS.filter(r => r.status === '待红冲').length;
  const done = REDS.filter(r => r.status === '已红冲');
  const amount = done.reduce((s, r) => s + r.amount, 0);
  const el = document.getElementById('red-stats');
  if(!el) return;
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">待红冲 <span class="stat-icon orange"><i data-lucide="clock-3"></i></span></div>
      <div class="stat-value">${pending}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 张</span></div>
      <div class="stat-trend down"><i data-lucide="alert-triangle" style="width:14px"></i>另有 ${REDS.filter(r => r.status === '红冲失败').length} 张红冲失败待重试</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">已红冲 <span class="stat-icon green"><i data-lucide="file-check-2"></i></span></div>
      <div class="stat-value">${done.length}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 张</span></div>
      <div class="stat-trend up"><i data-lucide="check-circle-2" style="width:14px"></i>红字发票已开具成功</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">红冲金额 <span class="stat-icon red"><i data-lucide="circle-dollar-sign"></i></span></div>
      <div class="stat-value">¥${money(amount)}</div>
      <div class="stat-trend"><i data-lucide="info" style="width:14px;color:var(--text-3)"></i>已红冲发票金额合计</div>
    </div>`;
  refreshIcons();
}

/* ========== 待红冲清单 ========== */
function pendingList(){
  const st = document.getElementById('red-status')?.value || '';
  const kw = (document.getElementById('red-kw')?.value || '').trim();
  return REDS.filter(r => {
    if(r.status === '已红冲') return false;
    if(st && r.status !== st) return false;
    if(kw && !(r.originNo.includes(kw) || r.order.includes(kw) || r.customer.includes(kw))) return false;
    return true;
  });
}
function resetAndRender(){ curPage = 1; renderPending(); }
function gotoPage(p){ curPage = p; renderPending(); }

function buildPager(total){
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(curPage > pages) curPage = pages;
  if(curPage < 1) curPage = 1;
  let btns = '';
  for(let i = 1; i <= pages; i++){
    btns += `<button class="page-btn ${i === curPage ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
  }
  const el = document.getElementById('red-pager');
  if(!el) return;
  el.innerHTML = `
    <div class="pagination-info">共 ${total} 张 · 第 ${curPage}/${pages} 页</div>
    <div class="pagination-pages">
      <button class="page-btn" ${curPage <= 1 ? 'disabled' : ''} onclick="gotoPage(${curPage - 1})"><i data-lucide="chevron-left" style="width:14px"></i></button>
      ${btns}
      <button class="page-btn" ${curPage >= pages ? 'disabled' : ''} onclick="gotoPage(${curPage + 1})"><i data-lucide="chevron-right" style="width:14px"></i></button>
    </div>`;
  refreshIcons();
}

function renderPending(){
  const list = pendingList();
  const start = (curPage - 1) * PAGE_SIZE;
  const rows = list.slice(start, start + PAGE_SIZE).map(r => `
    <tr>
      <td class="mono" style="font-size:12px">${r.originNo}</td>
      <td class="mono" style="font-size:12px">${r.order}</td>
      <td>${r.customer}</td>
      <td class="text-right font-medium">¥${money(r.amount)}</td>
      <td style="font-size:13px">${r.reason}${r.failReason ? `<div class="text-error" style="font-size:12px">${r.failReason}</div>` : ''}</td>
      <td>${r.applicant}</td>
      <td style="font-size:13px;white-space:nowrap">${r.applyTime}</td>
      <td><span class="tag ${STATUS_TAG[r.status] || 'tag-gray'}">${r.status}</span></td>
      <td>
        <button class="btn ${r.status === '红冲失败' ? 'btn-warning' : 'btn-primary'} btn-sm" onclick="openRed('${r.id}')">
          ${r.status === '红冲失败' ? '重试红冲' : '发起红冲'}
        </button>
      </td>
    </tr>`).join('');
  const tb = document.getElementById('red-rows');
  if(tb){
    tb.innerHTML = rows || `<tr><td colspan="9"><div class="empty"><div class="empty-icon"><i data-lucide="file-check-2"></i></div><div class="empty-text">当前筛选条件下暂无待红冲申请</div></div></td></tr>`;
  }
  const cnt = document.getElementById('red-count');
  if(cnt) cnt.textContent = `当前筛选 ${list.length} 张`;
  buildPager(list.length);
  refreshIcons();
}

/* ========== 红冲记录 ========== */
function renderRecords(){
  const list = REDS.filter(r => r.status === '已红冲');
  const rows = list.map(r => `
    <tr>
      <td class="mono" style="font-size:12px">${r.originNo}</td>
      <td class="mono" style="font-size:12px">${r.redNo}</td>
      <td class="text-right font-medium">¥${money(r.amount)}</td>
      <td style="font-size:13px">${r.reason}</td>
      <td>${r.applicant}</td>
      <td style="font-size:13px;white-space:nowrap">${r.handleTime}</td>
      <td><span class="tag tag-green">已红冲</span></td>
    </tr>`).join('');
  const tb = document.getElementById('red-rec-rows');
  if(tb){
    tb.innerHTML = rows || `<tr><td colspan="7"><div class="empty"><div class="empty-icon"><i data-lucide="inbox"></i></div><div class="empty-text">暂无红冲记录</div></div></td></tr>`;
  }
  const cnt = document.getElementById('red-rec-count');
  if(cnt) cnt.textContent = `共 ${list.length} 条`;
  refreshIcons();
}

/* ========== 发起红冲 ========== */
function openRed(id){
  const r = REDS.find(x => x.id === id);
  if(!r) return;
  if(r.status === '已红冲'){ toast('该申请已完成红冲', 'info'); return; }
  const selectedReason = REASONS.indexOf(r.reason) > -1 ? r.reason : '';
  activeModal = openModal(`<div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">${r.status === '红冲失败' ? '重试红冲' : '发起红冲'} · ${r.id}</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>
    </div>
    <div class="modal-body">
      <div class="kv-grid mb-16">
        <div class="kv-item"><div class="k">原发票号码</div><div class="v mono">${r.originNo}</div></div>
        <div class="kv-item"><div class="k">关联订单</div><div class="v mono">${r.order}</div></div>
        <div class="kv-item"><div class="k">客户 / 购买方</div><div class="v">${r.customer}</div></div>
        <div class="kv-item"><div class="k">原发票金额</div><div class="v font-bold">¥${money(r.amount)}</div></div>
        <div class="kv-item"><div class="k">申请人</div><div class="v">${r.applicant}</div></div>
        <div class="kv-item"><div class="k">申请时间</div><div class="v">${r.applyTime}</div></div>
      </div>
      <div class="card" style="background:var(--warning-bg);border-color:var(--warning);margin-bottom:16px">
        <div class="card-body" style="padding:12px 16px;font-size:13px;color:var(--text-2)">
          <b>红冲规则：</b>本期仅支持整单全额红冲，不支持部分红冲；红冲后原发票置为「已红冲」，如需重新开票须按新订单重新发起。
        </div>
      </div>
      ${r.failReason ? `<div class="card" style="background:var(--error-bg);border-color:var(--error);margin-bottom:16px"><div class="card-body" style="padding:12px 16px;font-size:13px;color:var(--text-2)"><b class="text-error">上次失败原因：</b>${r.failReason}</div></div>` : ''}
      <div class="form-row">
        <div class="form-item">
          <label class="form-label">红冲原因 <span class="required">*</span></label>
          <select class="form-select" id="red-reason">
            <option value="">请选择红冲原因</option>
            ${REASONS.map(x => `<option value="${x}" ${x === selectedReason ? 'selected' : ''}>${x}</option>`).join('')}
          </select>
        </div>
        <div class="form-item">
          <label class="form-label">红冲发票号</label>
          <input class="form-input" value="提交后由税务系统生成" disabled />
        </div>
      </div>
      <div class="form-item">
        <label class="form-label">详细说明 <span class="required">*</span></label>
        <textarea class="form-textarea" id="red-note" placeholder="请说明红冲原因与业务依据，不少于 4 个字"></textarea>
      </div>
      <div class="form-hint">红冲一律由后台发起，客户端不提供红冲入口；红冲成功后系统自动通知客户。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">取消</button>
      <button class="btn btn-danger" onclick="submitRed('${r.id}')">确认发起红冲</button>
    </div>
  </div>`);
}

function submitRed(id){
  const r = REDS.find(x => x.id === id);
  if(!r) return;
  const reason = document.getElementById('red-reason')?.value || '';
  const note = (document.getElementById('red-note')?.value || '').trim();
  if(!reason){ toast('请选择红冲原因', 'error'); return; }
  if(note.length < 4){ toast('请填写不少于 4 个字的详细说明', 'error'); return; }
  r.reason = reason;
  r.note = note;
  r.status = '已红冲';
  r.redNo = genRedNo();
  r.handleTime = nowStr();
  r.failReason = '';
  closeActiveModal();
  renderAll();
  toast(`红冲成功，红字发票号 ${r.redNo}；原发票 ${r.originNo} 已置为已红冲`, 'success');
}

/* ========== 页面 ========== */
function exportRed(){
  toast('红冲台账已导出为 Excel（含待红冲、红冲记录与失败明细）', 'success');
}

function renderAll(){
  renderStats();
  renderPending();
  renderRecords();
  refreshIcons();
}

/* ========== 页面骨架 ========== */
document.getElementById('page-content').innerHTML = `
  <div class="page-header">
    <div class="flex justify-between items-center" style="flex-wrap:wrap;gap:12px">
      <div>
        <div class="page-title">红字发票</div>
        <div class="page-desc">后台发起红冲申请，整单全额红冲，红冲后原发票置为已红冲并支持重开</div>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-default" onclick="renderAll();toast('红冲数据已刷新','info')"><i data-lucide="refresh-cw"></i>刷新</button>
        <button class="btn btn-primary" onclick="exportRed()"><i data-lucide="download"></i>导出台账</button>
      </div>
    </div>
  </div>

  <div class="stats-grid" id="red-stats"></div>

  <div class="card mb-16">
    <div class="card-header">
      <div class="card-title">待红冲清单</div>
      <span class="text-muted" id="red-count" style="font-size:13px"></span>
    </div>
    <div class="card-body">
      <div class="toolbar">
        <select class="form-select" id="red-status" onchange="resetAndRender()">
          <option value="">全部待处理状态</option>
          <option value="待红冲">待红冲</option>
          <option value="红冲失败">红冲失败</option>
        </select>
        <input class="form-input" id="red-kw" placeholder="搜索原发票号 / 订单 / 客户" oninput="resetAndRender()" style="min-width:240px" />
        <div class="spacer"></div>
        <span class="text-muted" style="font-size:12px">红冲失败项可重试，原因需重新确认</span>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>原发票号码</th>
              <th>关联订单</th>
              <th>客户</th>
              <th class="text-right">原发票金额</th>
              <th>红冲原因</th>
              <th>申请人</th>
              <th>申请时间</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="red-rows"></tbody>
        </table>
      </div>
      <div class="pagination" id="red-pager"></div>
    </div>
  </div>

  <div class="card mb-16">
    <div class="card-header">
      <div class="card-title">红冲记录</div>
      <span class="text-muted" id="red-rec-count" style="font-size:13px"></span>
    </div>
    <div class="card-body no-pad">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>原发票号</th>
              <th>红冲发票号</th>
              <th class="text-right">红冲金额</th>
              <th>原因</th>
              <th>申请人</th>
              <th>处理时间</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="red-rec-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">红冲规则说明</div>
      <span class="tag tag-gray">税务合规</span>
    </div>
    <div class="card-body">
      <div class="list-row">
        <span class="stat-icon red" style="width:32px;height:32px;flex-shrink:0"><i data-lucide="lock"></i></span>
        <div>
          <div class="font-medium">红冲一律后台发起</div>
          <div class="text-muted" style="font-size:13px">客户端与小程序不提供红冲入口，所有红冲申请必须由财务或运营在后台发起，并记录申请人与原因。</div>
        </div>
      </div>
      <div class="list-row">
        <span class="stat-icon orange" style="width:32px;height:32px;flex-shrink:0"><i data-lucide="ban"></i></span>
        <div>
          <div class="font-medium">本期整单全额红冲</div>
          <div class="text-muted" style="font-size:13px">仅支持整单全额红冲，不支持部分红冲；红冲金额必须与原发票金额一致，不允许手工修改。</div>
        </div>
      </div>
      <div class="list-row">
        <span class="stat-icon blue" style="width:32px;height:32px;flex-shrink:0"><i data-lucide="layers"></i></span>
        <div>
          <div class="font-medium">一单多票逐张全额红冲</div>
          <div class="text-muted" style="font-size:13px">同一订单开具多张发票时，按发票逐张发起红冲，不能合并红冲，避免红字发票与原蓝票金额对应关系混乱。</div>
        </div>
      </div>
      <div class="list-row">
        <span class="stat-icon green" style="width:32px;height:32px;flex-shrink:0"><i data-lucide="file-plus-2"></i></span>
        <div>
          <div class="font-medium">红冲后原发票置为已红冲可重开</div>
          <div class="text-muted" style="font-size:13px">红冲成功后原发票状态变为「已红冲」，如需重新开票，按新订单重新发起开票，生成新的发票号码。</div>
        </div>
      </div>
    </div>
  </div>
`;

renderAll();
</script>
</body>
</html>

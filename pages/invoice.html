function money(n){
  return (Number(n) || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function refreshIcons(){ if(window.lucide) lucide.createIcons(); }
function closeActiveModal(){
  if(activeModal){ closeModal(activeModal); activeModal = null; }
}
function nowStr(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${TODAY} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function validEmail(v){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v); }

/* ========== 统计 ========== */
function renderStats(){
  const success = INVOICES.filter(r => r.status === '开具成功');
  const amount = success.reduce((s, r) => s + r.amount, 0);
  const failed = INVOICES.filter(r => r.status === '开具失败').length;

  const el = document.getElementById('inv-stats');
  if(!el) return;
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">本月开票金额 <span class="stat-icon blue"><i data-lucide="file-invoice"></i></span></div>
      <div class="stat-value">¥${money(amount)}</div>
      <div class="stat-trend up"><i data-lucide="check-circle-2" style="width:14px"></i>开具成功口径</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">开票张数 <span class="stat-icon green"><i data-lucide="files"></i></span></div>
      <div class="stat-value">${success.length}<span style="font-size:14px;font-weight:400;color:var(--text-3)"> 张</span></div>

    </div>

/* ========== 发票列表 ========== */
function filteredInvoices(){
  const st = document.getElementById('inv-status')?.value || '';
  const type = document.getElementById('inv-type')?.value || '';
  const venue = document.getElementById('inv-venue')?.value || '';
  const kw = (document.getElementById('inv-kw')?.value || '').trim();
  return INVOICES.filter(r => {
    if(st && r.status !== st) return false;
    if(type && r.type !== type) return false;
    if(venue && r.venue !== venue) return false;
    if(kw && !(r.no.includes(kw) || r.order.includes(kw) || r.customer.includes(kw))) return false;
    return true;
  });
}
function resetAndRender(){ curPage = 1; renderTable(); }
function gotoPage(p){ curPage = p; renderTable(); }

function buildPager(total){
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(curPage > pages) curPage = pages;
  if(curPage < 1) curPage = 1;
  let btns = '';
  for(let i = 1; i <= pages; i++){
    btns += `<button class="page-btn ${i === curPage ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
  }
  const el = document.getElementById('inv-pager');
  if(!el) return;
  el.innerHTML = `
    <div class="pagination-info">共 ${total} 张 · 第 ${curPage}/${pages} 页</div>
    <div class="pagination-pages">
      <button class="page-btn" ${curPage <= 1 ? 'disabled' : ''} onclick="gotoPage(${curPage - 1})"><i data-lucide="chevron-left" style="width:14px"></i></button>
      ${btns}
      <button class="page-btn" ${curPage >= pages ? 'disabled' : ''} onclick="gotoPage(${curPage + 1})"><i data-lucide="chevron-right" style="width:14px"></i></button>
    </div>`;
  refreshIcons();
}

function renderTable(){
  const list = filteredInvoices();
  const start = (curPage - 1) * PAGE_SIZE;
  const rows = list.slice(start, start + PAGE_SIZE).map(r => {
    const acts = [`<button class="btn btn-ghost btn-sm" onclick="viewInvoice('${r.id}')">查看发票</button>`];
    if(r.status === '开具失败') acts.push(`<button class="btn btn-warning btn-sm" onclick="openReissue('${r.id}')">重新发起</button>`);
    if(r.status === '开具成功'){
      acts.push(`<button class="btn btn-default btn-sm" onclick="resendEmail('${r.id}')">重新推送邮箱</button>`);
      acts.push(`<button class="btn btn-default btn-sm" onclick="downloadPDF('${r.id}')">重新下载</button>`);
    }
    if(r.status === '已红冲') acts.push(`<button class="btn btn-default btn-sm" onclick="toast('该发票已红冲，可在红字发票模块查看冲销记录','info')">查看红冲</button>`);
    return `<tr>
      <td class="mono" style="font-size:12px">${r.code}</td>
      <td class="mono" style="font-size:12px">${r.no || '<span class="text-muted">待生成</span>'}</td>
      <td class="mono" style="font-size:12px">${r.order}</td>
      <td>${r.customer}</td>
      <td><span class="tag ${TYPE_TAG[r.type] || 'tag-gray'}">${r.type}</span></td>
      <td class="text-right font-medium">¥${money(r.amount)}</td>
      <td class="text-right text-muted">¥${money(r.tax)}</td>
      <td><span class="tag ${STATUS_TAG[r.status] || 'tag-gray'}">${r.status}</span></td>
      <td>${r.venue}</td>
      <td style="font-size:13px;white-space:nowrap">${r.date}</td>
      <td class="actions" style="flex-wrap:wrap">${acts.join('')}</td>
    </tr>`;
  }).join('');
  const tb = document.getElementById('inv-rows');
  if(tb){
    tb.innerHTML = rows || `<tr><td colspan="11"><div class="empty"><div class="empty-icon"><i data-lucide="file-invoice"></i></div><div class="empty-text">当前筛选条件下暂无发票</div></div></td></tr>`;
  }
  const cnt = document.getElementById('inv-count');
  if(cnt) cnt.textContent = `当前筛选 ${list.length} 张`;
  buildPager(list.length);
  refreshIcons();
}

/* ========== 发票详情 / 下载 / 推送 ========== */

              <div class="text-muted" style="font-size:12px">开票主体：${(CONFIGS.find(c => c.venue === r.venue) || {}).subject || '厦门地丰置业有限公司'}</div>

            <div class="kv-item"><div class="k">关联订单</div><div class="v mono">${r.order}</div></div>
            <div class="kv-item"><div class="k">购买方</div><div class="v">${r.customer}</div></div>
            <div class="kv-item"><div class="k">发票项目</div><div class="v">${r.item}</div></div>
            <div class="kv-item"><div class="k">价税合计</div><div class="v font-bold">¥${money(r.amount)}</div></div>
            <div class="kv-item"><div class="k">税额</div><div class="v">¥${money(r.tax)}</div></div>
            <div class="kv-item"><div class="k">开票时间</div><div class="v">${r.date}</div></div>
            <div class="kv-item"><div class="k">所属场馆</div><div class="v">${r.venue}</div></div>
            <div class="kv-item"><div class="k">购方邮箱</div><div class="v">${r.email || '—'}</div></div>
            <div class="kv-item"><div class="k">购方税号</div><div class="v mono">${r.buyerTaxNo || '—'}</div></div>
            <div class="kv-item"><div class="k">发票状态</div><div class="v"><span class="tag ${STATUS_TAG[r.status]}">${r.status}</span></div></div>
          </div>
          ${r.failReason ? `<div class="mt-12"><span class="tag tag-red">失败原因：${r.failReason}</span></div>` : ''}
        </div>
      </div>
      <div class="form-hint mt-12">电子发票与纸质发票具有同等法律效力，可凭发票号码在税务平台查验。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">关闭</button>
      ${r.email ? `<button class="btn btn-default" onclick="resendEmail('${r.id}')">重新推送邮箱</button>` : ''}
      <button class="btn btn-primary" onclick="downloadPDF('${r.id}')"><i data-lucide="download"></i>下载PDF</button>
    </div>
  </div>`);
}

function downloadPDF(id){
  const r = INVOICES.find(x => x.id === id);
  if(!r) return;
  if(!r.no){ toast('发票尚未开具成功，暂无可下载的 PDF', 'warning'); return; }
  toast(`发票 ${r.no} 的 PDF 已开始下载`, 'success');
}

function resendEmail(id){
  const r = INVOICES.find(x => x.id === id);
  if(!r) return;
  if(!r.email){ toast('该发票暂无购方邮箱，请先补充开票信息', 'warning'); return; }
  toast(`发票 ${r.no || r.order} 已重新推送至 ${r.email}`, 'success');
}

/* ========== 重新发起开票 ========== */
function openReissue(id){
  const r = INVOICES.find(x => x.id === id);
  if(!r) return;
  if(r.status !== '开具失败'){ toast('仅开具失败的发票可重新发起', 'warning'); return; }
  activeModal = openModal(`<div class="modal">
    <div class="modal-header">
      <div class="modal-title">重新发起开票 · ${r.order}</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>
    </div>
    <div class="modal-body">
      <div class="card" style="background:var(--error-bg);border-color:var(--error);margin-bottom:16px">
        <div class="card-body" style="padding:12px 16px;font-size:13px;color:var(--text-2)">
          <b class="text-error">失败原因：</b>${r.failReason || '接口返回异常'}
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label class="form-label">发票项目 <span class="required">*</span></label>
          <select class="form-select" id="re-item">
            ${ITEMS.map(i => `<option value="${i.name}" ${i.name === r.item ? 'selected' : ''}>${i.name}（税率 ${i.taxRate}%）</option>`).join('')}
          </select>
        </div>
        <div class="form-item">
          <label class="form-label">金额 <span class="required">*</span></label>
          <input class="form-input" type="number" id="re-amount" step="0.01" min="0" value="${r.amount.toFixed(2)}" />
        </div>
      </div>
      <div class="form-item">
        <label class="form-label">购方邮箱 <span class="required">*</span></label>
        <input class="form-input" id="re-email" value="${r.email || ''}" placeholder="请输入接收电子发票的邮箱" />
      </div>
      <div class="form-item">
        <label class="form-label">重发说明</label>
        <textarea class="form-textarea" id="re-note" placeholder="可填写购方信息修正情况"></textarea>
      </div>
      <div class="form-hint">重新发起后将生成新的开票申请，原失败记录保留可查。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">取消</button>
      <button class="btn btn-primary" onclick="submitReissue('${r.id}')">提交申请</button>
    </div>
  </div>`);
}

function submitReissue(id){
  const r = INVOICES.find(x => x.id === id);
  if(!r) return;
  const item = document.getElementById('re-item')?.value || '';
  const amount = Number(document.getElementById('re-amount')?.value || 0);
  const email = (document.getElementById('re-email')?.value || '').trim();
  if(!item){ toast('请选择发票项目', 'error'); return; }
  if(!(amount > 0)){ toast('请输入大于 0 的开票金额', 'error'); return; }
  if(amount > r.amount){ toast(`开票金额不能超过原订单金额 ¥${money(r.amount)}`, 'error'); return; }
  if(!validEmail(email)){ toast('请输入正确的购方邮箱', 'error'); return; }
  r.item = item;
  r.amount = amount;
  r.email = email;
  r.status = '申请中';
  r.failReason = '';
  r.date = nowStr();
  closeActiveModal();
  renderAll();
  toast(`发票申请已重新发起，金额 ¥${money(amount)}`, 'success');
}

        <textarea class="form-textarea" id="manual-note" placeholder="可填写开票特殊说明"></textarea>

      <div class="form-hint">开票金额不得超过已收款金额；储值与次卡在收款时已开票，订单用余额/次卡抵扣部分不再开票。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">取消</button>
      <button class="btn btn-primary" onclick="submitManualInvoice()">提交开票</button>
    </div>
  </div>`);
}

function onManualOrderChange(){
  const sel = document.getElementById('manual-order');
  const opt = sel && sel.selectedOptions[0];
  const amount = opt ? Number(opt.dataset.amount || 0) : 0;
  const paid = document.getElementById('manual-paid');
  if(paid) paid.value = amount ? '¥' + money(amount) : '—';
  const amountInput = document.getElementById('manual-amount');
  if(amountInput && amount) amountInput.value = amount.toFixed(2);
}

function submitManualInvoice(){
  const orderId = document.getElementById('manual-order')?.value || '';
  const item = document.getElementById('manual-item')?.value || '';
  const type = document.getElementById('manual-type')?.value || '';
  const amount = Number(document.getElementById('manual-amount')?.value || 0);
  const email = (document.getElementById('manual-email')?.value || '').trim();
  if(!orderId){ toast('请选择需要开票的订单', 'error'); return; }
  if(!item){ toast('请选择发票项目', 'error'); return; }
  if(!(amount > 0)){ toast('请输入大于 0 的开票金额', 'error'); return; }
  const order = MOCK.orders.find(o => o.id === orderId);
  if(!order){ toast('订单不存在', 'error'); return; }
  if(amount > order.amount){ toast(`开票金额不能超过已收款金额 ¥${money(order.amount)}`, 'error'); return; }
  if(email && !validEmail(email)){ toast('请输入正确的购方邮箱', 'error'); return; }
  const itemObj = ITEMS.find(i => i.name === item);
  const rate = itemObj ? itemObj.taxRate : 6;
  const tax = +(amount / (1 + rate / 100) * rate / 100).toFixed(2);
  const newId = 'INV' + String(INVOICES.length + 1).padStart(3, '0');
  INVOICES.unshift({
    id:newId, code:'350022113144', no:'', order:order.id, customer:order.customer,
    type:type, amount:amount, tax:tax, status:'申请中', venue:order.venue,
    date:nowStr(), email:email, item:item, buyerTaxNo:'',
    failReason:'', manual:true
  });
  closeActiveModal();
  curPage = 1;
  renderAll();
  toast(`手工开票申请已提交，金额 ¥${money(amount)}`, 'success');
}

          <input class="form-input" id="cfg-taxno" value="${c.taxNo}" />

      </div>

          <input class="form-input" id="cfg-account" value="${c.account}" />

      <button class="btn btn-primary" onclick="saveConfig(${idx})">保存</button>
    </div>
  </div>`);
}

function saveConfig(idx){
  const c = CONFIGS[idx];
  if(!c) return;
  const subject = (document.getElementById('cfg-subject')?.value || '').trim();
  const taxNo = (document.getElementById('cfg-taxno')?.value || '').trim();
  const address = (document.getElementById('cfg-address')?.value || '').trim();
  const bank = (document.getElementById('cfg-bank')?.value || '').trim();
  const account = (document.getElementById('cfg-account')?.value || '').trim();
  const drawer = (document.getElementById('cfg-drawer')?.value || '').trim();
  if(!subject){ toast('请填写开票主体名称', 'error'); return; }
  if(!taxNo){ toast('请填写纳税人识别号', 'error'); return; }
  if(!address){ toast('请填写地址电话', 'error'); return; }
  if(!bank){ toast('请填写开户行', 'error'); return; }
  if(!account){ toast('请填写开户账号', 'error'); return; }
  if(!drawer){ toast('请填写开票人', 'error'); return; }
  c.subject = subject;
  c.taxNo = taxNo;
  c.address = address;
  c.bank = bank;
  c.account = account;
  c.drawer = drawer;
  closeActiveModal();
  renderConfigs();
  toast(`${c.venue} 开票配置已保存`, 'success');
}

function openItem(idx){

  const i = isNew ? {id:'', name:'', taxCode:'', taxRate:6, included:false, type:'服务类'} : ITEMS[idx];
  if(!i) return;
  activeModal = openModal(`<div class="modal">
    <div class="modal-header">
      <div class="modal-title">${isNew ? '新增发票项目' : '编辑发票项目'}</div>
      <div class="modal-close" onclick="closeActiveModal()">×</div>
    </div>
    <div class="modal-body">
      <div class="form-item">
        <label class="form-label">项目名称 <span class="required">*</span></label>
        <input class="form-input" id="item-name" value="${i.name}" placeholder="如 体育场馆服务费" />
      </div>
      <div class="form-item">
        <label class="form-label">税收分类编码 <span class="required">*</span></label>
        <input class="form-input" id="item-code" value="${i.taxCode}" placeholder="19 位税收分类编码" />
      </div>
      <div class="form-row">
        <div class="form-item">
          <label class="form-label">税率 <span class="required">*</span></label>
          <select class="form-select" id="item-rate">
            ${[6, 13, 9, 3, 0].map(r => `<option value="${r}" ${i.taxRate === r ? 'selected' : ''}>${r}%</option>`).join('')}
          </select>
        </div>
        <div class="form-item">
          <label class="form-label">是否含税 <span class="required">*</span></label>
          <select class="form-select" id="item-included">
            <option value="false" ${i.included ? '' : 'selected'}>不含税</option>
            <option value="true" ${i.included ? 'selected' : ''}>含税</option>
          </select>
        </div>
        <div class="form-item">
          <label class="form-label">类型 <span class="required">*</span></label>
          <select class="form-select" id="item-type">
            <option value="服务类" ${i.type === '服务类' ? 'selected' : ''}>服务类</option>
            <option value="商品类" ${i.type === '商品类' ? 'selected' : ''}>商品类</option>
          </select>
        </div>
      </div>
      <div class="form-hint">发票项目与税率变更后仅影响新开票申请，历史发票不受影响。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeActiveModal()">取消</button>
      <button class="btn btn-primary" onclick="saveItem(${idx})">保存</button>
    </div>
  </div>`);
}

function saveItem(idx){
  const name = (document.getElementById('item-name')?.value || '').trim();
  const code = (document.getElementById('item-code')?.value || '').trim();
  const rate = Number(document.getElementById('item-rate')?.value || 0);
  const included = (document.getElementById('item-included')?.value || 'false') === 'true';
  const type = document.getElementById('item-type')?.value || '服务类';
  if(!name){ toast('请填写项目名称', 'error'); return; }
  if(!code){ toast('请填写税收分类编码', 'error'); return; }
  if(idx < 0){
    ITEMS.push({id:'II' + String(ITEMS.length + 1).padStart(2, '0'), name:name, taxCode:code, taxRate:rate, included:included, type:type});
    toast('发票项目已新增', 'success');
  } else {
    const i = ITEMS[idx];
    i.name = name;
    i.taxCode = code;
    i.taxRate = rate;
    i.included = included;
    i.type = type;
    toast('发票项目已更新', 'success');
  }
  closeActiveModal();
  renderItems();
}

}

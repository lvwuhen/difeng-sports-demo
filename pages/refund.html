<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="../config.js?v=20261105"></script>
<script src="../auth-gate.js?v=20261105"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取消与退款 - 地丰体育</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div id="app-shell"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../mock.js"></script>
<script src="../api.js"></script>
<script src="../shell.js"></script>
<script>
window.__PREFIX__ = '../';
renderShell('refund', '取消与退款');

// 退款单 mock
const refunds = [
  {id:'RF20261030001', order:'ORD20261027006', customer:'王志强', phone:'136****3456', amount:80, payMethod:'在线支付', refundMethod:'原路退回（微信）', reason:'客户临时有事', status:'已退款', approver:'张前台', time:'2026-10-30 16:40'},
  {id:'RF20261030002', order:'ORD20261028005', customer:'鹭岛篮球俱乐部', phone:'137****9012', amount:240, payMethod:'次卡', refundMethod:'次卡退回（+1次）', reason:'场地维修无法使用', status:'审批中', approver:'待李运营审批', time:'2026-10-30 15:20'},
  {id:'RF20261029003', order:'ORD20261029010', customer:'林雅婷', phone:'139****5678', amount:120, payMethod:'储值余额', refundMethod:'退回储值余额', reason:'重复下单', status:'已退款', approver:'王财务', time:'2026-10-29 11:05'},
  {id:'RF20261028004', order:'ORD20261028012', customer:'散客', phone:'-', amount:60, payMethod:'现金', refundMethod:'现金退还', reason:'天气原因取消', status:'已拒绝', approver:'张前台', time:'2026-10-28 19:30'},
  {id:'RF20261027005', order:'ORD20261027008', customer:'陈晓明', phone:'138****1234', amount:320, payMethod:'在线支付', refundMethod:'原路退回（支付宝）', reason:'赛事改期', status:'审批中', approver:'待王财务审批', time:'2026-10-27 14:15'},
];

const statusTagMap = {'已退款':'tag-green','审批中':'tag-orange','已拒绝':'tag-red','待审批':'tag-blue'};
const refundMethodTag = {
  '原路退回（微信）':'tag-green','原路退回（支付宝）':'tag-green','退回储值余额':'tag-blue',
  '次卡退回（+1次）':'tag-purple','现金退还':'tag-orange'
};

let curPage = 1, pageSize = 10;

function getFiltered(){
  const st = document.getElementById('rfStatus')?.value||'';
  const kw = (document.getElementById('rfKw')?.value||'').trim();
  return refunds.filter(r=>(!st||r.status===st)&&(!kw||r.customer.includes(kw)||r.order.includes(kw)||r.id.includes(kw)));
}

function renderRefunds(){
  const list = getFiltered();
  const total = list.length;
  const start = (curPage-1)*pageSize;
  const rows = list.slice(start,start+pageSize).map(r=>`
    <tr>
      <td class="mono" style="font-size:13px">${r.id}</td>
      <td class="mono" style="font-size:12px;color:var(--text-3)">${r.order}</td>
      <td><div class="font-medium">${r.customer}</div><div class="text-muted" style="font-size:12px">${r.phone}</div></td>
      <td class="font-medium">¥${r.amount}</td>
      <td style="font-size:13px">${r.payMethod}</td>
      <td style="font-size:13px">${r.refundMethod}</td>
      <td style="font-size:13px">${r.reason}</td>
      <td><span class="tag ${statusTagMap[r.status]||'tag-gray'}">${r.status}</span></td>
      <td style="font-size:13px">${r.approver}</td>
      <td class="actions">
        <button class="btn btn-ghost btn-sm" onclick="viewRefund('${r.id}')">详情</button>
        ${r.status==='审批中'?`<button class="btn btn-ghost btn-sm" onclick="approveRefund('${r.id}')">审批</button>`:''}
      </td>
    </tr>`).join('') || `<tr><td colspan="10"><div class="empty"><div class="empty-icon"><i data-lucide="inbox"></i></div><div class="empty-text">暂无退款单</div></div></td></tr>`;
  document.getElementById('refundTbody').innerHTML = rows;
  const pages = Math.max(1, Math.ceil(total/pageSize));
  let btns='';
  for(let i=1;i<=pages;i++) btns+=`<button class="page-btn ${i===curPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  document.getElementById('refundPag').innerHTML = `
    <div class="pagination-info">共 ${total} 条</div>
    <div class="pagination-pages">
      <button class="page-btn" ${curPage<=1?'disabled':''} onclick="goPage(${curPage-1})"><i data-lucide="chevron-left" style="width:14px"></i></button>
      ${btns}
      <button class="page-btn" ${curPage>=pages?'disabled':''} onclick="goPage(${curPage+1})"><i data-lucide="chevron-right" style="width:14px"></i></button>
    </div>`;
  if(window.lucide) lucide.createIcons();
}
window.goPage = p=>{ curPage=p; renderRefunds(); };

window.viewRefund = function(id){
  const r = refunds.find(x=>x.id===id);
  const html = `<div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">退款详情 <span class="mono text-muted" style="font-size:13px">${r.id}</span> <span class="tag ${statusTagMap[r.status]}" style="margin-left:8px">${r.status}</span></div>
      <div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div>
    </div>
    <div class="modal-body">
      <div class="kv-grid mb-16">
        <div class="kv-item"><div class="k">退款单号</div><div class="v mono">${r.id}</div></div>
        <div class="kv-item"><div class="k">关联订单</div><div class="v mono">${r.order}</div></div>
        <div class="kv-item"><div class="k">客户</div><div class="v">${r.customer}（${r.phone}）</div></div>
        <div class="kv-item"><div class="k">退款金额</div><div class="v font-bold text-error">¥${r.amount}</div></div>
        <div class="kv-item"><div class="k">原支付方式</div><div class="v">${r.payMethod}</div></div>
        <div class="kv-item"><div class="k">退款方式</div><div class="v">${r.refundMethod}</div></div>
        <div class="kv-item"><div class="k">退款原因</div><div class="v">${r.reason}</div></div>
        <div class="kv-item"><div class="k">申请时间</div><div class="v">${r.time}</div></div>
      </div>

      <div class="divider"></div>
      <div class="font-medium mb-12">证明材料</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="width:100px;height:100px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--border-light)">
          <i data-lucide="image" style="color:var(--text-4)"></i>
        </div>
        <div style="width:100px;height:100px;border:1px dashed var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);cursor:pointer" onclick="toast('模拟上传图片','info')">
          <i data-lucide="upload-cloud" style="margin-bottom:4px"></i><span style="font-size:12px">上传</span>
        </div>
      </div>

      <div class="divider"></div>
      <div class="font-medium mb-12">退款流程时间轴</div>
      <div class="timeline">
        <div class="timeline-item success"><div class="timeline-time">${r.time}</div><div class="timeline-title">退款申请</div><div class="timeline-desc">客户「${r.customer}」申请退款，原因：${r.reason}</div></div>
        ${r.status!=='待审批'?`<div class="timeline-item success"><div class="timeline-time">${r.time}</div><div class="timeline-title">前台受理</div><div class="timeline-desc">张前台受理退款申请，金额 ¥${r.amount}</div></div>`:''}
        ${r.status==='审批中'?`<div class="timeline-item warning"><div class="timeline-time">进行中</div><div class="timeline-title">${r.approver}</div><div class="timeline-desc">按金额分级审批中，请等待</div></div>`:''}
        ${r.status==='已退款'?`<div class="timeline-item success"><div class="timeline-time">${r.time}</div><div class="timeline-title">退款完成</div><div class="timeline-desc">${r.refundMethod} ¥${r.amount}，审批人：${r.approver}</div></div>`:''}
        ${r.status==='已拒绝'?`<div class="timeline-item error"><div class="timeline-time">${r.time}</div><div class="timeline-title">退款被拒</div><div class="timeline-desc">${r.approver} 拒绝，原因：不符合退款政策</div></div>`:''}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">关闭</button>
    </div>
  </div>`;
  openModal(html);
};

window.approveRefund = function(id){
  const r = refunds.find(x=>x.id===id);
  // 分级审批逻辑
  let chain = '前台 → 运营';
  if(r.amount >= 500) chain = '前台 → 运营 → 财务 → 场馆负责人';
  else if(r.amount >= 200) chain = '前台 → 运营 → 财务';
  const html = `<div class="modal">
    <div class="modal-header"><div class="modal-title">退款审批 - ${r.id}</div><div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div></div>
    <div class="modal-body">
      <div class="card" style="background:var(--primary-bg);border-color:var(--primary);margin-bottom:16px">
        <div class="card-body" style="padding:12px 16px">
          <div class="text-muted" style="font-size:12px">当前审批级</div>
          <div class="font-bold mt-4">${r.approver}</div>
          <div class="text-muted" style="font-size:12px;margin-top:4px">审批链路：${chain}</div>
        </div>
      </div>
      <div class="kv-grid mb-16">
        <div class="kv-item"><div class="k">客户</div><div class="v">${r.customer}</div></div>
        <div class="kv-item"><div class="k">退款金额</div><div class="v font-bold text-error">¥${r.amount}</div></div>
        <div class="kv-item"><div class="k">原支付</div><div class="v">${r.payMethod}</div></div>
        <div class="kv-item"><div class="k">退款方式</div><div class="v">${r.refundMethod}</div></div>
      </div>
      <div class="form-item"><label class="form-label">审批意见</label><textarea class="form-textarea" placeholder="请输入审批意见"></textarea></div>
      <div class="form-hint">注意：整单退款不支持部分退款；储值退余额、次卡退次数将自动处理</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-danger" onclick="toast('已拒绝退款','warning');this.closest('.modal-overlay').remove()">拒绝</button>
      <button class="btn btn-success" onclick="toast('审批通过，退款已发起','success');this.closest('.modal-overlay').remove()">通过</button>
    </div>
  </div>`;
  openModal(html);
};

// 发起退款
window.openRefundModal = function(){
  const html = `<div class="modal modal-lg">
    <div class="modal-header"><div class="modal-title">发起退款</div><div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div></div>
    <div class="modal-body">
      <div class="form-item"><label class="form-label">关联订单号<span class="required">*</span></label>
        <div class="input-group">
          <input class="form-input" id="r-order" placeholder="输入或扫描订单号">
          <button class="btn btn-default" onclick="toast('已带入订单 ORD20261030001','info');document.getElementById('r-order').value='ORD20261030001';document.getElementById('r-customer').value='陈晓明';document.getElementById('r-amount').value='240';">带入</button>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item"><label class="form-label">客户</label><input class="form-input" id="r-customer" readonly></div>
        <div class="form-item"><label class="form-label">订单金额</label><input class="form-input" id="r-amount" readonly></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label class="form-label">原支付方式</label>
          <select class="form-select" id="r-pay">
            <option>在线支付</option><option>现金</option><option>储值余额</option><option>次卡</option>
          </select>
        </div>
        <div class="form-item"><label class="form-label">退款方式（按原渠道退回）</label>
          <select class="form-select" id="r-method">
            <option>原路退回（微信）</option>
            <option>原路退回（支付宝）</option>
            <option>退回储值余额</option>
            <option>次卡退回（+1次）</option>
            <option>现金退还</option>
          </select>
        </div>
      </div>
      <div class="form-item"><label class="form-label">退款原因<span class="required">*</span></label>
        <select class="form-select"><option>客户取消</option><option>场地维修</option><option>天气原因</option><option>赛事改期</option><option>重复下单</option><option>其他</option></select>
      </div>
      <div class="form-item"><label class="form-label">证明材料</label>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <div style="width:90px;height:90px;border:1px dashed var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);cursor:pointer" onclick="toast('模拟上传','info')">
            <i data-lucide="upload-cloud"></i><span style="font-size:11px;margin-top:4px">上传图片</span>
          </div>
        </div>
      </div>
      <div class="card" style="background:var(--warning-bg);border-color:var(--warning);margin-top:12px">
        <div class="card-body" style="padding:12px 16px;font-size:13px;color:var(--warning)">
          <i data-lucide="alert-triangle" style="width:16px;vertical-align:-3px"></i> 整单退款不支持部分退款；储值退余额、次卡退次数将自动原路退回
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="toast('退款申请已提交，进入审批流程','success');this.closest('.modal-overlay').remove()">提交退款</button>
    </div>
  </div>`;
  openModal(html);
};

// 押金退还
window.openDepositRefund = function(){
  const html = `<div class="modal">
    <div class="modal-header"><div class="modal-title">押金退还</div><div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div></div>
    <div class="modal-body">
      <div class="form-item"><label class="form-label">租赁单号</label><input class="form-input" placeholder="输入租赁单号"></div>
      <div class="form-row">
        <div class="form-item"><label class="form-label">客户</label><input class="form-input" value="陈晓明" readonly></div>
        <div class="form-item"><label class="form-label">押金金额</label><input class="form-input" value="¥200" readonly></div>
      </div>
      <div class="form-item"><label class="form-label">退还方式</label>
        <select class="form-select"><option>现金退还</option><option>原路退回</option><option>退回储值余额</option></select>
      </div>
      <div class="form-item"><label class="form-label">物品校验</label>
        <div style="display:flex;gap:8px">
          <label class="switch"><input type="checkbox" checked><span class="switch-slider"></span></label>
          <span style="font-size:13px">物品完好无损，可全额退还押金</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-success" onclick="toast('押金 ¥200 已退还','success');this.closest('.modal-overlay').remove()">确认退还</button>
    </div>
  </div>`;
  openModal(html);
};

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(p=>p.style.display = p.dataset.panel===name?'block':'none');
}

document.getElementById('page-content').innerHTML = `
<div class="page-header">
  <div class="page-title">取消与退款</div>
  <div class="page-desc">按原支付渠道原路退回，支持分级审批与证明材料上传</div>
</div>

<div class="stats-grid">
  <div class="stat-card"><div class="stat-label">本月退款笔数 <span class="stat-icon red"><i data-lucide="rotate-ccw"></i></span></div><div class="stat-value">28</div><div class="stat-trend down">退款率 2.1%</div></div>
  <div class="stat-card"><div class="stat-label">本月退款金额 <span class="stat-icon orange"><i data-lucide="banknote"></i></span></div><div class="stat-value">¥8,620</div><div class="stat-trend down">较上月 -12%</div></div>
  <div class="stat-card"><div class="stat-label">待审批 <span class="stat-icon purple"><i data-lucide="clock"></i></span></div><div class="stat-value" style="color:var(--warning)">5</div><div class="stat-trend" style="color:var(--text-3)">待处理</div></div>
  <div class="stat-card"><div class="stat-label">平均退款时长 <span class="stat-icon cyan"><i data-lucide="timer"></i></span></div><div class="stat-value">2.4h</div><div class="stat-trend up">较上月 -0.6h</div></div>
</div>

<div class="card">
  <div class="card-body" style="padding-bottom:0">
    <div class="tabs" style="margin-bottom:0">
      <div class="tab active" data-tab="refund" onclick="switchTab('refund')">退款列表</div>
      <div class="tab" data-tab="deposit" onclick="switchTab('deposit')">押金退还</div>
    </div>
  </div>

  <div class="tab-panel" data-panel="refund">
    <div class="card-body">
      <div class="toolbar">
        <div class="filter-group">
          <select class="form-select" id="rfStatus" onchange="curPage=1;renderRefunds()">
            <option value="">全部状态</option><option>已退款</option><option>审批中</option><option>待审批</option><option>已拒绝</option>
          </select>
          <select class="form-select">
            <option value="">全部退款方式</option><option>原路退回</option><option>退回储值余额</option><option>次卡退回</option><option>现金退还</option>
          </select>
        </div>
        <input class="form-input" id="rfKw" placeholder="退款单号/订单号/客户" style="width:240px" oninput="curPage=1;renderRefunds()">
        <div class="spacer"></div>
        <button class="btn btn-default" onclick="toast('已导出退款单','success')"><i data-lucide="download"></i> 导出</button>
        <button class="btn btn-primary" onclick="openRefundModal()"><i data-lucide="plus"></i> 发起退款</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>退款单号</th><th>关联订单</th><th>客户</th><th class="text-right">金额</th><th>原支付</th><th>退款方式</th><th>原因</th><th>状态</th><th>审批人</th><th>操作</th></tr></thead>
          <tbody id="refundTbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="refundPag"></div>
    </div>
  </div>

  <div class="tab-panel" data-panel="deposit" style="display:none">
    <div class="card-body">
      <div class="toolbar">
        <input class="form-input" placeholder="搜索租赁单号/客户" style="width:260px">
        <select class="form-select"><option>全部状态</option><option>待退还</option><option>已退还</option></select>
        <div class="spacer"></div>
        <button class="btn btn-primary" onclick="openDepositRefund()"><i data-lucide="refund"></i> 押金退还</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>租赁单号</th><th>客户</th><th>租赁物品</th><th class="text-right">押金</th><th>租赁时间</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td class="mono">RT20261030001</td><td>陈晓明</td><td>网球拍 ×2</td><td class="text-right">¥400</td><td>2026-10-30 10:00</td><td><span class="tag tag-orange">待退还</span></td><td><button class="btn btn-ghost btn-sm" onclick="openDepositRefund()">退还</button></td></tr>
            <tr><td class="mono">RT20261029003</td><td>林雅婷</td><td>羽毛球拍 ×1</td><td class="text-right">¥150</td><td>2026-10-29 14:00</td><td><span class="tag tag-green">已退还</span></td><td><button class="btn btn-ghost btn-sm" onclick="toast('查看详情','info')">详情</button></td></tr>
            <tr><td class="mono">RT20261028005</td><td>鹭岛俱乐部</td><td>篮球 ×3</td><td class="text-right">¥300</td><td>2026-10-28 19:00</td><td><span class="tag tag-orange">待退还</span></td><td><button class="btn btn-ghost btn-sm" onclick="openDepositRefund()">退还</button></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
`;

renderRefunds();
if(window.lucide) lucide.createIcons();
</script>
</body>
</html>

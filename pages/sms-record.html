function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function money(n){ return (Number(n) || 0).toFixed(2); }
function pct(a, b){ return b ? (a / b * 100).toFixed(1) + '%' : '—'; }

  var d = new Date();
  var p = function(n){ return String(n).padStart(2, '0'); };

/* ========== 统计卡 ========== */
function monthRecords(){
  return RECORDS.filter(function(r){ return r.time.indexOf('2026-11') === 0; });
}
function renderRecordStats(){
  var el = document.getElementById('rec-stats');
  if(!el) return;

  var fee = list.length * COST_PER_SMS;
  el.innerHTML = `
    <div class="stat-card">
      <div class="stat-label">本月发送量 <span class="stat-icon blue"><i data-lucide="send"></i></span></div>

      <div class="stat-trend down"><i data-lucide="alert-triangle" style="width:14px"></i>待回执 ${pending} 条</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">成功率 <span class="stat-icon purple"><i data-lucide="percent"></i></span></div>
      <div class="stat-value">${rate}<span style="font-size:16px">%</span></div>
      <div class="stat-trend"><div class="progress" style="width:100%;max-width:140px"><div class="progress-bar" style="width:${rate}%;background:var(--purple)"></div></div></div>
    </div>

      <div class="stat-trend"><i data-lucide="receipt" style="width:14px;color:var(--text-3)"></i>按 ¥${COST_PER_SMS}/条 计费</div>
    </div>`;

}

/* ========== 发送记录 ========== */
function recordFiltered(){
  var st = document.getElementById('r-status') ? document.getElementById('r-status').value : '';
  var tpl = document.getElementById('r-template') ? document.getElementById('r-template').value : '';
  var start = document.getElementById('r-start') ? document.getElementById('r-start').value : '';
  var end = document.getElementById('r-end') ? document.getElementById('r-end').value : '';
  var kw = document.getElementById('r-kw') ? document.getElementById('r-kw').value.trim() : '';
  return RECORDS.filter(function(r){
    if(st && r.status !== st) return false;
    if(tpl && r.template !== tpl) return false;
    var date = r.time.slice(0, 10);
    if(start && date < start) return false;
    if(end && date > end) return false;
    if(kw && !(r.phone.indexOf(kw) > -1 || r.template.indexOf(kw) > -1 || r.content.indexOf(kw) > -1 || r.id.indexOf(kw) > -1)) return false;
    return true;
  });
}

function recordRows(list){
  if(!list.length){
    return '<tr><td colspan="8"><div class="empty"><div class="empty-icon"><i data-lucide="inbox"></i></div><div class="empty-text">当前筛选条件下暂无发送记录</div></div></td></tr>';
  }
  return list.map(function(r){
    var statusTag = r.status === '成功' ? 'tag-green' : (r.status === '失败' ? 'tag-red' : 'tag-orange');
    var action = r.status === '成功'
      ? '<span class="text-muted" style="font-size:12px">已送达</span>'
      : `<button class="btn btn-default btn-sm" onclick="resendRecord('${r.id}')"><i data-lucide="rotate-ccw" style="width:13px"></i>重发</button>`;
    return `<tr>
      <td class="mono" style="font-size:13px">${esc(r.phone)}</td>
      <td><div class="font-medium" style="font-size:13px">${esc(r.template)}</div><div class="text-muted" style="font-size:12px">${esc(r.scene)} · ${esc(r.venue)}</div></td>
      <td style="max-width:280px;font-size:13px;color:var(--text-2)">${esc(r.content)}</td>
      <td style="font-size:13px;white-space:nowrap">${esc(r.time)}</td>
      <td><span class="tag ${statusTag}">${r.status}</span></td>
      <td style="font-size:12px;color:${r.failReason ? 'var(--error)' : 'var(--text-3)'}">${r.failReason ? esc(r.failReason) : '—'}</td>
      <td style="font-size:13px;color:var(--text-3)">${r.receipt ? esc(r.receipt) : '—'}</td>
      <td class="actions">${action}</td>
    </tr>`;
  }).join('');
}

function renderRecPager(total){
  var el = document.getElementById('rec-pager');
  if(!el) return;
  var pages = Math.max(1, Math.ceil(total / REC_PAGE_SIZE));
  if(REC_PAGE > pages) REC_PAGE = pages;
  var btns = '';
  for(var i = 1; i <= pages; i++){
    btns += '<button class="page-btn ' + (i === REC_PAGE ? 'active' : '') + '" onclick="gotoRecPage(' + i + ')">' + i + '</button>';
  }
  el.innerHTML = '<div class="pagination-info">共 ' + total + ' 条记录 · 第 ' + REC_PAGE + '/' + pages + ' 页</div>' +
    '<div class="pagination-pages">' +
    '<button class="page-btn" ' + (REC_PAGE <= 1 ? 'disabled' : '') + ' onclick="gotoRecPage(' + (REC_PAGE - 1) + ')"><i data-lucide="chevron-left" style="width:14px"></i></button>' +
    btns +
    '<button class="page-btn" ' + (REC_PAGE >= pages ? 'disabled' : '') + ' onclick="gotoRecPage(' + (REC_PAGE + 1) + ')"><i data-lucide="chevron-right" style="width:14px"></i></button>' +
    '</div>';
  refreshIcons();
}

function renderRecordTable(){
  var list = recordFiltered();
  var start = (REC_PAGE - 1) * REC_PAGE_SIZE;
  var rows = document.getElementById('rec-rows');
  if(rows){
    rows.innerHTML = recordRows(list.slice(start, start + REC_PAGE_SIZE));
  }
  var cnt = document.getElementById('rec-count');
  if(cnt) cnt.textContent = '筛选结果 ' + list.length + ' 条';
  renderRecPager(list.length);
  refreshIcons();
}

function gotoRecPage(n){
  REC_PAGE = n;
  renderRecordTable();
}

function applyRecordFilters(){
  REC_PAGE = 1;
  renderRecordTable();
}

function resendRecord(id){
  var r = RECORDS.find(function(x){ return x.id === id; });
  if(!r) return;
  if(r.status === '成功'){ toast('该记录已发送成功，无需重发', 'info'); return; }
  r.status = '成功';
  r.receipt = nowStr();
  r.failReason = '';
  renderRecordStats();
  renderRecordTable();
  if(activeTab === 'stats') renderStatsTab();
  toast('记录 ' + r.id + ' 已重发成功，回执已回写', 'success');
}

/* ========== 发送统计 ========== */
var STAT_FILTER = {range:'2026-11', scene:'', template:'', venue:''};
var RANGE_LABEL = {'2026-11':'本月（2026-11）', '2026-10':'上月（2026-10）', 'last7':'近 7 天', 'all':'全部时间'};

function statFiltered(){
  return RECORDS.filter(function(r){
    var date = r.time.slice(0, 10);
    if(STAT_FILTER.range === '2026-11' && r.time.indexOf('2026-11') !== 0) return false;
    if(STAT_FILTER.range === '2026-10' && r.time.indexOf('2026-10') !== 0) return false;
    if(STAT_FILTER.range === 'last7' && date < '2026-10-30') return false;
    if(STAT_FILTER.scene && r.scene !== STAT_FILTER.scene) return false;
    if(STAT_FILTER.template && r.template !== STAT_FILTER.template) return false;
    if(STAT_FILTER.venue && r.venue !== STAT_FILTER.venue) return false;
    return true;
  });
}

function statGroups(list){
  var map = {};
  list.forEach(function(r){
    var d = r.time.slice(0, 10);
    if(!map[d]) map[d] = {date:d, total:0, success:0, fail:0, pending:0, fee:0};
    map[d].total++;
    map[d].fee += COST_PER_SMS;
    if(r.status === '成功') map[d].success++;
    else if(r.status === '失败') map[d].fail++;
    else map[d].pending++;
  });
  return Object.keys(map).sort().reverse().map(function(k){ return map[k]; });
}

function onStatFilter(){
  STAT_FILTER.range = document.getElementById('s-range').value;
  STAT_FILTER.scene = document.getElementById('s-scene').value;
  STAT_FILTER.template = document.getElementById('s-template').value;
  STAT_FILTER.venue = document.getElementById('s-venue').value;
  renderStatsTab();
}

function renderStatsTab(){
  var el = document.getElementById('tab-stats');
  if(!el) return;
  var list = statFiltered();
  var groups = statGroups(list);
  var total = list.length;
  var success = list.filter(function(r){ return r.status === '成功'; }).length;
  var fail = list.filter(function(r){ return r.status === '失败'; }).length;
  var fee = total * COST_PER_SMS;
  var max = groups.reduce(function(m, g){ return Math.max(m, g.total); }, 0);

  var rows = groups.map(function(g){
    return `<tr>
      <td style="font-size:13px">${g.date}</td>
      <td class="text-right">${g.total}</td>
      <td class="text-right text-success">${g.success}</td>
      <td class="text-right ${g.fail ? 'text-error' : 'text-muted'}">${g.fail}</td>
      <td class="text-right">${pct(g.success, g.total)}</td>
      <td class="text-right">¥${money(g.fee)}</td>
    </tr>`;
  }).join('');

  if(!groups.length){
    rows = '<tr><td colspan="6"><div class="empty"><div class="empty-icon"><i data-lucide="bar-chart-3"></i></div><div class="empty-text">当前条件下暂无统计数据</div></div></td></tr>';
  } else {
    rows += `<tr style="background:#fafafa;font-weight:600">
      <td>合计</td>
      <td class="text-right">${total}</td>
      <td class="text-right text-success">${success}</td>
      <td class="text-right text-error">${fail}</td>
      <td class="text-right">${pct(success, total)}</td>
      <td class="text-right">¥${money(fee)}</td>
    </tr>`;
  }

  var bars = groups.slice().reverse().map(function(g){
    var h = max ? Math.max(8, Math.round(g.total / max * 150)) : 8;
    return `<div class="bar">
      <span style="font-size:11px;color:var(--text-3)">${g.total}</span>
      <div class="bar-fill" style="height:${h}px"></div>
      <div class="bar-label">${g.date.slice(5)}</div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="card mb-16">
      <div class="card-body">
        <div class="toolbar" style="margin-bottom:0">
          <select class="form-select" id="s-range" onchange="onStatFilter()">
            ${Object.keys(RANGE_LABEL).map(function(k){ return '<option value="' + k + '"' + (STAT_FILTER.range === k ? ' selected' : '') + '>' + RANGE_LABEL[k] + '</option>'; }).join('')}
          </select>
          <select class="form-select" id="s-scene" onchange="onStatFilter()">
            <option value="">全部场景</option>
            ${['会员充值','预约','余额提醒','消费','活动通知'].map(function(s){ return '<option value="' + s + '"' + (STAT_FILTER.scene === s ? ' selected' : '') + '>' + s + '</option>'; }).join('')}
          </select>
          <select class="form-select" id="s-template" onchange="onStatFilter()">
            <option value="">全部模板</option>
            ${['充值到账通知','预约确认','余额不足提醒','消费通知','活动通知','开场提醒'].map(function(t){ return '<option value="' + t + '"' + (STAT_FILTER.template === t ? ' selected' : '') + '>' + t + '</option>'; }).join('')}
          </select>
          <select class="form-select" id="s-venue" onchange="onStatFilter()">
            <option value="">全部场馆</option>
            ${['总部','篮球公园','网球中心','羽毛球馆'].map(function(v){ return '<option value="' + v + '"' + (STAT_FILTER.venue === v ? ' selected' : '') + '>' + v + '</option>'; }).join('')}
          </select>
          <div class="spacer"></div>
          <span class="text-muted" style="font-size:13px">${RANGE_LABEL[STAT_FILTER.range]} · 共 ${total} 条</span>
          <button class="btn btn-primary btn-sm" onclick="exportStats()"><i data-lucide="download" style="width:14px"></i>导出统计</button>
        </div>
      </div>
    </div>

    <div class="card mb-16">
      <div class="card-header">
        <div class="card-title">按日发送量</div>
        <span class="text-muted" style="font-size:12px">柱高按当日发送量占比绘制</span>
      </div>
      <div class="card-body">
        <div class="bar-chart" style="height:210px">${bars || '<div class="empty" style="width:100%"><div class="empty-icon"><i data-lucide="bar-chart-3"></i></div><div class="empty-text">暂无数据</div></div>'}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">汇总明细</div>
        <div class="flex gap-8" style="flex-wrap:wrap">
          <span class="tag tag-green">成功 ${success}</span>
          <span class="tag tag-red">失败 ${fail}</span>
          <span class="tag tag-orange">待回执 ${total - success - fail}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>日期</th>
                <th class="text-right">发送量</th>
                <th class="text-right">成功量</th>
                <th class="text-right">失败量</th>
                <th class="text-right">成功率</th>
                <th class="text-right">费用（元）</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  refreshIcons();
}

function exportStats(){
  toast('统计报表已导出：' + RANGE_LABEL[STAT_FILTER.range] + '，共 ' + statFiltered().length + ' 条发送记录', 'success');
}

/* ========== Tab ========== */
function showTab(name){
  activeTab = name;
  ['records','stats'].forEach(function(k){
    var btn = document.getElementById('tabbtn-' + k);
    var panel = document.getElementById('tab-' + k);
    if(!btn || !panel) return;
    btn.className = 'tab' + (k === name ? ' active' : '');
    panel.style.display = k === name ? '' : 'none';
  });
  if(name === 'stats') renderStatsTab();
  else renderRecordTable();
}

/* ========== 页面骨架 ========== */
document.getElementById('page-content').innerHTML = `
  <div class="page-header">
    <div class="flex justify-between items-center" style="flex-wrap:wrap;gap:12px">
      <div>
        <div class="page-title">发送记录统计</div>
        <div class="page-desc">查询短信发送明细与回执状态，按时间、场景、模板、场馆多维度汇总发送量与成功率</div>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-default" onclick="renderRecordStats();renderRecordTable();toast('发送记录与统计已刷新','info')"><i data-lucide="refresh-cw"></i>刷新</button>
        <a class="btn btn-primary" href="sms-broadcast.html"><i data-lucide="send"></i>发起群发</a>
      </div>
    </div>
  </div>

  <div class="stats-grid" id="rec-stats"></div>

  <div class="tabs">
    <div class="tab active" id="tabbtn-records" onclick="showTab('records')">发送记录</div>
    <div class="tab" id="tabbtn-stats" onclick="showTab('stats')">发送统计</div>
  </div>

  <div id="tab-records">
    <div class="card">
      <div class="card-header">
        <div class="card-title">发送记录</div>
        <span class="text-muted" style="font-size:13px" id="rec-count"></span>
      </div>
      <div class="card-body">
        <div class="toolbar">
          <select class="form-select" id="r-status" onchange="applyRecordFilters()">
            <option value="">全部状态</option>
            <option value="成功">成功</option>
            <option value="失败">失败</option>
            <option value="待回执">待回执</option>
          </select>
          <select class="form-select" id="r-template" onchange="applyRecordFilters()">
            <option value="">全部模板</option>
            <option value="充值到账通知">充值到账通知</option>
            <option value="预约确认">预约确认</option>
            <option value="余额不足提醒">余额不足提醒</option>
            <option value="消费通知">消费通知</option>
            <option value="活动通知">活动通知</option>
            <option value="开场提醒">开场提醒</option>
          </select>
          <input class="form-input" id="r-start" type="date" onchange="applyRecordFilters()" style="min-width:150px" />
          <input class="form-input" id="r-end" type="date" onchange="applyRecordFilters()" style="min-width:150px" />
          <input class="form-input" id="r-kw" placeholder="搜索手机号 / 模板 / 内容 / 记录号" oninput="applyRecordFilters()" style="min-width:240px" />
          <div class="spacer"></div>
          <span class="text-muted" style="font-size:12px">接收号码已脱敏展示</span>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>接收号码</th>
                <th>模板 / 场景</th>
                <th>短信内容</th>
                <th>发送时间</th>
                <th>状态</th>
                <th>失败原因</th>
                <th>回执时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="rec-rows"></tbody>
          </table>
        </div>
        <div class="pagination" id="rec-pager"></div>
      </div>
    </div>
  </div>

  <div id="tab-stats" style="display:none"></div>
`;

renderRecordStats();
renderRecordTable();
refreshIcons();
</script>
</body>
</html>

const pointConfig = {

  earnScene: ['场地预约','商品购买','物品租赁'],
  useRate: 100, // 100积分=1元
  maxDeduct: 30, // 单笔抵扣上限百分比
  validDays: 365,
};

let curFlowPage = 1, flowPageSize = 10;

function renderFlows(){
  const tp = document.getElementById('flType')?.value||'';
  const kw = (document.getElementById('flKw')?.value||'').trim();
  let list = balanceFlows;
  if(tp) list = list.filter(f=>f.type===tp);
  if(kw) list = list.filter(f=>f.customer.includes(kw)||f.cardNo.includes(kw)||f.orderNo.includes(kw));
  const total = list.length;
  const start = (curFlowPage-1)*flowPageSize;
  const rows = list.slice(start,start+flowPageSize).map(f=>`
    <tr>
      <td style="font-size:13px">${f.time}</td>
      <td><div class="font-medium">${f.customer}</div><div class="text-muted mono" style="font-size:12px">${f.cardNo}</div></td>
      <td><span class="tag ${typeTagMap[f.type]}">${f.type}</span></td>
      <td class="text-right">
        <div ${f.principal>=0?'class="text-success"':'class="text-error"'}>${f.principal>=0?'+':''}¥${f.principal}</div>
        ${f.gift?`<div class="text-warning" style="font-size:12px">赠送 +¥${f.gift}</div>`:''}
      </td>
      <td class="text-right text-muted" style="font-size:13px">本金 ¥${f.beforeP} → ¥${f.afterP}</td>
      <td class="text-right text-muted" style="font-size:13px">赠送 ¥${f.beforeG} → ¥${f.afterG}</td>
      <td class="mono" style="font-size:12px">${f.orderNo}</td>
      <td>${f.operator}</td>
    </tr>`).join('') || `<tr><td colspan="8"><div class="empty"><div class="empty-icon"><i data-lucide="list"></i></div><div class="empty-text">暂无流水</div></div></td></tr>`;
  document.getElementById('flowTbody').innerHTML = rows;
  document.getElementById('flowPag').innerHTML = `<div class="pagination-info">共 ${total} 条</div>`;
  if(window.lucide) lucide.createIcons();
}

// 充值
window.recharge = function(){
  const html = `<div class="modal modal-lg">
    <div class="modal-header"><div class="modal-title">会员充值</div><div class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</div></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-item"><label class="form-label">选择会员<span class="required">*</span></label>
          <select class="form-select" id="rcCust" onchange="updateCurBalance()">
            ${MOCK.members.map(m=>{const c=MOCK.customers.find(x=>x.id===m.customerId);return `<option value="${m.id}" data-balance="${m.balance}" data-gift="${m.giftBalance}">${c?c.name:'-'}（${m.cardNo}）余额 ¥${m.balance}</option>`;}).join('')}
          </select>
        </div>
        <div class="form-item"><label class="form-label">当前余额</label>
          <input class="form-input" id="rcCurBal" value="¥2350（赠送 ¥180）" disabled>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item"><label class="form-label">充值本金（元）<span class="required">*</span></label>
          <input type="number" class="form-input" id="rcPrincipal" value="1000" oninput="calcRecharge()">
        </div>
        <div class="form-item"><label class="form-label">赠送金额（元，自动）</label>
          <input type="number" class="form-input" id="rcGift" value="100" disabled>
          <div class="form-hint">按会员权益配置自动计算</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item"><label class="form-label">收款方式<span class="required">*</span></label>
          <select class="form-select" id="rcPay">
            <option>前台收款 - 现金</option>
            <option>前台收款 - 微信扫码</option>
            <option>前台收款 - 支付宝扫码</option>
            <option>前台收款 - 银行卡</option>
            <option>小程序在线支付</option>
          </select>
        </div>
        <div class="form-item"><label class="form-label">充值后余额</label>
          <input class="form-input" id="rcAfter" value="本金 ¥3350 / 赠送 ¥280" disabled>
        </div>
      </div>
      <div class="form-item"><label class="form-label">备注</label><input class="form-input" placeholder="如：前台现金充值"></div>
      <div style="background:var(--primary-bg);padding:12px 16px;border-radius:6px;color:var(--primary);font-size:13px">
        <i data-lucide="info" style="width:14px;vertical-align:-2px"></i> 充值金额将分本金与赠送两笔额度分别记录，消费时优先扣减赠送金额。退款不收取手续费。
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="toast('充值成功：本金 ¥'+document.getElementById('rcPrincipal').value+'，赠送 ¥'+document.getElementById('rcGift').value,'success');this.closest('.modal-overlay').remove()">确认充值</button>
    </div>
  </div>`;
  openModal(html);
  window.updateCurBalance = function(){
    const sel = document.getElementById('rcCust');
    const opt = sel.options[sel.selectedIndex];
    document.getElementById('rcCurBal').value = `¥${opt.dataset.balance}（赠送 ¥${opt.dataset.gift}）`;
    calcRecharge();
  };
  window.calcRecharge = function(){
    const sel = document.getElementById('rcCust');
    const opt = sel.options[sel.selectedIndex];
    const p = parseFloat(document.getElementById('rcPrincipal').value)||0;
    let g = 0;
    if(p>=5000) g=Math.round(p*0.15); else if(p>=2000) g=Math.round(p*0.10); else if(p>=1000) g=Math.round(p*0.08); else if(p>=500) g=Math.round(p*0.05);
    document.getElementById('rcGift').value = g;
    document.getElementById('rcAfter').value = `本金 ¥${(parseFloat(opt.dataset.balance)+p).toFixed(0)} / 赠送 ¥${(parseFloat(opt.dataset.gift)+g).toFixed(0)}`;
  };
  window.updateCurBalance();
};

        </div>
        <div class="form-item"><label class="form-label">选择会员</label>

          </div>

          <select class="form-select" multiple size="3">
            <option selected>场地预约</option><option selected>商品购买</option><option selected>物品租赁</option><option>赛事报名</option><option>培训</option>
          </select>
        </div>
      </div>
      <div class="divider"></div>
      <div class="font-medium mb-12">使用规则</div>
      <div class="form-row">
        <div class="form-item"><label class="form-label">积分抵扣比例</label>
          <div class="input-group"><input type="number" class="form-input" value="${pointConfig.useRate}"><span class="btn btn-default" style="border-color:var(--border)">积分=1元</span></div>
        </div>
        <div class="form-item"><label class="form-label">单笔抵扣上限（%）</label>
          <input type="number" class="form-input" value="${pointConfig.maxDeduct}">
          <div class="form-hint">单笔订单积分抵扣金额不超过订单总额的 ${pointConfig.maxDeduct}%</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item"><label class="form-label">积分有效期（天）</label>
          <input type="number" class="form-input" value="${pointConfig.validDays}">
          <div class="form-hint">积分自获取之日起 ${pointConfig.validDays} 天内有效，到期自动清零</div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="toast('积分规则配置已保存','success');this.closest('.modal-overlay').remove()">保存</button>
    </div>
  </div>`;
  openModal(html);
};

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(p=>p.style.display = p.dataset.panel===name?'block':'none');
  if(name==='point') renderPointFlows();
  if(name==='coupon') renderCoupons();
}

function renderPointFlows(){
  document.getElementById('pointTbody').innerHTML = pointFlows.map(f=>`
    <tr>
      <td style="font-size:13px">${f.time}</td>
      <td>${f.customer}</td>
      <td><span class="tag ${f.type==='消费获取'?'tag-blue':f.type==='手工调整'?'tag-orange':'tag-gray'}">${f.type}</span></td>
      <td class="text-right ${f.points>0?'text-success':'text-error'}">${f.points>0?'+':''}${f.points}</td>
      <td class="text-right">${f.balance}</td>
      <td class="mono" style="font-size:12px">${f.orderNo}</td>
      <td>${f.operator}</td>
      <td style="font-size:12px;color:var(--text-3)">${f.reason||'-'}</td>
    </tr>`).join('');
}

function renderCoupons(){
  document.getElementById('cpTbody').innerHTML = coupons.map(c=>`
    <tr>
      <td><div class="font-medium">${c.name}</div><div class="text-muted" style="font-size:12px">${c.id}</div></td>
      <td><span class="tag ${c.type==='面额券'?'tag-orange':'tag-purple'}">${c.type}</span></td>
      <td class="text-center font-medium">${c.type==='面额券'?'¥'+c.value:c.value+'折'}</td>
      <td style="font-size:13px">${c.scope}</td>
      <td style="font-size:12px">${c.validFrom}<br>~ ${c.validTo}</td>
      <td class="text-center">${c.used}/${c.total}</td>
      <td><span class="tag ${c.method==='手工发放'?'tag-cyan':'tag-blue'}">${c.method}</span></td>
      <td><span class="tag ${couponTagMap[c.status]}">${c.status}</span></td>
      <td class="actions">
        <button class="btn btn-ghost btn-sm" onclick="issueCoupon('${c.id}')">发放</button>
        <button class="btn btn-ghost btn-sm" onclick="toast('查看 ${c.name} 使用明细','info')">明细</button>
      </td>
    </tr>`).join('');
}
